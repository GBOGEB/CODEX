    - CONTRACT_RTM
    - BIDDER_SELECTED_SOURCE_SUPPORTED
    - DERIVED_THERMODYNAMICS
    - DERIVED_COST
    - POSTULATED

cost_lineage:
  child_authority: GBOGEB/cryoplant-project
  existing_pr_chain: [251, 311, 314, 229, 230, 406, 428, 429]
  parallel_cost_model: forbidden

child_disposition:
  states: [ACCEPT, REJECT, DEFER]
  automatic_acceptance: false

pca_bt_ingress:
  after_child_validation: true
  candidate_dimensions:
    - qve_pressure_margin
    - c24_c30_delta
    - energy_opex_uncertainty
    - controls_capex_uncertainty
    - controls_engineering_hour_uncertainty
    - spares_lifecycle_uncertainty

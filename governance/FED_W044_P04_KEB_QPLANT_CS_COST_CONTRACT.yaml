schema_version: "0.1"
wave: FED-W044
pulse: P04
repository: GBOGEB/CODEX
plane: KEB_governance
intent: validate_typed_qplant_and_qps_cs_cost_driver_returns_before_child_reentry

accepted_return_types:
  - QCELL_PRESSURE_MARGIN
  - LINE_B_SEGMENT_DP
  - HELIUM_PROPERTY_STATE
  - HP_POWER
  - PVPS_POWER
  - HEAT_RECOVERY_DUTY
  - COOLING_WATER_DUTY

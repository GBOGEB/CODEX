schema: codex-ch15-canonical-validation/v1
gate_id: CH15_CANONICAL_VALIDATION
maturity_target: L1_VALIDATED_MODEL
formal_credit_delta: 0

# L1 exit criterion: the governing helium-4 provider (GBOGEB/ABACUS at the
# commit in HE4_PROPERTY_AUTHORITY_PIN.yaml) reproduces the Ch15 worked
# examples within tolerance. Values come from the transcription in
# docs/gistau-ch15/data/worked_examples.json (book Ch15 figures).
#
# Coverage is explicit: every worked example is either CHECKED or EXCLUDED
# with a reason. An excluded example is never counted as passing.
source: docs/gistau-ch15/data/worked_examples.json
tools: tools/ch15_canonical_validation.py

tolerances:
  temperature_abs_K: 0.05        # book figures quote 0.01 K; allows table rounding
  density_rel: 0.005
  enthalpy_abs_J_g: 0.05         # book figures quote 0.01 J/g
  entropy_abs_J_gK: 0.005
  derived_rel: 0.01              # mass flow, power: products of rounded values

checked:
  - WE-T00-REFPROP-HSD-PT-002    # state point 1 bar / 300 K: h, s, rho (absolute)
  - WE-T02-FREE-EXPANSION-HEAT-001   # isenthalpic + 100 W, 14 -> 1 bar from 20 K
  - WE-T02-MASS-FLOW-004         # mdot = Q / (h_out - h_in), 20 K / 4 bar -> 22.5 K / 3.75 bar
  - WE-T02-INVERSION-HELIUM-002     # isenthalpic 14 -> 1 bar with T_out == T_in (Fig. 15.19, Goal Seek)
  - WE-T03-HEAT-EXCHANGER-001       # scenario A rating: 50 g/s 14 bar 300 K vs 45 g/s 1.2 bar 200 -> 297 K
  - WE-T04-CRYOGENIC-EXPANDER-001    # 14 -> 1.2 bar from 25 K, eta_s 0.75
  - WE-T05-CRYOGENIC-COMPRESSOR-001  # 0.5 -> 1.2 bar from 5 K, eta_s 0.75 (book cell K5 is an erratum, below)

# Computed and reported every run, never counted as passing, listed as open
# until the transcription is verified against the source figure.
source_check_required: {}

# Printed cells that the book's own calculation contradicts. Recorded, never
# compared, never counted as passing. Evidence: printed hard copy and CI run.
book_errata:
  WE-T05-CRYOGENIC-COMPRESSOR-001:
    cell: K5 (dH isent, J/g)
    printed: 17.79
    finding: >-
      Printed K5 equals L5 / eta (13.34 / 0.75). The governing provider gives
      an isentropic rise of 10.01 J/g for 0.5 -> 1.2 bar from 5 K (CI run
      39169436822); 10.01 / 0.75 = 13.34 J/g reproduces the printed L5, and the
      printed h1, T2, h2 and power all agree within tolerance. Transcription
      corrected 2026-10-18 from the printed book (outlet 1.20 bar, was 1.70)
      and re-confirmed 2026-10-19 against the original Springer PDF (p. 638).
excluded:
  WE-T00-REFPROP-H-PT-001: duplicate of WE-T00-REFPROP-HSD-PT-002 (same state, h only)
  WE-T00-SATURATION-QUALITY-003: two-phase at 4.21 K; HEPAK-governed (T <= 4.5 K), no HEPAK receipt in CI
  WE-T02-SAT-LIQUID-HELIUM-003: two-phase at 4.41 -> 3.55 K; HEPAK-governed, no HEPAK receipt in CI
  WE-T01-ROOM-TEMP-COMPRESSOR-001: fluid verified as nitrogen (Fig. 15.13; Fig. 15.12 caption says helium but shows the nitrogen sheet, recorded as book erratum); outside the governing helium-4 provider
  WE-T06-EQUIVALENT-POWER-001: per-domain inputs transcribed 2026-10-19 (Carnot total 906792 W, was mis-read 906643); two-phase isothermal/liquid domains at 4.4087 K are HEPAK-governed, no HEPAK receipt in CI

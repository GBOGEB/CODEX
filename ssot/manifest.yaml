schema_version: "1.2"
repository: GBOGEB/CODEX
release_program: CODEX_2_0

principles:
  engineering_awareness: true
  engineering_authority: false
  doctrine: >-
    CODEX may understand engineering truth, transport it, interrogate it and
    challenge it. CODEX must not own or silently change engineering truth
    unless that engineering domain is explicitly assigned to CODEX.

authority_classes:
  - LOCAL_AUTHORITATIVE
  - REMOTE_AUTHORITATIVE
  - DERIVED
  - MATERIALIZED_VIEW
  - RECEIPT
  - COMPATIBILITY
  - HISTORICAL
  - MIRRORED_REFERENCE

authorities:
  codex_release_identity:
    logical_id: CODEX_RELEASE_IDENTITY
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_RELEASE_GOVERNANCE
    path: ssot/domain/repo/release.yaml

  authority_manifest:
    logical_id: CODEX_AUTHORITY_MANIFEST
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_GOVERNANCE
    path: ssot/manifest.yaml

  master_contract:
    logical_id: CODEX_MASTER_CONTRACT
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_CONTRACT_GOVERNANCE
    path: ssot/master_contract_ssot_v0_2.yaml
    schema: schemas/master_contract_ssot.schema.yaml

  semantic_vocabulary:
    logical_id: CODEX_SEMANTIC_VOCABULARY
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_SEMANTIC_GOVERNANCE
    path: PIPELINE/GLOSSARY.yaml

  semantic_substrate:
    logical_id: CODEX_SEMANTIC_SUBSTRATE
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_SEMANTIC_GOVERNANCE
    path: semantic_substrate/overlay_ssot.yaml

  runtime_governance:
    logical_id: CODEX_RUNTIME_GOVERNANCE
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_RUNTIME_GOVERNANCE
    path: SSOT/g10_runtime_governance_ssot.yaml

  runtime_registry:
    logical_id: CODEX_RUNTIME_REGISTRY
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_RUNTIME_GOVERNANCE
    path: ssot/registry/runtime_registry.yaml

  mcp_governance:
    logical_id: CODEX_MCP_GOVERNANCE
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_FEDERATION_GOVERNANCE
    path: SSOT/github_mcp_agentic_orchestration_ssot.yaml

  tri_repo_release_assurance:
    logical_id: TRI_REPO_RELEASE_ASSURANCE_CONTRACT
    authority_class: LOCAL_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: CODEX_RELEASE_GOVERNANCE
    path: release/TRI_REPO_RELEASE_ASSURANCE_CONTRACT_v1.yaml

  qps_engineering_truth:
    logical_id: QPS_ENGINEERING_TRUTH
    authority_class: REMOTE_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: QPS_ENGINEERING
    owner_repository: GBOGEB/cryoplant-project
    local_role: MIRRORED_REFERENCE
    mutation_allowed: false
    promotion_allowed: false

  dow_execution_truth:
    logical_id: ABACUS_DOW_CHALLENGE
    authority_class: REMOTE_AUTHORITATIVE
    lifecycle: ACTIVE
    owner: ABACUS_DOW
    owner_repository: GBOGEB/ABACUS
    local_role: RECEIPT_ONLY
    mutation_allowed: false
    engineering_promotion_allowed: false

derived_or_compatibility:
  version_json:
    logical_id: CODEX_RELEASE_IDENTITY_VIEW
    authority_class: MATERIALIZED_VIEW
    path: VERSION.json
    parent: CODEX_RELEASE_IDENTITY
  authority_registry:
    logical_id: CODEX_AUTHORITY_REGISTRY_VIEW
    authority_class: MATERIALIZED_VIEW
    path: ssot/registry/authority_registry.yaml
    parent: CODEX_AUTHORITY_MANIFEST
  ssot_style_bridge:
    logical_id: CODEX_SSOT_STYLE_BRIDGE
    authority_class: COMPATIBILITY
    path: ssot/ssot_style_bridge.json
    owner: render_governance

candidate_census:
  status: RECURSIVE_W05_ACTIVE
  source: triage/REPO_CENSUS.yaml
  note: >-
    Recursive census is active. Discovery does not establish authority; only
    entries in this canonical manifest establish declared authority.

invariants:
  one_authority_per_logical_fact: true
  remote_engineering_mutation_forbidden: true
  receipt_cannot_become_engineering_source: true
  derived_view_cannot_become_authority: true
  dow_result_cannot_auto_promote_child_state: true
  child_disposition_remains_child_owned: true
  exact_source_identity_required:
    - commit_sha
    - git_blob_sha
    - sha256

release_gates:
  authority_integrity:
    duplicate_authority_count: 0
    unauthorized_engineering_mutation_count: 0
    orphan_authoritative_node_count: 0
    unknown_authority_node_count: 0

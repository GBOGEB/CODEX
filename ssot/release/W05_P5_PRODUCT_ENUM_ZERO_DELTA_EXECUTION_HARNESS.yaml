      current_hash_status: PENDING_EXECUTION
      current_rebuild_status: PENDING_EXECUTION
      current_zero_delta_status: PENDING_EXECUTION
sha256s_execution_contract:
  preferred_output_path: release/SHA256SUMS
  alternate_output_paths:
    - release/checksums.sha256
    - artifacts/SHA256SUMS
  execution_command_template: >-
    find . -type f \( -name '*.xlsx' -o -name '*.docx' -o -name '*.pptx' -o -name '*.pdf' -o -name '*.html' \)
    -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
  execution_status: NOT_RUN_IN_THIS_PR
  reason_not_run: >-
    GitHub connector can create repository receipts but cannot execute repo build
    or hash binary bytes in this turn. Exact hashes must be produced by CI or a
    checked-out runner.
rebuild_log_execution_contract:
  preferred_output_path: release/REBUILD_LOG.yaml
  alternate_output_paths:
    - release/rebuild_receipts.yaml
    - artifacts/REBUILD_LOG.yaml
  required_fields:
    - source_commit_sha
    - builder_workflow_or_script
    - product_path
    - input_authority_paths
    - generated_at_utc
    - output_sha256
    - result
  execution_status: NOT_RUN_IN_THIS_PR
zero_delta_execution_harness:
  preferred_receipt_path: release/ZERO_DELTA_RECEIPT.yaml
  alternate_receipt_path: artifacts/ZERO_DELTA_RECEIPT.yaml
  workflow_status: DEFINED_READY_NOT_EXECUTED
  required_steps:
    - checkout_exact_source_commit
    - freeze_authority_inputs
    - first_regeneration
    - write_first_SHA256SUMS_and_REBUILD_LOG
    - clean_output_workspace
    - second_regeneration_same_inputs
    - write_second_SHA256SUMS_and_REBUILD_LOG
    - compare_hashes_or_render_tolerance_receipts
    - write_ZERO_DELTA_RECEIPT_only_after_execution
  pass_claim_allowed_now: false
  pass_claim_rule: >-
    ZERO_DELTA_PASS may only be claimed after both generations complete and the
    receipt records byte-identical hashes or explicit governed tolerance deltas.
execution_boundary:
  products_regenerated: false
  actual_sha256s_written: false
  actual_rebuild_log_written: false
  zero_delta_run: false
  zero_delta_receipt_written: false
  product_parity: NOT_YET
  global_codex_2_0: NOT_YET
next_mechanical_steps:
  - add_ci_workflow_or_runner_job_to_execute_sha256s_and_rebuild_log
  - execute product regeneration for qps_cost_roundtrip
  - commit or upload SHA256SUMS and REBUILD_LOG as governed artifacts
  - execute second regeneration and write ZERO_DELTA_RECEIPT
  - only then promote product_parity from NOT_YET

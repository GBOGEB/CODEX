schema_version: "1.0"
release_program: CODEX_2_0
wave: W005
pulse: P5
status: PRODUCT_ENUMERATED_ZERO_DELTA_HARNESS_READY_NOT_EXECUTED
source_reentry:
  from_w05_p4_pr: 475
  from_w05_p4_merge: 52a9457f55fcdc65fdf3ee33a199901c39321b5a
  rule: >-
    P5 enumerates concrete product candidates from the repository-visible binary
    product registry and defines the execution harness for SHA256SUMS, REBUILD_LOG
    and ZERO_DELTA_RECEIPT. Actual hashes, rebuild receipts and zero-delta pass
    claims require execution over repository bytes and regenerated outputs.
concrete_product_enumeration:
  source_manifest:
    path: triage/BINARY_PRODUCT_REGISTRY.yaml
    evidence_status: FOUND_BY_REPO_SEARCH
    authority_rule: generated_products_are_release_children
  product_families:
    qps_cost_roundtrip:
      state: GENERATED
      products:
        - QPS_COST_Master.xlsx
        - QPS_Cost_Engineering_Handover.docx
        - QPS_Cost_Management_Deck.pptx
        - QPS_Cost_Engineering_Handover.pdf
        - index.html
      controls:
        - QA_REPORT.md
        - RELEASE_NOTES.md
        - BUILD_META.json
      classification: DERIVED_RELEASE_CHILDREN_NOT_AUTHORITY

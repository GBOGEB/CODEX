$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/GBOGEB/CODEX/ssot/schemas/keb_row.schema.yaml
title: KEB receipt row
type: object
required:
  - keb_item_id
  - object_type
  - source_repo
  - source_pr
  - source_sha
  - source_locator
  - source_digest
  - replay_status
  - validation_result
  - downstream_consumer
  - next_action
  - lineage
properties:
  keb_item_id:
    type: string
    pattern: '^KEB-ITEM-[0-9]{4}$'
  object_type:
    type: string
    enum:
      - KEB_KNOWLEDGE_ATOM
      - KEB_SOURCE_RECEIPT
      - KEB_RUNTIME_PROOF
      - KEB_REPLAY_EVIDENCE
      - KEB_EXACT_SHA_BINDING
      - KEB_VALIDATION_RESULT
      - KEB_DOWNSTREAM_CONSUMER
      - KEB_DEFER_REASON
      - KEB_ACTION
  source_repo:
    anyOf:
      - type: string
      - type: 'null'
  source_pr:
    anyOf:
      - type: integer
      - type: 'null'
  source_sha:
    anyOf:
      - type: string
      - type: 'null'
  source_locator:
    anyOf:
      - type: string
      - type: 'null'
  source_digest:
    anyOf:
      - type: string
      - type: 'null'
  replay_status:
    type: string
    enum: [PASS, FAIL, DEFER]
  validation_result:
    type: string
  downstream_consumer:
    anyOf:
      - type: string
      - type: 'null'
  next_action:
    type: string
  lineage:
    type: object
    required: [chat_session, originating_prompt, created_by]

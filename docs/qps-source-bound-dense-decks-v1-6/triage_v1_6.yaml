non_compensating_rules:
  - a visual/navigation/publication PASS cannot grant engineering acceptance
  - source/content DoV does not validate OPEN/WIP engineering statements
  - retained source receipts cannot be invalidated by a stale narrative snapshot without contradictory execution evidence
  - historical tuple summaries cannot override stronger current TRIAGE/evidence
  - derivative requirement tables cannot override authoritative Addendum numbering/content
  - source age is not source invalidity; D2.1 and D2.2 remain traceable anchors until explicit governed replacement/withdrawal is established
  - D2.1 is process conceptual-design authority; D2.2 is technical/project-requirements authority; current Addendum II refines the contractual tender boundary
  - current selected FSD575 maximum point is not automatically the LOOP operating point
  - 357 kW plus/minus 5 percent at 112 g/s does not prove margin inside the 350 kW EPS limit
  - interpolation from the 112 g/s / 357 kW maximum point cannot substitute for the U1.5 source-bound supplier return
  - U1.5 route binding is not U1.5 evidence receipt and grants zero engineering closure credit
  - negotiation source coverage or silence is not confirmed compliance
  - two compressors connected to EPS does not mean two compressors run simultaneously during LOOP
  - current normal 18.5 m3/h per compressor cooling-water reference does not equal LOOP Recovery Cooling Water flow
  - contractual 350 kW backup PCW does not equal a proven emergency flow rate
  - 13.9 kW current ambient radiation below the 15 kW contractual ceiling does not replace installed duct proof or a room transient
  - OFFER-35 airflow and 40 Pa allowance do not close the duct connection size
  - six-hour pneumatic backup autonomy does not validate six-hour thermal stabilization
  - RTM-436 15 kW is a LOOP ambient heat ceiling, not a complete room thermal model
  - duct availability does not equal quantitative HV03 room airflow
  - historical vendor data identifies provenance but is not current accepted design
  - D2.1 process fallback state does not assign SIL/MIS/MIT or HARD_TRIP by itself
  - green or other drawing colour is not globally equated to valve OPEN/CLOSED without per-diagram legend/state binding
  - source-text mode extraction does not substitute for per-diagram visual valve-state proof
  - candidate I/O remains candidate until L2/detail design freezes it
  - Microsoft Office host reflow and ODP remain separate proof boundaries
  - Global/project DoV remains WITHHELD
utilities:
  bd_id: V16-BD-004
  topic: PCW_scope_reconciliation
  state: CLOSED_SCOPE_RECONCILED
  governing_surface:
    source: QPS_Supporting_Systems_FULL_SLINE_parallel_canonical_v3_appendix.pptx
    source_slides: [53, 54]
    upstream_pointer: NA.AA_BMA003 - Interface List CRYO - ACC NF.xlsx / SCK CEN/48341616
    upstream_workbook_ingested: false
  reconciliation:
    - value_kw: 1199
      semantic_scope: WCS_HP_ONLY
      evidence_class: SOURCE_EXPLICIT
      note: Interface table allocation for WCS HP.
    - value_kw: 1200
      qualifier: APPROXIMATE
      semantic_scope: WCS_HP_OR_HCC_ROUNDED_WORKING_VALUE
      evidence_class: SOURCE_EXPLICIT_ROUNDED
      relation: approximately 1199 kW
    - value_kw: 57
      semantic_scope: PVPS
      evidence_class: SOURCE_EXPLICIT
    - value_kw: 1256
      semantic_scope: WCS_HP_PLUS_PVPS
      evidence_class: DERIVED_EXACT_ARITHMETIC_FROM_SOURCE_EXPLICIT_ALLOCATIONS
      equation: 1199 + 57 = 1256
      caution: Some working slides visually label 1256 kW as HCC/PCW; treat that label as scope-imprecise, not as a competing HP-only duty.
    - value_kw: 44
      semantic_scope: QRB
      evidence_class: SOURCE_EXPLICIT
    - value_kw: 1300
      semantic_scope: TOTAL_QPS_PCW_INTERFACE_CAPACITY
      evidence_class: SOURCE_EXPLICIT_AND_ARITHMETICALLY_CLOSED
      equation: 1199 + 57 + 44 = 1300
  conclusion: The 1199/~1200/~1256 kW values are not three competing design duties. 1199 kW is WCS HP-only; ~1200 kW is its rounded working representation; 1256 kW is the exact WCS HP+PVPS subtotal; 1300 kW is the QPS PCW interface total after adding 44 kW QRB.
  non_claims:
    - This does not prove the underlying NA.AA_BMA003 workbook because that exact workbook was not found/ingested.
    - This does not freeze coolant temperatures, glycol derating, flow, diversity, or equipment sizing.
    - This does not disposition LOOP emergency PCW.

  adjacent_open_items:
    HVAC:
      state: OPEN_SEMANTIC_DISTINCTION
      observations:
        - 124 kW appears as a facility/interface HVAC capacity in one source surface.
        - 120 kW appears as an approximate compressor-room heat-load working value.
        - Another recovered source surface carries 134 kW total HVAC with 124 kW WCS + 10 kW QRB, demonstrating source drift that must not be silently normalized.
    gaseous_nitrogen:
      state: OPEN_ALLOCATION
      source_total_lpm: 375
      listed_allocations_lpm:
        WCS: 50
        QRB: 50
      residual_unallocated_lpm: 275
      note: Preserve residual as unallocated; do not manufacture subsystem balance.
    PGB20:
      state: OPEN_WIP
      source_role: chilled_water_7C_currently_for_HVAC
      open_questions: [baseline_role, chilled_water_duty, diversity_assumption, requirement_vs_design_proposal_vs_WIP]


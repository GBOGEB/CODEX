      path: MIS
      source_intent: Startup permissive
      classification: OCCUPANCY_CONSTRAINT
      secondary_behavior: MODE_INHIBIT_CANDIDATE
      status: CONFLICT_REQUIRES_DISCIPLINE_DISPOSITION
      conflict: Another source states HV02/HV03 failure is slow/not interlock and occupancy-specific. Do not promote to hard trip.

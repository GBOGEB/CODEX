  taxonomy: [MONITOR, WARNING, PERMISSIVE, SLOW_INTERLOCK, HARD_TRIP, MODE_INHIBIT, OCCUPANCY_CONSTRAINT]
  candidate_groups:
    - logical_id: WCS-CW-AVAILABLE
      source_group: Cooling-water available
      path: MIS / MIT
      source_intent: Permissive + monitor
      classification: PERMISSIVE
      secondary_behavior: MONITOR
      status: SOURCE_EXPLICIT_TENDER_CANDIDATE
    - logical_id: WCS-HVAC-HEALTHY

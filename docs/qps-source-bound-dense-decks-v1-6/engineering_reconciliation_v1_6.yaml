    - HVAC startup-permissive wording versus occupancy-specific slow/non-interlock wording requires discipline disposition.
    - Isolation valve command/feedback combines a command function with feedback; exact permissive/interlock consequence remains L2/ICD work.
    - Instrument-air loss consequence needs exact cause/effect and fail-safe state.
    - Exact point counts, marshalling, PLC allocation and package-level expansion remain V16-BD-007/L2.
  bd_close_predicate: Every candidate group has one controlled primary classification and conflicts are dispositioned by discipline evidence.
  current_bd_disposition: KEEP_OPEN

non_compensating_rules:
  - Utilities arithmetic reconciliation does not create facility capacity approval.
  - Tender candidate control classification does not create functional-safety credit.
  - MIS path membership is not inferred solely from operational importance.
  - Detailed I/O remains candidate until L2 freezes it.
  - Global/project DoV remains WITHHELD.

  role: CONTRACTUAL_DESIGN_SOURCE
  note: source requirements are bound as written; later interface/addendum surfaces are not silently normalized against them

contract_requirements:
  CRYO-REQ-336:
    topic: compressor_room_geometry
    statement_summary:
      length_m: 16
      width_m: 14
      ground_area_m2_approx: 220
      ceiling_height_m_approx: 6.5
      room_uses: [Warm_Compressor_Station, LP_to_HP_compressors, VLP_to_LP_compressors, Oil_Removal_System, Warm_Panel, electrical_cabinets, spare_parts, potential_purification, unloading]
    authority_effect: PREFERRED_CONTRACT_GEOMETRY_FOR_LOOP_TRANSIENT_BOUNDARY
  CRYO-REQ-338:
    topic: HVAC_heat_dissipation_input
    contractor_obligation: provide dissipated heat power in Warm Compression Station building for HVAC sizing
    current_preliminary_HVAC_capability_kW_approx: 100
    status: CONTRACT_REQUIREMENT_WITH_EXPLICIT_PRELIMINARY_CAPACITY_VALUE
    authority_effect: contractor_heat_dissipation_schedule_is_required_input; approximately_100_kW_is_not_final_HVAC_ACCEPTANCE_CAPACITY
  CRYO-REQ-345:
    topic: compressor_room_environment
    compressor_room_temperature_C: [5, 40]
    relative_humidity: NOT_CONTROLLED
    authority_effect: equipment/room transient must remain within governing component and room operating limits; this range alone does not define a LOOP endpoint
  SITE-ELECTRICAL-7.3:
    topic: normal_electrical_interface
    supply: 400_V_50_Hz_3PH_plus_N_TN_S
    compressor_room_max_available_power_MW: 1.2
    cold_box_room_max_available_power_kW: 100
    related_requirements: [CRYO-REQ-346, CRYO-REQ-347]
    boundary: NORMAL_SITE_INTERFACE_NOT_DIESEL_LOOP_RATING
  SITE-PCW-7.4:
    topic: process_cooling_water_interface
    fluid: 40_percent_propylene_glycol_mixture
    interface: one_supply_and_return_point_in_compressor_room
    expected_deltaT_K_approx: 10
    compressor_cooling_max_flow_m3_per_h: 100
    cold_box_cooling_max_flow_m3_per_h: 10
    nominal_supply_C: 27
    nominal_supply_tolerance_K: 2
    maximum_supply_C: 29
    related_requirements: [CRYO-REQ-352, CRYO-REQ-353, CRYO-REQ-354, CRYO-REQ-355]
    authority_effect: CONTRACT_SITE_INTERFACE_BOUNDARY_NORMAL_MODE; emergency_LOOP_hydraulic_guarantee_not_defined
  CRYO-REQ-409:
    topic: functional_test_loss_of_utilities
    source_test_intent: safe shutdown shall be checked for simulated loss of electrical power, cooling water, instrument air, vacuum and helium purity upset within cryoplant functional tests
    authority_effect: ACCEPTANCE_CROSS_REFERENCE_ONLY
    controls_boundary: >-
      Requires demonstrable safe shutdown for loss-of-utility cases but does not by itself define
      hard-trip classification, trip timing, LOOP endurance or the one-HP degraded operating state.

geometry_supersession:
  prior_diagnostic:
    artifact: loop_hvac_boundary_v1_6.yaml
    source: QPLANT Buildings.pdf visual section read
    area_m2_approx: 222
    section_height_reference_m_approx: 8.5
    gross_rectangular_volume_m3: 1887
    status: HISTORICAL_DIAGNOSTIC_RETAINED
  preferred_contract_boundary:
    source: CRYO-REQ-336
    nominal_dimension_volume_m3: 1456
    equation: 16 m x 14 m x 6.5 m
    approximate_area_volume_m3: 1430
    equation_2: approximately 220 m2 x approximately 6.5 m
    preferred_gross_rectangular_range_m3: [1430, 1456]
    qualifier: GROSS_CONTRACT_GEOMETRY_NOT_FREE_AIR_VOLUME
  disposition: >-
    The approximately 8.5 m drawing section reference is SUPERSEDED_FOR_TRANSIENT_GEOMETRY by
    CRYO-REQ-336 approximately 6.5 m ceiling. The drawing remains lineage evidence for building
    form, but shall not be the preferred room-volume input.
  remaining_geometry_gaps:
    - exact free air volume after equipment/cabinets/partitions
    - roof/ceiling local geometry and effective stratification volume
    - envelope construction and thermal capacitance
    - equipment/skid effective thermal capacitance

revised_air_only_sanity_screen:
  authority: DIAGNOSTIC_PHYSICS_ONLY
  assumptions:
    gross_volume_m3_range: [1430, 1456]
    air_density_kg_per_m3: 1.2
    air_cp_kJ_per_kgK: 1.005
    no_ventilation: true
    no_solid_thermal_mass: true
    no_envelope_heat_transfer: true
  effective_air_heat_capacity_MJ_per_K_range: [1.72, 1.76]
  temperature_rise_rate_K_per_h:
    at_17_kW: [34.9, 35.5]
    at_17_4_kW: [35.7, 36.3]
    at_31_6_kW_if_17_4_plus_14_2_both_enter_room: [64.8, 66.0]
    at_37_3_kW_if_VFD_5_7_is_additional_and_enters_room: [76.5, 77.9]
  interpretation: >-
    The corrected contractual geometry strengthens the earlier conclusion: room-air inventory alone
    cannot explain a two-hour or six-hour LOOP temporal envelope. Ventilation/ducting, PCW heat
    rejection, building/equipment thermal mass, envelope exchange and recovery sequencing govern.
  acceptance_credit: NONE

pcw_contract_pressure:
  contract_boundary:
    fluid: 40_percent_propylene_glycol
    max_compressor_flow_m3_per_h: 100
    expected_deltaT_K_approx: 10
    supply_C: 27_plus_or_minus_2
    max_supply_C: 29
  later_working_surfaces:
    WCS_HP_duty_kW: 1199
    PVPS_duty_kW: 57
    WCS_total_duty_kW: 1256
    working_WCS_flow_m3_per_h_approx: 106
    working_QPS_total_flow_m3_per_h_approx: 115
    working_deltaT_K_approx: 11
  analytical_child_sensitivity:
    source: QPS_WCS_QRB_Energy_Exergy_DMAIC_rev1_4
    statement: 40_percent_propylene_glycol requires about 12_percent_more_volumetric_flow than water case before viscosity/friction penalties; 15 K rise cuts flow by one third relative to 10 K
    class: ANALYTICAL_CHILD_NOT_CONTRACT_AUTHORITY
  pressure_result:
    state: CONTRACT_VS_LATER_INTERFACE_CAPACITY_EVOLUTION_OPEN
    finding: >-
      The later approximately 106 m3/h WCS working flow exceeds the D2.2 contractual site-interface
      maximum of 100 m3/h by about 6 percent, while D2.2 explicitly specifies 40% propylene glycol.
      The documents may represent design evolution, changed delta-T assumptions or later interface
      authority; document precedence and hydraulic/thermal sizing must be frozen rather than
      silently selecting one value.
    LOOP_effect: >-
      The 100 m3/h normal site-interface limit is not an emergency-flow guarantee. The separate
      approximately 23-31 m3/h emergency-PCW diagnostic target remains an evidence-acquisition
      screen only until backup PAB12 pump/fan/valve/pressure/temperature states are proven.
  closure_required:
    - governing document precedence / approved interface change relative to D2.2
    - current 40% PG density/cp/viscosity basis across allowed temperature range
    - approved normal WCS flow and delta-T at 1199/1256 kW definitions
    - approved emergency PAB12 flow/head/temperature envelope

hvac_contract_pressure:
  source_evolution:
    historical_prestudy_WCS_HVAC_kW: approximately_79_to_90
    D2_2_preliminary_HVAC_capability_kW: approximately_100
    later_interface_WCS_HV03_kW: [114, 124]
  contractual_rule: CRYO-REQ-338 requires contractor dissipated-heat input for final HVAC sizing
  pressure_result: >-
    The approximately 100 kW D2.2 value is explicitly preliminary and shall not supersede later
    114/124 kW interface surfaces. Conversely, later capacity values do not provide LOOP airflow
    or degraded heat-removal performance. The current contractor/OEM heat-dissipation schedule and
    NFS degraded-mode HVAC evidence remain required.

electrical_contract_pressure:
  normal_site_interface_MW: 1.2
  later_WCS_electrical_allocation_kW: 1397
  state: ADJACENT_NORMAL_INTERFACE_CAPACITY_EVOLUTION_OPEN
  finding: >-
    D2.2 normal compressor-room available power and later WCS allocation are not identical surfaces.
    This requires current ES02/load-list/interface precedence confirmation. It does not prove or
    disprove the separate 350 kW LOOP diesel allocation.
  LOOP_rule: normal 1.2 MW site capacity earns zero emergency/diesel margin credit


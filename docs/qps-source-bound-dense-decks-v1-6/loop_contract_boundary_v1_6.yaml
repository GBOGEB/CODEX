next_attack_order:
  - bind current approved revisions/change lineage while retaining D2.1 and D2.2 as provenance anchors
  - acquire current contractor/OEM heat-dissipation schedule required by CRYO-REQ-338
  - acquire quantitative HV03 degraded/LOOP airflow and fan/electrical state
  - acquire emergency PAB12 pump/fan/head/flow/temperature/valve state
  - freeze exact one-HP approximately 110 g/s LOOP electrical/VFD point and ES02 auxiliary split
  - bind effective building/equipment thermal mass using approved room construction and equipment data
  - define the physical limit behind approximately 2 h onset and stabilization criterion behind approximately 6 h
  - execute and independently review first-law WCS LOOP transient

non_compensating_rules:
  - aged anchor source does not mean obsolete source
  - later project data does not silently erase D2.1 or D2.2 provenance
  - contractual/technical normal-mode interfaces do not become emergency-mode guarantees
  - preliminary HVAC sizing does not become final HVAC capacity
  - a later interface value requires change/revision reconciliation before being treated as replacement authority
  - diagnostic air-only heating rates are not safety or acceptance calculations
  - CRYO-REQ-409 safe-shutdown testing does not assign a HARD_TRIP classification by itself
  - no engineering, functional-safety, design, acceptance, release or global/project DoV credit is granted
  - Global/project DoV remains WITHHELD

purpose: >-
  Pressure-test the WCS compressor-room/HV03 boundary needed for the LOOP first-law transient.
  Bind available building geometry and compressor air-side heat-path evidence while keeping
  emergency ventilation airflow, effective thermal mass and ducting state explicitly open.


geometry_diagnostics:
  main_room_floor_area_m2:
    value: 222
    qualifier: APPROXIMATE_VISUAL_DRAWING_READ
    source: QPLANT Buildings.pdf page 19 / SCK CEN/81503739
  section_height_reference_m:
    value: 8.5
    qualifier: APPROXIMATE_VISUAL_SECTION_REFERENCE
    source: QPLANT Buildings.pdf page 18 / SCK CEN/81506075
  gross_rectangular_air_volume_m3:
    value: 1887
    equation: 222 m2 x 8.5 m
    qualifier: DIAGNOSTIC_UPPER_ORDER_ONLY
    caution: sloping roof, actual clear height, equipment displacement, electrical-room separation and architectural details are not accounted for
  package_cooling_air_ACH_on_gross_volume:
    value: 2.65
    equation: 5000 m3/h / 1887 m3
    qualifier: DIAGNOSTIC_ONLY_NOT_HV03_AIR_CHANGE_RATE
  package_plus_VFD_air_ACH_if_independent_room_draws:
    value: 4.88
    equation: (5000 + 4200) m3/h / 1887 m3
    qualifier: DIAGNOSTIC_ONLY
    caution: whether the package and VFD streams draw from or discharge to the room is not frozen

heat_path_pressure_result:
  seventeen_kW_lineage:
    state: STRONG_NUMERICAL_LINEAGE_CANDIDATE_SCOPE_NOT_CLOSED
    finding: >-
      The historical FSD575 SFC datasheet gives 17.4 kW heat dissipation by cooling air with
      5000 m3/h cooling air and a 10.4 K temperature rise. This closely matches the approximately
      17 kW LOOP slide statement and materially strengthens its provenance.
    non_claim: the 17.4 kW historical datasheet row is not proof that exactly 17 kW is the total heat entering WCS_CCB.CR in the current LOOP design
  additional_air_side_paths:
    explicit_rows:
      cooling_air_kW: 17.4
      ambient_waste_heat_kW: 14.2
      VFD_heat_kW: 5.7
    current_project_crosscheck: project SSOT separately carries approximately 14 + 17 kW package air paths
    additivity_status: VFD_OVERLAP_OR_SEPARATE_PATH_NOT_FROZEN
    pressure_result: >-
      The approximately 17 kW value is only one explicit air-side heat path in the historical
      package data. A separate 14.2 kW ambient row exists, and a 5.7 kW VFD heat row also exists.
      The current project 14+17 kW representation therefore has direct historical support, but
      the exact ducting and VFD overlap must be frozen before total room heat is assigned.
  ducting_cases:
    CASE_A_HOT_PACKAGE_AIR_DUCTED_OUTSIDE:
      room_source_term: ambient and non-exported VFD/other losses only
      state: PLAUSIBLE_NOT_BOUND
    CASE_B_PACKAGE_AIR_RETURNS_TO_ROOM:
      room_source_term: package cooling-air heat plus ambient/VFD/other losses
      state: PLAUSIBLE_NOT_BOUND
    governing_gap: exact LOOP damper/duct/fan state and which heat paths are rejected directly outside versus into HV03 room air

room_air_only_sanity_screen:
  authority: DIAGNOSTIC_PHYSICS_ONLY
  assumptions:
    gross_volume_m3: 1887
    air_density_kg_per_m3: 1.2
    air_cp_kJ_per_kgK: 1.005
    no_ventilation: true
    no_wall_floor_equipment_thermal_mass: true
    no_heat_loss: true
  effective_air_heat_capacity_MJ_per_K: 2.28
  temperature_rise_rate_at_17_kW_K_per_h: approximately_27
  interpretation: >-
    Room air inventory alone is far too small to explain a 2 h or 6 h temporal claim. The real
    LOOP transient must be governed by ventilation/ducting, building and equipment thermal mass,
    emergency PCW heat rejection, external boundary conditions and control/recovery sequencing.
  acceptance_credit: NONE

normal_vs_LOOP_hvac_boundary:
  normal_HV03_capacity:
    later_source_WCS_kW: 114
    earlier_source_WCS_kW: 124
    historical_prestudy_WCS_kW: approximately_79_to_90
    state: SOURCE_EVOLUTION_NOT_SILENTLY_NORMALIZED
  LOOP_source_wording:
    ventilation: maintained for equipment safety
    HVAC_load_and_cooling: temporarily reduced
    quantitative_airflow: NOT_FOUND_IN_INDEXED_SOURCE_EVIDENCE
    quantitative_heat_removal: NOT_FOUND_FOR_LOOP_MODE
  rule: normal 114/124 kW interface capacity shall not be credited as LOOP heat-removal capacity without NFS degraded-mode evidence

hvac_close_predicate:
  package_air_heat_path_identity: PASS_HISTORICAL_SOURCE_BOUND
  gross_room_geometry: PASS_DIAGNOSTIC_DRAWING_BOUND
  exact_approved_room_geometry: FAIL_PRIMARY_DOCUMENT_NOT_INGESTED
  exact_LOOP_ducting_state: FAIL_NOT_BOUND
  exact_LOOP_HV03_airflow: FAIL_NOT_BOUND
  exact_LOOP_HV03_heat_removal: FAIL_NOT_BOUND
  effective_building_equipment_thermal_mass: FAIL_MISSING
  VFD_heat_path_overlap: FAIL_NOT_FROZEN
  bd005_close_allowed: false

next_evidence_actions:
  - acquire SCK CEN/54107968 and extract HV03 normal/LOOP airflow, fan power, temperature control and emergency-power state
  - acquire SCK CEN/55426722 and freeze approved WCS room geometry / clear volume / envelope construction
  - acquire SCK CEN/53746611 and freeze compressor/VFD duct routing and equipment arrangement
  - obtain current bidder/OEM FSD575 heat-rejection and cooling-air data at the approximately 110 g/s LOOP operating point
  - freeze whether 17.4 kW package cooling air is directly exhausted, recirculated or handled by HV03 in LOOP mode
  - freeze treatment of 14.2 kW ambient and 5.7 kW VFD heat paths and prove whether they overlap
  - then execute the WCS room first-law transient with uncertainty

non_compensating_rules:
  - historical vendor data may identify provenance but does not become current accepted design by repetition
  - building navigation drawings provide diagnostic geometry, not HVAC acceptance
  - normal HV03 capacity is not emergency/LOOP capacity
  - package cooling-air flow is not the same as room ventilation airflow
  - diagnostic ACH and air-only heat-up screens are not safety or design calculations
  - Controls may consume a proven degraded-state consequence but may not invent HVAC thermal margin
  - Global/project DoV remains WITHHELD

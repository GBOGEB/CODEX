promotion_gates:
  - bind exact source file bytes into repository or controlled source vault
  - record SHA256 for each source
  - generate per-slide source image or stable slide render
  - bind extracted text to slide identifiers
  - complete source-vs-curated visual comparison
  - record keep_merge_drop_reference disposition per source slide
  - pass visual density and content-loss review

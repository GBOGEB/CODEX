purpose: >-
  Preserve the progression of major user-prompt / assistant-execution tuples in addition to the
  canonical end-state handover, so a restart can recover both current truth and the path by which
  that truth was reached without relying on chat memory.

major_tuple_policy:
  major_when_any:
    - evidence_or_source_lineage_changes
    - BD_state_priority_or_close_predicate_changes
    - source_authority_or_currentness_interpretation_changes
    - execution_sequence_or_first_red_changes
    - graph_or_behavioral_semantics_change
    - canonical_handover_or_reproduction_contract_changes
    - a_material_repository_PR_merge_or_reconciliation_changes_restart_context
  minor_turn_rule: >-
    Minor acknowledgements, wording-only exchanges, or turns with no state/evidence/sequence delta
    do not force repository churn; they are folded into the next major tuple summary.
  after_major_tuple:
    - append_one_entry_to_this_ledger
    - refresh_triage_v1_6_yaml
    - refresh_SESSION_HANDOVER_2026_09_14_md
    - refresh_DROP_IN_CONTINUATION_2026_09_14_md
    - preserve_additive_evidence_ledgers
    - verify_governance_and_qps_canonicalization_when_PR_is_opened
    - merge_only_with_explicit_non_compensating_state
    - post_merge_read_from_main
  no_new_handover_framework: true


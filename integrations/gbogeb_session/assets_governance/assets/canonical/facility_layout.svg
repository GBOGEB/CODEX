<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>ESS Accelerator Facility — Plan View</title>

  <!-- Background -->
  <rect width="1200" height="300" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="600" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202124">European Spallation Source — Linear Accelerator Layout</text>
  <text x="600" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">GBOGEB/CODEX · GBC-ASSET-002 · Rev 1.0 · Plan View</text>

  <!-- Beam direction arrow -->
  <line x1="40" y1="140" x2="1100" y2="140" stroke="#34a853" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="1100,135 1115,140 1100,145" fill="#34a853"/>
  <text x="1120" y="144" font-family="system-ui, sans-serif" font-size="9" fill="#34a853" font-weight="600">Target</text>

  <!-- Section 1: Ion Source + RFQ -->
  <g id="gbc-section-ion-source">
    <rect x="50" y="100" width="80" height="80" rx="6" fill="#fff3e0" stroke="#ea8600" stroke-width="2"/>
    <text x="90" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ea8600">Ion</text>
    <text x="90" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ea8600">Source</text>
    <text x="90" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">75 keV</text>
  </g>

  <g id="gbc-section-rfq">
    <rect x="145" y="110" width="60" height="60" rx="6" fill="#fce4ec" stroke="#d93025" stroke-width="2"/>
    <text x="175" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d93025">RFQ</text>
    <text x="175" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">3.6 MeV</text>
  </g>

  <!-- Section 2: DTL (Drift Tube Linac) -->
  <g id="gbc-section-dtl">
    <rect x="220" y="110" width="100" height="60" rx="6" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
    <text x="270" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34a853">DTL</text>
    <text x="270" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#34a853">5 tanks</text>
    <text x="270" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">90 MeV</text>
  </g>

  <!-- Section 3: Spoke Cavities -->
  <g id="gbc-section-spoke">
    <rect x="340" y="105" width="130" height="70" rx="6" fill="#e3f2fd" stroke="#1a73e8" stroke-width="2"/>
    <text x="405" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a73e8">Spoke Cavities</text>
    <text x="405" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1a73e8">2 families · 352 MHz</text>
    <text x="405" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">216 MeV · 2 K</text>
    <!-- Cryostat icons -->
    <rect x="355" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect x="375" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect x="395" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect x="415" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect x="435" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
  </g>

  <!-- Section 4: Medium-Beta Cryomodules -->
  <g id="gbc-section-medium-beta">
    <rect x="490" y="100" width="160" height="80" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="570" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6d28d9">Medium-β</text>
    <text x="570" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6d28d9">9 cryomodules · 704 MHz</text>
    <text x="570" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">571 MeV · 2 K</text>
    <!-- Cryomodule icons -->
    <g>
      <rect x="500" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="518" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="536" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="554" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="572" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="590" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="608" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect x="626" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
    </g>
  </g>

  <!-- Section 5: High-Beta Cryomodules -->
  <g id="gbc-section-high-beta">
    <rect x="670" y="100" width="220" height="80" rx="6" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <text x="780" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0097a7">High-β</text>
    <text x="780" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#0097a7">14 cryomodules · 704 MHz</text>
    <text x="780" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">2000 MeV · 2 K</text>
    <!-- Cryomodule icons -->
    <g>
      <rect x="680" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="696" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="712" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="728" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="744" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="760" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="776" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="792" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="808" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="824" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="840" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="856" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect x="872" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
    </g>
  </g>

  <!-- HEBT / Target -->
  <g id="gbc-section-target">
    <rect x="910" y="105" width="80" height="70" rx="6" fill="#fce4ec" stroke="#d93025" stroke-width="2"/>
    <text x="950" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d93025">HEBT</text>
    <text x="950" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#d93025">+ Target</text>
    <text x="950" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">5 MW</text>
  </g>

  <!-- Cryoplant (below linac) -->
  <g id="gbc-cryoplant">
    <rect x="490" y="220" width="200" height="50" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
    <text x="590" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3f51b5">Cryoplant</text>
    <text x="590" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3f51b5">4.5 K + 2 K He distribution</text>
    <!-- Connection lines -->
    <line x1="570" y1="180" x2="570" y2="220" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="780" y1="180" x2="780" y2="235" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="780" y1="235" x2="690" y2="235" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="405" y1="175" x2="405" y2="245" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="405" y1="245" x2="490" y2="245" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>

  <!-- Scale bar -->
  <g id="gbc-scale" transform="translate(50, 285)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#202124" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#202124" stroke-width="1.5"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#202124" stroke-width="1.5"/>
    <text x="50" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#202124">~100 m</text>
  </g>

  <!-- Legend -->
  <g id="gbc-legend" transform="translate(800, 240)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#202124">Legend:</text>
    <rect x="0" y="8" width="10" height="10" rx="1" fill="#fff3e0" stroke="#ea8600" stroke-width="1"/>
    <text x="14" y="17" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Room temp</text>
    <rect x="0" y="22" width="10" height="10" rx="1" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1"/>
    <text x="14" y="31" font-family="system-ui, sans-serif" font-size="8" fill="#202124">SC (2 K)</text>
    <rect x="100" y="8" width="10" height="10" rx="1" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
    <text x="114" y="17" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Cryoplant</text>
    <rect x="100" y="22" width="10" height="10" rx="1" fill="#fce4ec" stroke="#d93025" stroke-width="1"/>
    <text x="114" y="31" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Target</text>
  </g>
</svg>

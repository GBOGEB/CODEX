<svg xmlns="https://i.ytimg.com/vi/BlwjjD46JxE/maxresdefault.jpg" viewBox="0 0 960 520"
     role="img" aria-labelledby="gbc-therm-title gbc-therm-desc">
  <title id="gbc-therm-title">Thermal Flow Diagram — Helium Cryogenic Loop</title>
  <desc id="gbc-therm-desc">Process flow diagram showing the 2 K helium cryogenic circuit with HX-01 counter-flow heat exchanger, CM-01 cryomodule heat load, cold compressor, JT valve, and annotated thermodynamic states. GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0</desc>

  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .supply  { stroke: #1a73e8; fill: none; stroke-width: 2.5; }
      .return  { stroke: #ea8600; fill: none; stroke-width: 2.5; }
      .supply-fill { fill: #1a73e8; }
      .return-fill { fill: #ea8600; }
      .equip   { fill: #fff; stroke: #333; stroke-width: 1.8; }
      .label   { font-size: 9px; fill: #333; text-anchor: middle; }
      .tag     { font-size: 8px; fill: #555; text-anchor: middle; }
      .val     { font-size: 7.5px; fill: #6d28d9; text-anchor: middle; font-weight: 600; }
      .heading { font-size: 13px; fill: #1a73e8; font-weight: 700; text-anchor: middle; }
      .state   { font-size: 7px; fill: #1a73e8; font-weight: 600; }
      .state-r { font-size: 7px; fill: #ea8600; font-weight: 600; }
      .heat    { font-size: 8px; fill: #d93025; font-weight: 700; text-anchor: middle; }
      .note    { font-size: 7px; fill: #888; }
      .meta    { font-size: 7px; fill: #999; }
      .arrow-s { fill: #1a73e8; }
      .arrow-r { fill: #ea8600; }
      .hx-plate { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1; }
    </style>
    <!-- Flow arrow (supply, pointing right) -->
    <marker id="gbc-arr-s" viewBox="0 0 10 6" refX="10" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" class="arrow-s"/>
    </marker>
    <!-- Flow arrow (return, pointing right) -->
    <marker id="gbc-arr-r" viewBox="0 0 10 6" refX="10" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" class="arrow-r"/>
    </marker>
    <!-- Flow arrow (supply, pointing left) -->
    <marker id="gbc-arr-sl" viewBox="0 0 10 6" refX="0" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="10,0 0,3 10,6" class="arrow-s"/>
    </marker>
    <!-- Flow arrow (return, pointing left) -->
    <marker id="gbc-arr-rl" viewBox="0 0 10 6" refX="0" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="10,0 0,3 10,6" class="arrow-r"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#f8f9fa" rx="6"/>

  <!-- Title -->
  <text x="480" y="26" class="heading">THERMAL FLOW DIAGRAM — 2 K HELIUM CRYOGENIC LOOP</text>
  <text x="480" y="40" class="tag" font-size="8">GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0 · PFD per ISA S5.1 / ASME</text>

  <!-- ═══════════ HX-01 HEAT EXCHANGER (center-left) ═══════════ -->
  <g id="gbc-hx01" transform="translate(160,120)">
    <!-- Shell outline -->
    <rect x="0" y="0" width="120" height="180" class="equip" rx="6"/>
    <!-- Internal plates -->
    <rect x="12" y="20" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="38" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="56" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="74" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="92" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="110" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="128" width="96" height="8" class="hx-plate"/>
    <rect x="12" y="146" width="96" height="8" class="hx-plate"/>
    <!-- Zigzag supply path (cold side — downward) -->
    <polyline points="30,0 30,20 90,28 30,38 90,46 30,56 90,64 30,74 90,82 30,92 90,100 30,110 90,118 30,128 90,136 30,146 90,154 30,164 30,180"
              class="supply" stroke-width="1.5" fill="none"/>
    <!-- Zigzag return path (warm side — upward) -->
    <polyline points="90,180 90,164 30,154 90,146 30,136 90,128 30,118 90,110 30,100 90,92 30,82 90,74 30,64 90,56 30,46 90,38 30,28 90,20 90,0"
              class="return" stroke-width="1.5" fill="none"/>
    <!-- Labels -->
    <text x="60" y="-8" class="label" font-size="10" font-weight="700">HX-01</text>
    <text x="60" y="196" class="tag">Counter-Flow HX</text>
    <text x="60" y="208" class="val">ε = 94.2%</text>
    <text x="60" y="218" class="val">Q̇ = 108.45 W</text>
  </g>

  <!-- ═══════════ STATE POINT ANNOTATIONS ═══════════ -->
  <!-- State 1: Supply into HX (top-left, warm supply in) -->
  <rect x="60" y="100" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text x="100" y="114" class="state" text-anchor="middle">① SUPPLY IN</text>
  <text x="100" y="124" class="state" text-anchor="middle">T = 4.5 K</text>
  <text x="100" y="132" class="state" text-anchor="middle">P = 1.2 bar</text>
  <line x1="140" y1="118" x2="160" y2="118" class="supply" stroke-width="1.5" marker-end="url(#gbc-arr-s)"/>

  <!-- State 2: Supply out of HX (bottom, cold supply out) -->
  <rect x="145" y="344" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text x="185" y="358" class="state" text-anchor="middle">② SUP. OUT</text>
  <text x="185" y="368" class="state" text-anchor="middle">T ≈ 2.2 K</text>
  <text x="185" y="376" class="state" text-anchor="middle">P = 1.15 bar</text>

  <!-- Supply line from HX bottom to JT valve -->
  <line x1="190" y1="300" x2="190" y2="344" class="supply" stroke-width="2"/>

  <!-- ═══════════ JT VALVE ═══════════ -->
  <g id="gbc-jtv01" transform="translate(300,348)">
    <!-- Bowtie valve symbol -->
    <polygon points="0,0 25,15 0,30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <polygon points="50,0 25,15 50,30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="25" y="-6" class="label" font-size="8" font-weight="600">JT-V01</text>
    <text x="25" y="44" class="tag">Joule-Thomson</text>
    <text x="25" y="54" class="val">ΔP → 0.031 bar</text>
  </g>
  <!-- Supply line HX to JT -->
  <line x1="225" y1="363" x2="300" y2="363" class="supply" stroke-width="2" marker-end="url(#gbc-arr-s)"/>

  <!-- State 3: After JT (sub-cooled 2K) -->
  <rect x="365" y="340" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text x="405" y="354" class="state" text-anchor="middle">③ 2 K LHe</text>
  <text x="405" y="364" class="state" text-anchor="middle">T = 2.0 K (λ-pt)</text>
  <text x="405" y="372" class="state" text-anchor="middle">P = 0.031 bar</text>
  <line x1="350" y1="363" x2="365" y2="358" class="supply" stroke-width="2"/>

  <!-- ═══════════ CM-01 CRYOMODULE (main heat load) ═══════════ -->
  <g id="gbc-cm01-thermal" transform="translate(480,240)">
    <!-- Cryomodule vessel -->
    <rect x="0" y="0" width="180" height="100" class="equip" rx="8"/>
    <!-- Inner cavity outline -->
    <rect x="15" y="15" width="150" height="70" fill="#fce8e6" stroke="#d93025" stroke-width="1" rx="4" stroke-dasharray="3,2"/>
    <!-- Label -->
    <text x="90" y="35" class="label" font-size="11" font-weight="700">CM-01</text>
    <text x="90" y="50" class="label" font-size="8">CRYOMODULE</text>
    <!-- Heat loads -->
    <text x="90" y="66" class="heat">Q̇_static = 24.5 W</text>
    <text x="90" y="78" class="heat">Q̇_dynamic = 47.8 W</text>
    <line x1="40" y1="82" x2="140" y2="82" stroke="#d93025" stroke-width="0.8"/>
    <text x="90" y="94" class="heat" font-size="9">Q̇_total = 72.3 W</text>
  </g>

  <!-- Supply into CM-01 (from state 3) -->
  <line x1="445" y1="358" x2="520" y2="358" class="supply" stroke-width="2"/>
  <line x1="520" y1="340" x2="520" y2="358" class="supply" stroke-width="2" marker-end="url(#gbc-arr-s)"/>

  <!-- Return from CM-01 (warm gas out, right side) -->
  <line x1="660" y1="290" x2="710" y2="290" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  <!-- State 4: Return from CM-01 -->
  <rect x="715" y="272" width="80" height="36" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text x="755" y="286" class="state-r" text-anchor="middle">④ RETURN</text>
  <text x="755" y="296" class="state-r" text-anchor="middle">T = 4.5 K</text>
  <text x="755" y="304" class="state-r" text-anchor="middle">P = 1.05 bar</text>

  <!-- ═══════════ COLD COMPRESSOR ═══════════ -->
  <g id="gbc-cc01" transform="translate(750,130)">
    <!-- Compressor circle -->
    <circle cx="40" cy="40" r="35" class="equip"/>
    <!-- Impeller blades -->
    <line x1="20" y1="25" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line x1="25" y1="55" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line x1="55" y1="20" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line x1="60" y1="55" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <!-- Triangle arrow inside -->
    <polygon points="30,30 50,40 30,50" fill="none" stroke="#ea8600" stroke-width="1.5"/>
    <text x="40" y="88" class="label" font-size="9" font-weight="700">CC-01</text>
    <text x="40" y="100" class="tag">Cold Compressor</text>
    <text x="40" y="110" class="val">0.031 → 1.2 bar</text>
  </g>

  <!-- Return line up to cold compressor -->
  <line x1="755" y1="272" x2="755" y2="210" class="return" stroke-width="2"/>
  <line x1="755" y1="210" x2="790" y2="200" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  <!-- From cold compressor back to HX-01 return inlet (top) -->
  <line x1="790" y1="130" x2="790" y2="100" class="return" stroke-width="2"/>
  <line x1="790" y1="100" x2="280" y2="100" class="return" stroke-width="2"/>
  <line x1="280" y1="100" x2="280" y2="120" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  <!-- State 5: Return into HX warm side (top-right) -->
  <rect x="300" y="72" width="80" height="36" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text x="340" y="86" class="state-r" text-anchor="middle">⑤ HX RETURN IN</text>
  <text x="340" y="96" class="state-r" text-anchor="middle">T = 4.5 K  P = 1.2 bar</text>

  <!-- Return out of HX (bottom) to complete loop -->
  <line x1="250" y1="300" x2="250" y2="420" class="return" stroke-width="2"/>
  <line x1="250" y1="420" x2="870" y2="420" class="return" stroke-width="2"/>
  <line x1="870" y1="420" x2="870" y2="310" class="return" stroke-width="2" marker-end="url(#gbc-arr-rl)"/>

  <!-- State 6: Return out of HX (cooled return) -->
  <rect x="400" y="408" width="80" height="28" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text x="440" y="420" class="state-r" text-anchor="middle">⑥ COOLED RETURN</text>
  <text x="440" y="430" class="state-r" text-anchor="middle">T ≈ 2.2 K  P = 1.15 bar</text>

  <!-- ═══════════ MASS FLOW & THERMODYNAMIC DATA BOX ═══════════ -->
  <rect x="520" y="395" width="280" height="75" fill="#fff" stroke="#6d28d9" stroke-width="1.5" rx="5"/>
  <text x="660" y="412" class="label" font-size="9" font-weight="700" fill="#6d28d9">THERMODYNAMIC SUMMARY</text>
  <text x="540" y="428" class="val" font-size="7.5" text-anchor="start">Mass flow (calc): ṁ = 3.066 g/s</text>
  <text x="540" y="440" class="val" font-size="7.5" text-anchor="start">Mass flow (design): ṁ = 4.6 g/s (SF = 1.5)</text>
  <text x="540" y="452" class="val" font-size="7.5" text-anchor="start">Enthalpy change: Δh = 23.58 J/g</text>
  <text x="540" y="464" class="val" font-size="7.5" text-anchor="start">Lambda point: T_λ = 2.1768 K · He-II superfluid</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="20" y="475" width="520" height="35" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="40" y="490" class="label" font-size="8" font-weight="700" text-anchor="start">LEGEND:</text>
  <line x1="100" y1="488" x2="140" y2="488" class="supply" stroke-width="2.5"/>
  <text x="148" y="492" class="tag" font-size="7" text-anchor="start">Supply (LHe 2 K)</text>
  <line x1="230" y1="488" x2="270" y2="488" class="return" stroke-width="2.5"/>
  <text x="278" y="492" class="tag" font-size="7" text-anchor="start">Return (GHe 4.5 K)</text>
  <text x="380" y="492" class="heat" font-size="7">Q̇</text>
  <text x="395" y="492" class="tag" font-size="7" text-anchor="start">= Heat load</text>
  <text x="460" y="492" class="tag" font-size="7" text-anchor="start">①–⑥ State points</text>

  <!-- Metadata -->
  <text x="920" y="508" class="meta" text-anchor="end">GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0 · PFD per ASME</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>SRF Cryomodule Assembly — Cross Section</title>

  
  <rect id="gbc-rect-001" width="800" height="400" fill="#f8f9fa" rx="8"/>

  
  <text id="gbc-text-002" x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#202124">SRF Cryomodule Assembly — Cross Section</text>
  <text id="gbc-text-003" x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5f6368">GBOGEB/CODEX · GBC-ASSET-001 · Rev 1.0</text>

  
  <rect id="gbc-vacuum-vessel" x="60" y="80" width="680" height="240" rx="20" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <text id="gbc-text-004" x="90" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#1a73e8" font-weight="600">Vacuum Vessel (300 K)</text>

  
  <rect id="gbc-thermal-shield" x="90" y="110" width="620" height="180" rx="14" fill="none" stroke="#ea8600" stroke-width="2" stroke-dasharray="6,3"/>
  <text id="gbc-text-005" x="115" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#ea8600">Thermal Shield (80 K)</text>

  
  <rect id="gbc-helium-vessel" x="120" y="140" width="560" height="120" rx="10" fill="#e3f2fd" stroke="#1a73e8" stroke-width="2"/>
  <text id="gbc-text-006" x="145" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#1a73e8">He Vessel (2 K — He-II)</text>

  
  <g id="gbc-cavity-string">
    
    <g id="gbc-cavity-1">
      <ellipse id="gbc-ellipse-007" cx="200" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-008" cx="230" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-009" cx="260" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <line id="gbc-line-010" x1="178" y1="200" x2="282" y2="200" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text id="gbc-text-011" x="230" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">Cavity 1</text>
    </g>

    
    <g id="gbc-cavity-2">
      <ellipse id="gbc-ellipse-012" cx="350" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-013" cx="380" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-014" cx="410" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <line id="gbc-line-015" x1="328" y1="200" x2="432" y2="200" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text id="gbc-text-016" x="380" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">Cavity 2</text>
    </g>

    
    <g id="gbc-cavity-3">
      <ellipse id="gbc-ellipse-017" cx="500" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-018" cx="530" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <ellipse id="gbc-ellipse-019" cx="560" cy="200" rx="22" ry="40" fill="none" stroke="#6d28d9" stroke-width="2"/>
      <line id="gbc-line-020" x1="478" y1="200" x2="582" y2="200" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text id="gbc-text-021" x="530" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">Cavity 3</text>
    </g>
  </g>

  
  <line id="gbc-beam-pipe" x1="60" y1="200" x2="740" y2="200" stroke="#34a853" stroke-width="3"/>
  <polygon id="gbc-polygon-022" points="740,195 750,200 740,205" fill="#34a853"/>
  <text id="gbc-text-023" x="70" y="192" font-family="system-ui, sans-serif" font-size="9" fill="#34a853">Beam →</text>

  
  <g id="gbc-coupler-1">
    <rect id="gbc-rect-024" x="220" y="260" width="20" height="50" rx="3" fill="#f8f9fa" stroke="#d93025" stroke-width="1.5"/>
    <text id="gbc-text-025" x="230" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#d93025">FPC</text>
  </g>
  <g id="gbc-coupler-2">
    <rect id="gbc-rect-026" x="370" y="260" width="20" height="50" rx="3" fill="#f8f9fa" stroke="#d93025" stroke-width="1.5"/>
    <text id="gbc-text-027" x="380" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#d93025">FPC</text>
  </g>

  
  <g id="gbc-he-pipes">
    <line id="gbc-line-028" x1="650" y1="140" x2="720" y2="90" stroke="#1a73e8" stroke-width="2"/>
    <text id="gbc-text-029" x="722" y="88" font-family="system-ui, sans-serif" font-size="8" fill="#1a73e8">LHe supply</text>
    <line id="gbc-line-030" x1="650" y1="260" x2="720" y2="310" stroke="#ea8600" stroke-width="2"/>
    <text id="gbc-text-031" x="722" y="314" font-family="system-ui, sans-serif" font-size="8" fill="#ea8600">GHe return</text>
  </g>

  
  <g id="gbc-supports">
    <rect id="gbc-rect-032" x="155" y="260" width="8" height="55" fill="#dadce0" stroke="#5f6368" stroke-width="1"/>
    <rect id="gbc-rect-033" x="440" y="260" width="8" height="55" fill="#dadce0" stroke="#5f6368" stroke-width="1"/>
    <rect id="gbc-rect-034" x="620" y="260" width="8" height="55" fill="#dadce0" stroke="#5f6368" stroke-width="1"/>
    <text id="gbc-text-035" x="400" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">Support Posts (thermal intercept)</text>
  </g>

  
  <g id="gbc-legend" transform="translate(60, 355)">
    <rect id="gbc-rect-036" x="0" y="0" width="12" height="12" fill="none" stroke="#1a73e8" stroke-width="2"/>
    <text id="gbc-text-037" x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#202124">Vacuum/He vessel</text>
    <rect id="gbc-rect-038" x="140" y="0" width="12" height="12" fill="none" stroke="#6d28d9" stroke-width="2"/>
    <text id="gbc-text-039" x="156" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#202124">SRF Cavities</text>
    <line id="gbc-line-040" x1="260" y1="6" x2="272" y2="6" stroke="#34a853" stroke-width="2"/>
    <text id="gbc-text-041" x="276" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#202124">Beam pipe</text>
    <rect id="gbc-rect-042" x="350" y="0" width="12" height="12" fill="none" stroke="#d93025" stroke-width="1.5"/>
    <text id="gbc-text-043" x="366" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#202124">FPC (coupler)</text>
    <rect id="gbc-rect-044" x="450" y="0" width="12" height="12" fill="none" stroke="#ea8600" stroke-width="2" stroke-dasharray="3,2"/>
    <text id="gbc-text-045" x="466" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#202124">Thermal shield</text>
  </g>
</svg>

<svg xmlns="https://i.ytimg.com/vi/BlwjjD46JxE/maxresdefault.jpg" viewBox="0 0 960 520"
     role="img" aria-labelledby="gbc-therm-title gbc-therm-desc">
  <title id="gbc-therm-title">Thermal Flow Diagram — Helium Cryogenic Loop</title>
  <desc id="gbc-therm-desc">Process flow diagram showing the 2 K helium cryogenic circuit with HX-01 counter-flow heat exchanger, CM-01 cryomodule heat load, cold compressor, JT valve, and annotated thermodynamic states. GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0</desc>

  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .supply  { stroke: #1a73e8; fill: none; stroke-width: 2.5; }
      .return  { stroke: #ea8600; fill: none; stroke-width: 2.5; }
      .supply-fill { fill: #1a73e8; }
      .return-fill { fill: #ea8600; }
      .equip   { fill: #fff; stroke: #333; stroke-width: 1.8; }
      .label   { font-size: 9px; fill: #333; text-anchor: middle; }
      .tag     { font-size: 8px; fill: #555; text-anchor: middle; }
      .val     { font-size: 7.5px; fill: #6d28d9; text-anchor: middle; font-weight: 600; }
      .heading { font-size: 13px; fill: #1a73e8; font-weight: 700; text-anchor: middle; }
      .state   { font-size: 7px; fill: #1a73e8; font-weight: 600; }
      .state-r { font-size: 7px; fill: #ea8600; font-weight: 600; }
      .heat    { font-size: 8px; fill: #d93025; font-weight: 700; text-anchor: middle; }
      .note    { font-size: 7px; fill: #888; }
      .meta    { font-size: 7px; fill: #999; }
      .arrow-s { fill: #1a73e8; }
      .arrow-r { fill: #ea8600; }
      .hx-plate { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1; }
    </style>
    
    <marker id="gbc-arr-s" viewBox="0 0 10 6" refX="10" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon id="gbc-polygon-001" points="0,0 10,3 0,6" class="arrow-s"/>
    </marker>
    
    <marker id="gbc-arr-r" viewBox="0 0 10 6" refX="10" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon id="gbc-polygon-002" points="0,0 10,3 0,6" class="arrow-r"/>
    </marker>
    
    <marker id="gbc-arr-sl" viewBox="0 0 10 6" refX="0" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon id="gbc-polygon-003" points="10,0 0,3 10,6" class="arrow-s"/>
    </marker>
    
    <marker id="gbc-arr-rl" viewBox="0 0 10 6" refX="0" refY="3"
            markerWidth="8" markerHeight="6" orient="auto">
      <polygon id="gbc-polygon-004" points="10,0 0,3 10,6" class="arrow-r"/>
    </marker>
  </defs>

  
  <rect id="gbc-rect-005" width="960" height="520" fill="#f8f9fa" rx="6"/>

  
  <text id="gbc-text-006" x="480" y="26" class="heading">THERMAL FLOW DIAGRAM — 2 K HELIUM CRYOGENIC LOOP</text>
  <text id="gbc-text-007" x="480" y="40" class="tag" font-size="8">GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0 · PFD per ISA S5.1 / ASME</text>

  
  <g id="gbc-hx01" transform="translate(160,120)">
    
    <rect id="gbc-rect-008" x="0" y="0" width="120" height="180" class="equip" rx="6"/>
    
    <rect id="gbc-rect-009" x="12" y="20" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-010" x="12" y="38" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-011" x="12" y="56" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-012" x="12" y="74" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-013" x="12" y="92" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-014" x="12" y="110" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-015" x="12" y="128" width="96" height="8" class="hx-plate"/>
    <rect id="gbc-rect-016" x="12" y="146" width="96" height="8" class="hx-plate"/>
    
    <polyline id="gbc-polyline-017" points="30,0 30,20 90,28 30,38 90,46 30,56 90,64 30,74 90,82 30,92 90,100 30,110 90,118 30,128 90,136 30,146 90,154 30,164 30,180"
              class="supply" stroke-width="1.5" fill="none"/>
    
    <polyline id="gbc-polyline-018" points="90,180 90,164 30,154 90,146 30,136 90,128 30,118 90,110 30,100 90,92 30,82 90,74 30,64 90,56 30,46 90,38 30,28 90,20 90,0"
              class="return" stroke-width="1.5" fill="none"/>
    
    <text id="gbc-text-019" x="60" y="-8" class="label" font-size="10" font-weight="700">HX-01</text>
    <text id="gbc-text-020" x="60" y="196" class="tag">Counter-Flow HX</text>
    <text id="gbc-text-021" x="60" y="208" class="val">ε = 94.2%</text>
    <text id="gbc-text-022" x="60" y="218" class="val">Q̇ = 108.45 W</text>
  </g>

  
  
  <rect id="gbc-rect-023" x="60" y="100" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text id="gbc-text-024" x="100" y="114" class="state" text-anchor="middle">① SUPPLY IN</text>
  <text id="gbc-text-025" x="100" y="124" class="state" text-anchor="middle">T = 4.5 K</text>
  <text id="gbc-text-026" x="100" y="132" class="state" text-anchor="middle">P = 1.2 bar</text>
  <line id="gbc-line-027" x1="140" y1="118" x2="160" y2="118" class="supply" stroke-width="1.5" marker-end="url(#gbc-arr-s)"/>

  
  <rect id="gbc-rect-028" x="145" y="344" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text id="gbc-text-029" x="185" y="358" class="state" text-anchor="middle">② SUP. OUT</text>
  <text id="gbc-text-030" x="185" y="368" class="state" text-anchor="middle">T ≈ 2.2 K</text>
  <text id="gbc-text-031" x="185" y="376" class="state" text-anchor="middle">P = 1.15 bar</text>

  
  <line id="gbc-line-032" x1="190" y1="300" x2="190" y2="344" class="supply" stroke-width="2"/>

  
  <g id="gbc-jtv01" transform="translate(300,348)">
    
    <polygon id="gbc-polygon-033" points="0,0 25,15 0,30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <polygon id="gbc-polygon-034" points="50,0 25,15 50,30" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text id="gbc-text-035" x="25" y="-6" class="label" font-size="8" font-weight="600">JT-V01</text>
    <text id="gbc-text-036" x="25" y="44" class="tag">Joule-Thomson</text>
    <text id="gbc-text-037" x="25" y="54" class="val">ΔP → 0.031 bar</text>
  </g>
  
  <line id="gbc-line-038" x1="225" y1="363" x2="300" y2="363" class="supply" stroke-width="2" marker-end="url(#gbc-arr-s)"/>

  
  <rect id="gbc-rect-039" x="365" y="340" width="80" height="36" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" rx="3"/>
  <text id="gbc-text-040" x="405" y="354" class="state" text-anchor="middle">③ 2 K LHe</text>
  <text id="gbc-text-041" x="405" y="364" class="state" text-anchor="middle">T = 2.0 K (λ-pt)</text>
  <text id="gbc-text-042" x="405" y="372" class="state" text-anchor="middle">P = 0.031 bar</text>
  <line id="gbc-line-043" x1="350" y1="363" x2="365" y2="358" class="supply" stroke-width="2"/>

  
  <g id="gbc-cm01-thermal" transform="translate(480,240)">
    
    <rect id="gbc-rect-044" x="0" y="0" width="180" height="100" class="equip" rx="8"/>
    
    <rect id="gbc-rect-045" x="15" y="15" width="150" height="70" fill="#fce8e6" stroke="#d93025" stroke-width="1" rx="4" stroke-dasharray="3,2"/>
    
    <text id="gbc-text-046" x="90" y="35" class="label" font-size="11" font-weight="700">CM-01</text>
    <text id="gbc-text-047" x="90" y="50" class="label" font-size="8">CRYOMODULE</text>
    
    <text id="gbc-text-048" x="90" y="66" class="heat">Q̇_static = 24.5 W</text>
    <text id="gbc-text-049" x="90" y="78" class="heat">Q̇_dynamic = 47.8 W</text>
    <line id="gbc-line-050" x1="40" y1="82" x2="140" y2="82" stroke="#d93025" stroke-width="0.8"/>
    <text id="gbc-text-051" x="90" y="94" class="heat" font-size="9">Q̇_total = 72.3 W</text>
  </g>

  
  <line id="gbc-line-052" x1="445" y1="358" x2="520" y2="358" class="supply" stroke-width="2"/>
  <line id="gbc-line-053" x1="520" y1="340" x2="520" y2="358" class="supply" stroke-width="2" marker-end="url(#gbc-arr-s)"/>

  
  <line id="gbc-line-054" x1="660" y1="290" x2="710" y2="290" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  
  <rect id="gbc-rect-055" x="715" y="272" width="80" height="36" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text id="gbc-text-056" x="755" y="286" class="state-r" text-anchor="middle">④ RETURN</text>
  <text id="gbc-text-057" x="755" y="296" class="state-r" text-anchor="middle">T = 4.5 K</text>
  <text id="gbc-text-058" x="755" y="304" class="state-r" text-anchor="middle">P = 1.05 bar</text>

  
  <g id="gbc-cc01" transform="translate(750,130)">
    
    <circle id="gbc-circle-059" cx="40" cy="40" r="35" class="equip"/>
    
    <line id="gbc-line-060" x1="20" y1="25" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line id="gbc-line-061" x1="25" y1="55" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line id="gbc-line-062" x1="55" y1="20" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    <line id="gbc-line-063" x1="60" y1="55" x2="40" y2="40" stroke="#333" stroke-width="1.5"/>
    
    <polygon id="gbc-polygon-064" points="30,30 50,40 30,50" fill="none" stroke="#ea8600" stroke-width="1.5"/>
    <text id="gbc-text-065" x="40" y="88" class="label" font-size="9" font-weight="700">CC-01</text>
    <text id="gbc-text-066" x="40" y="100" class="tag">Cold Compressor</text>
    <text id="gbc-text-067" x="40" y="110" class="val">0.031 → 1.2 bar</text>
  </g>

  
  <line id="gbc-line-068" x1="755" y1="272" x2="755" y2="210" class="return" stroke-width="2"/>
  <line id="gbc-line-069" x1="755" y1="210" x2="790" y2="200" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  
  <line id="gbc-line-070" x1="790" y1="130" x2="790" y2="100" class="return" stroke-width="2"/>
  <line id="gbc-line-071" x1="790" y1="100" x2="280" y2="100" class="return" stroke-width="2"/>
  <line id="gbc-line-072" x1="280" y1="100" x2="280" y2="120" class="return" stroke-width="2" marker-end="url(#gbc-arr-r)"/>

  
  <rect id="gbc-rect-073" x="300" y="72" width="80" height="36" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text id="gbc-text-074" x="340" y="86" class="state-r" text-anchor="middle">⑤ HX RETURN IN</text>
  <text id="gbc-text-075" x="340" y="96" class="state-r" text-anchor="middle">T = 4.5 K  P = 1.2 bar</text>

  
  <line id="gbc-line-076" x1="250" y1="300" x2="250" y2="420" class="return" stroke-width="2"/>
  <line id="gbc-line-077" x1="250" y1="420" x2="870" y2="420" class="return" stroke-width="2"/>
  <line id="gbc-line-078" x1="870" y1="420" x2="870" y2="310" class="return" stroke-width="2" marker-end="url(#gbc-arr-rl)"/>

  
  <rect id="gbc-rect-079" x="400" y="408" width="80" height="28" fill="#fef7e0" stroke="#ea8600" stroke-width="1" rx="3"/>
  <text id="gbc-text-080" x="440" y="420" class="state-r" text-anchor="middle">⑥ COOLED RETURN</text>
  <text id="gbc-text-081" x="440" y="430" class="state-r" text-anchor="middle">T ≈ 2.2 K  P = 1.15 bar</text>

  
  <rect id="gbc-rect-082" x="520" y="395" width="280" height="75" fill="#fff" stroke="#6d28d9" stroke-width="1.5" rx="5"/>
  <text id="gbc-text-083" x="660" y="412" class="label" font-size="9" font-weight="700" fill="#6d28d9">THERMODYNAMIC SUMMARY</text>
  <text id="gbc-text-084" x="540" y="428" class="val" font-size="7.5" text-anchor="start">Mass flow (calc): ṁ = 3.066 g/s</text>
  <text id="gbc-text-085" x="540" y="440" class="val" font-size="7.5" text-anchor="start">Mass flow (design): ṁ = 4.6 g/s (SF = 1.5)</text>
  <text id="gbc-text-086" x="540" y="452" class="val" font-size="7.5" text-anchor="start">Enthalpy change: Δh = 23.58 J/g</text>
  <text id="gbc-text-087" x="540" y="464" class="val" font-size="7.5" text-anchor="start">Lambda point: T_λ = 2.1768 K · He-II superfluid</text>

  
  <rect id="gbc-rect-088" x="20" y="475" width="520" height="35" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text id="gbc-text-089" x="40" y="490" class="label" font-size="8" font-weight="700" text-anchor="start">LEGEND:</text>
  <line id="gbc-line-090" x1="100" y1="488" x2="140" y2="488" class="supply" stroke-width="2.5"/>
  <text id="gbc-text-091" x="148" y="492" class="tag" font-size="7" text-anchor="start">Supply (LHe 2 K)</text>
  <line id="gbc-line-092" x1="230" y1="488" x2="270" y2="488" class="return" stroke-width="2.5"/>
  <text id="gbc-text-093" x="278" y="492" class="tag" font-size="7" text-anchor="start">Return (GHe 4.5 K)</text>
  <text id="gbc-text-094" x="380" y="492" class="heat" font-size="7">Q̇</text>
  <text id="gbc-text-095" x="395" y="492" class="tag" font-size="7" text-anchor="start">= Heat load</text>
  <text id="gbc-text-096" x="460" y="492" class="tag" font-size="7" text-anchor="start">①–⑥ State points</text>

  
  <text id="gbc-text-097" x="920" y="508" class="meta" text-anchor="end">GBOGEB/CODEX · GBC-ASSET-005 · Rev 1.0 · PFD per ASME</text>
</svg>

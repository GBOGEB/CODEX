<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>ESS Accelerator Facility — Plan View</title>

  
  <rect id="gbc-rect-001" width="1200" height="300" fill="#f8f9fa" rx="8"/>

  
  <text id="gbc-text-002" x="600" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#202124">European Spallation Source — Linear Accelerator Layout</text>
  <text id="gbc-text-003" x="600" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">GBOGEB/CODEX · GBC-ASSET-002 · Rev 1.0 · Plan View</text>

  
  <line id="gbc-line-004" x1="40" y1="140" x2="1100" y2="140" stroke="#34a853" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon id="gbc-polygon-005" points="1100,135 1115,140 1100,145" fill="#34a853"/>
  <text id="gbc-text-006" x="1120" y="144" font-family="system-ui, sans-serif" font-size="9" fill="#34a853" font-weight="600">Target</text>

  
  <g id="gbc-section-ion-source">
    <rect id="gbc-rect-007" x="50" y="100" width="80" height="80" rx="6" fill="#fff3e0" stroke="#ea8600" stroke-width="2"/>
    <text id="gbc-text-008" x="90" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ea8600">Ion</text>
    <text id="gbc-text-009" x="90" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ea8600">Source</text>
    <text id="gbc-text-010" x="90" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">75 keV</text>
  </g>

  <g id="gbc-section-rfq">
    <rect id="gbc-rect-011" x="145" y="110" width="60" height="60" rx="6" fill="#fce4ec" stroke="#d93025" stroke-width="2"/>
    <text id="gbc-text-012" x="175" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d93025">RFQ</text>
    <text id="gbc-text-013" x="175" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">3.6 MeV</text>
  </g>

  
  <g id="gbc-section-dtl">
    <rect id="gbc-rect-014" x="220" y="110" width="100" height="60" rx="6" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
    <text id="gbc-text-015" x="270" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34a853">DTL</text>
    <text id="gbc-text-016" x="270" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#34a853">5 tanks</text>
    <text id="gbc-text-017" x="270" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">90 MeV</text>
  </g>

  
  <g id="gbc-section-spoke">
    <rect id="gbc-rect-018" x="340" y="105" width="130" height="70" rx="6" fill="#e3f2fd" stroke="#1a73e8" stroke-width="2"/>
    <text id="gbc-text-019" x="405" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a73e8">Spoke Cavities</text>
    <text id="gbc-text-020" x="405" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1a73e8">2 families · 352 MHz</text>
    <text id="gbc-text-021" x="405" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">216 MeV · 2 K</text>
    
    <rect id="gbc-rect-022" x="355" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect id="gbc-rect-023" x="375" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect id="gbc-rect-024" x="395" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect id="gbc-rect-025" x="415" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
    <rect id="gbc-rect-026" x="435" y="120" width="15" height="25" rx="2" fill="none" stroke="#1a73e8" stroke-width="1"/>
  </g>

  
  <g id="gbc-section-medium-beta">
    <rect id="gbc-rect-027" x="490" y="100" width="160" height="80" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text id="gbc-text-028" x="570" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6d28d9">Medium-β</text>
    <text id="gbc-text-029" x="570" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6d28d9">9 cryomodules · 704 MHz</text>
    <text id="gbc-text-030" x="570" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">571 MeV · 2 K</text>
    
    <g id="gbc-g-031">
      <rect id="gbc-rect-032" x="500" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-033" x="518" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-034" x="536" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-035" x="554" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-036" x="572" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-037" x="590" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-038" x="608" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
      <rect id="gbc-rect-039" x="626" y="155" width="14" height="20" rx="2" fill="none" stroke="#6d28d9" stroke-width="1"/>
    </g>
  </g>

  
  <g id="gbc-section-high-beta">
    <rect id="gbc-rect-040" x="670" y="100" width="220" height="80" rx="6" fill="#e0f7fa" stroke="#0097a7" stroke-width="2"/>
    <text id="gbc-text-041" x="780" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0097a7">High-β</text>
    <text id="gbc-text-042" x="780" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#0097a7">14 cryomodules · 704 MHz</text>
    <text id="gbc-text-043" x="780" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">2000 MeV · 2 K</text>
    
    <g id="gbc-g-044">
      <rect id="gbc-rect-045" x="680" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-046" x="696" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-047" x="712" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-048" x="728" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-049" x="744" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-050" x="760" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-051" x="776" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-052" x="792" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-053" x="808" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-054" x="824" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-055" x="840" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-056" x="856" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
      <rect id="gbc-rect-057" x="872" y="155" width="12" height="18" rx="2" fill="none" stroke="#0097a7" stroke-width="1"/>
    </g>
  </g>

  
  <g id="gbc-section-target">
    <rect id="gbc-rect-058" x="910" y="105" width="80" height="70" rx="6" fill="#fce4ec" stroke="#d93025" stroke-width="2"/>
    <text id="gbc-text-059" x="950" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d93025">HEBT</text>
    <text id="gbc-text-060" x="950" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#d93025">+ Target</text>
    <text id="gbc-text-061" x="950" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5f6368">5 MW</text>
  </g>

  
  <g id="gbc-cryoplant">
    <rect id="gbc-rect-062" x="490" y="220" width="200" height="50" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
    <text id="gbc-text-063" x="590" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3f51b5">Cryoplant</text>
    <text id="gbc-text-064" x="590" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3f51b5">4.5 K + 2 K He distribution</text>
    
    <line id="gbc-line-065" x1="570" y1="180" x2="570" y2="220" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line id="gbc-line-066" x1="780" y1="180" x2="780" y2="235" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line id="gbc-line-067" x1="780" y1="235" x2="690" y2="235" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line id="gbc-line-068" x1="405" y1="175" x2="405" y2="245" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line id="gbc-line-069" x1="405" y1="245" x2="490" y2="245" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>

  
  <g id="gbc-scale" transform="translate(50, 285)">
    <line id="gbc-line-070" x1="0" y1="0" x2="100" y2="0" stroke="#202124" stroke-width="1.5"/>
    <line id="gbc-line-071" x1="0" y1="-4" x2="0" y2="4" stroke="#202124" stroke-width="1.5"/>
    <line id="gbc-line-072" x1="100" y1="-4" x2="100" y2="4" stroke="#202124" stroke-width="1.5"/>
    <text id="gbc-text-073" x="50" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#202124">~100 m</text>
  </g>

  
  <g id="gbc-legend" transform="translate(800, 240)">
    <text id="gbc-text-074" x="0" y="0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#202124">Legend:</text>
    <rect id="gbc-rect-075" x="0" y="8" width="10" height="10" rx="1" fill="#fff3e0" stroke="#ea8600" stroke-width="1"/>
    <text id="gbc-text-076" x="14" y="17" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Room temp</text>
    <rect id="gbc-rect-077" x="0" y="22" width="10" height="10" rx="1" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1"/>
    <text id="gbc-text-078" x="14" y="31" font-family="system-ui, sans-serif" font-size="8" fill="#202124">SC (2 K)</text>
    <rect id="gbc-rect-079" x="100" y="8" width="10" height="10" rx="1" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
    <text id="gbc-text-080" x="114" y="17" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Cryoplant</text>
    <rect id="gbc-rect-081" x="100" y="22" width="10" height="10" rx="1" fill="#fce4ec" stroke="#d93025" stroke-width="1"/>
    <text id="gbc-text-082" x="114" y="31" font-family="system-ui, sans-serif" font-size="8" fill="#202124">Target</text>
  </g>
</svg>

  <text id="gbc-text-121" x="40" y="462" class="tag" font-size="7" text-anchor="start">NOTES: All breakers rated per NFPA 70 / NEC · Transformers oil-filled, ONAN cooling · Selective coordination per IEEE 1584 arc flash study</text>
  <text id="gbc-text-122" x="40" y="474" class="tag" font-size="7" text-anchor="start">Total connected load: ~2950 kVA · Main bus fault current: 25 kA sym · UPS supports critical controls during utility transfer</text>

  

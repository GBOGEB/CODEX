# ---------------------------------------------------------------------------
# Theme Integration (extends GBA SEMANTIC_THEME)
# ---------------------------------------------------------------------------
theme_tokens:
  diagram_stroke: "var(--color-primary)"
  diagram_fill_surface: "var(--color-surface)"
  diagram_fill_accent: "var(--color-accent)"
  label_color: "var(--color-on-surface)"
  status_nominal: "var(--color-success)"
  status_warning: "var(--color-warning)"
  status_alarm: "var(--color-error)"
  grid_color: "var(--color-border)"

# ============================================================================
# GBOGEB/CODEX — Visual Data Registry
# Central registry of all visual assets, their metadata, and processing rules
# ============================================================================

schema_version: "1.0.0"
last_updated: "2026-05-20T10:00:00Z"

# ---------------------------------------------------------------------------
# Processing Defaults
# ---------------------------------------------------------------------------
processing:
  svg_optimization:
    remove_metadata: true
    remove_comments: true
    remove_editor_data: true
    minify: false
    precision: 3
    inject_ids: true
    id_prefix: "gbc"
    viewbox_normalize: true

  thumbnail_generation:
    enabled: true
    max_width_px: 400
    max_height_px: 300
    format: "png"
    background: "#ffffff"

  validation:
    require_viewbox: true
    require_title: true
    max_file_size_kb: 500
    allowed_formats: ["svg", "png", "drawio"]
    hash_algorithm: "SHA256"


version: A7.3
runtime: executable_semantic_reconstruction

inputs:
  - semantic_tuple_ledger
  - active_invariants
  - semantic_debt
  - branch_competition
  - lineage_lock
  - reconstruction_manifest

outputs:
  - latest_tuple
  - active_branches
  - tuple_count
  - invariant_count
  - open_debt_count
  - replay_ready
  - validation_status
  - fork_points
  - frontier
  - open_competitions
  - competing_branches

pillars:
  idempotent:
    requirement: repeated reconstruction from identical ledgers produces identical state
  iterative:
    requirement: new tuples extend prior state without deleting lineage
    enforced_by: lineage_lock.py
    rule: >-
      data/lineage_lock.json records the identity hash (id, parent, branch,
      theme, intent) of every locked tuple in ledger order. Locked tuples may
      not be deleted, reordered or have identity fields rewritten; progress,
      todo and delta may evolve. New tuples are appended and then locked with
      python lineage_lock.py --extend, which refuses to rewrite the lock.
  recursive:
    requirement: reconstructed state can seed the next handover and execution pulse
  evolutionary:
    requirement: competing branches remain explicit until evidence supports convergence
    enforced_by: branch_evolution.py
    rule: >-
      Every branch_competition record names a fork tuple and at least two
      alternative child tuples of that fork. An open competition names no
      winner. A converged competition names one winner from its alternatives
      and cites evidence tuples that descend from the fork. Losing
      alternatives stay in the tuple ledger.

gates:
  tuple_count_min: 1
  invariant_count_min: 1
  replay_ready_required: true
  branch_competition_valid_required: true
  lineage_append_only_required: true

next_extensions:
  - tuple_schema_validation
  - branch_DAG_reconstruction
  - semantic_delta_replay
  - renderer_governance_binding
  - CI_gate
  - completeness_metric

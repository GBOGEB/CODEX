version: 1.1
purpose: >-
  Global lookup surface for CODEX capabilities, actions, status vocabulary,
  federation REX controls, and natural-language asks. This file is navigation
  and control metadata only; it does not establish child engineering authority.

status_namespace:
  SR: semantic_readiness
  RR: repository_readiness
  DR: dependency_readiness
  TR: transition_readiness
  EX: execution
  QH: quality_health
  KR: knowledge_receipt
  AR: acceptance_reentry
  CG: change_gate
  BG: blocker_gate

action_namespace:
  lookup:
    meaning: resolve a named node, action, status, or control surface
    where_used:
      - tools/glob_lookup.py
      - federation/rex/GLOB_REX_LOOKUP_v1.yaml
    ask_examples:
      - "what can CODEX do?"
      - "show me the REX control"
  inspect:
    meaning: read a bounded control or capability surface without mutating it
    where_used:
      - tools/glob_lookup.py
    ask_examples:
      - "inspect mesh closure control"
  execute:
    meaning: run an already-governed executable path and retain its result
    where_used:
      - semantic_substrate/runtime/orchestration_loop.py
      - .github/workflows/semantic-runtime.yml
    ask_examples:
      - "execute semantic runtime"
  validate:
    meaning: apply an existing predicate or contract and emit PASS/FAIL/DEFER
    where_used:
      - semantic_substrate/validators/validate_semantic_substrate.py
      - .github/workflows/w003-governance-gate.yml
    ask_examples:
      - "validate this exact head"
  emit:
    meaning: materialize a governed status, receipt, manifest, or projection
    where_used:
      - scripts/emit_mesh_status.py
      - federation/rex/GLOBAL_REX_LEDGER_v1.yaml
    ask_examples:
      - "emit mesh status"
  federate:
    meaning: route bounded evidence or capability between registered repos
    where_used:
      - federation/
      - governance/mesh/
    ask_examples:
      - "federate this receipt"
  recurse:
    meaning: stop on the first real red, repair only that invariant, and rerun
    where_used:
      - governance/mesh/MESH_STATUS_CONTRACT_v1.yaml
      - federation/rex/GLOBAL_REX_LEDGER_v1.yaml
    ask_examples:
      - "recurse on first red"
  freeze:
    meaning: bind an accepted exact head and prevent uncontrolled scope change
    where_used:
      - release/
    ask_examples:
      - "freeze the release candidate"
  publish:
    meaning: create a governed release only after all noncompensating gates pass
    where_used:
      - release/
    ask_examples:
      - "publish the accepted point release"

legacy_action_map:
  READ: lookup
  FIND: lookup
  SEARCH: lookup
  INSPECT: inspect
  RUN: execute
  EXECUTE: execute
  TEST: validate
  VALIDATE: validate
  EMIT: emit
  EXPORT: emit
  FEDERATE: federate
  PROPAGATE: federate
  RECURSE: recurse
  RETRY: recurse
  FREEZE: freeze
  RELEASE: publish
  PUBLISH: publish

capability_menu:
  CODEX:
    role: KEB semantic, provenance, runtime and release-support plane
    capabilities:
      - semantic validation
      - governance validation
      - deterministic execution
      - release smoke and manifest support
      - zero-delta support
      - federation routing
    authority_boundary: >-
      CODEX does not mutate cryoplant engineering or negotiation truth.
  ABACUS:
    role: DOW lineage, repeatability, census and orchestration plane
    capabilities:
      - canonicalization
      - matrix validation
      - exact-SHA census
      - lineage and repeatability analysis
      - orchestration support
    authority_boundary: >-
      ABACUS provides analytical and orchestration evidence only.
  cryoplant-project:
    role: QPS child engineering and final release authority
    capabilities:
      - source and SSOT control
      - native runtime validation
      - artifact materialization
      - browser and binary QA
      - final ACCEPT/REJECT/DEFER
      - point-release authority
    authority_boundary: final child disposition and publish authority

rex_control:
  registry: federation/rex/GLOBAL_REX_LEDGER_v1.yaml
  resolver: federation/rex/GLOB_REX_LOOKUP_v1.yaml
  lifecycle_phase: DMAIC_CONTROL
  rule: >-
    REX preserves measured experience and prevention knowledge. Frequency and
    stars are control signals only and do not establish engineering authority.

what_can_you_ask:
  - {ask: "what can you do?", resolves_to: capability_menu}
  - {ask: "what can CODEX do?", resolves_to: node_snippet}
  - {ask: "what can ABACUS do?", resolves_to: node_snippet}
  - {ask: "what can cryoplant-project do?", resolves_to: node_snippet}
  - {ask: mesh closure control this, resolves_to: closure_control}
  - {ask: closure-control this, resolves_to: closure_control}

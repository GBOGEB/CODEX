[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbogeb-pca-engine"
version = "0.2.0"
description = "Generic non-trading PCA/NLPCA and empirical-control analytics utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sklearn = ["scikit-learn>=1.4"]
viz = ["matplotlib>=3.8"]
nlpca = ["tensorflow>=2.16"]
all = ["pytest>=8.0", "scikit-learn>=1.4", "matplotlib>=3.8", "tensorflow>=2.16"]

[project.scripts]
pca-engine = "pca_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

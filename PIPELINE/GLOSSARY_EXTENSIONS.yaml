version: 1.0
purpose: Controlled semantic vocabulary extensions consumed by the semantic-substrate validator when a bounded governance surface introduces a new semantic_* token.
authority: GBOGEB/CODEX semantic governance only; entries do not create QPS engineering or compliance authority.
glossary:
  semantic_readiness:
    definition: Scheduler-facing readiness state indicating whether schemas, contracts, terminology, identifiers and expectations are aligned enough for a bounded execution attempt; semantic readiness does not prove execution, quality, receipt, or child engineering acceptance.
    introduced_by: governance/mesh/MESH_STATUS_CONTRACT_v1.yaml
    status_key: SR
    first_use_case: distinguish meaning/schema compatibility from repository/dependency readiness before orchestration executes a mesh transition.

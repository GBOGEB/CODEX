cADR:
  id: TRIAGE-ADR-KEB-001
  title: KEB routes meaning without changing QPS engineering meaning
  status: ACCEPTED
  authority_scope: REPO_LOCAL_SEMANTIC_RUNTIME
  decision:
    mutation_policy: APPEND_RECEIPTS_ONLY
    payload_identity: EXACT_SHA256
    semantic_normalization: ALLOWED
    engineering_mutation: FORBIDDEN
    engineering_promotion: FORBIDDEN
  gates: [schema, vocabulary, provenance, hash, route, return_contract]
  failure_mode:

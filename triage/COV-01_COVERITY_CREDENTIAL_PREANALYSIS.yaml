ticket: COV-01
title: "Development Coverity scan / build — RED: curl (22) HTTP 401 at build-tool hash lookup"
opened: 2026-10-11
owner_plane: CODEX            # automation (ABACUS = contract data)
classification:
  class: PRE_ANALYSIS
  subclass: CREDENTIAL / CONFIG_SECRET_ABSENT
  evidence:
    - "vapier/coverity-scan-action@v1 step 'Lookup Coverity Build Tool hash' exits 22"
    - "curl -f against scan.coverity.com/download/<lang>/<platform> returns 401"
    - "action debug log: inputs.token => '' (empty token input)"
  application_failure: false   # no analysis executed; there is nothing in code to repair
  same_pattern_as: "#923 (pre-execution / zero-step evidence, cryoplant-project)"
source_repo: UNRESOLVED       # not ABACUS, CODEX or cryoplant-project: none of the three
                             # contains a Coverity workflow or run (checked 2026-10-11).
                             # Owner to name the GBOGEB repo; it adopts the reusable caller.
fix:
  reusable_workflow: .github/workflows/coverity-scan-reusable.yml
  codex_caller: .github/workflows/coverity-scan.yml
  behaviour:
    token_present: scan executes; upload result is the verdict
    token_absent: WITHHELD (warning + receipt), never PASS
  action_pin: vapier/coverity-scan-action@5f73f06d66be9c9bbacdc93fa802c2b42b7f6f1a
  python_ts_mode: "build_language=other, command='', capture_command='--project-dir .'"
owner_actions:
  - "Register project on scan.coverity.com with the exact github.repository name (case-sensitive)"
  - "gh secret set COVERITY_SCAN_TOKEN -R GBOGEB/<repo>  (and COVERITY_SCAN_EMAIL)"
  - "Replace the failing repo's inline coverity job with the reusable caller"
definition_of_verification:
  pass_requires:
    - "a run on the current SHA with token_present=true"
    - "submission accepted by scan.coverity.com (build appears with a defect count)"
    - "receipt artifact coverity-receipt bound to run_id + SHA"
  not_evidence:
    - "WITHHELD runs"
    - "dry_run=true runs"
scope:
  public_repos: ELIGIBLE
  private_repos: COVERITY_NOT_APPLICABLE   # Coverity Scan license scope = public OSS only
non_compensation:
  - "COV-01 status never compensates, reorders or substitutes #923, W248, or GT_BDQ_0..9"
  - "a WITHHELD scan is not a green signal for any release gate"
related:
  - ADR-0002 SPINE-core public backbone (separate PR — one root cause per PR)
status: FIX_PROPOSED

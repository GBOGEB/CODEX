# Semgrep remains an authoritative security scanner, but routine documentation and
# orchestration-only changes should not consume scarce hosted-runner capacity.
name: Semgrep

on:
  push:
    branches: [main]
    paths: &semgrep_paths
      - '**/*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'setup.py'
      - 'schemas/**'
      - 'ssot/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [main]
    paths: *semgrep_paths
  schedule:
    - cron: '18 8 * * 5'
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

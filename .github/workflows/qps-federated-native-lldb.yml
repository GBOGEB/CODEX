name: QPS Federated Native LLDB

on:
  pull_request:
    paths:
      - 'runtime/debug/federation/qps_payload/**'
      - 'runtime/debug/federation/qps_federated_payload_manifest.json'
      - 'scripts/qps_federated_lldb_exec.py'
      - '.github/workflows/qps-federated-native-lldb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qps-exact-payload-native-lldb:
    name: execute exact QPS payload on macOS LLDB
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute federated exact-payload LLDB proof
        run: python3 scripts/qps_federated_lldb_exec.py
      - name: Enforce federated runtime victory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path('artifacts/qps_debug/qps_federated_lldb_receipt.json')
              .read_text()
          )
          assert p['probe_status'] == 'ACCEPT', p
          assert p['source']['payload_hash_match'] is True, p
          assert p['real_probe_steps'] > 0, p
          assert p['minimum_victory_condition']['observed_value_42'] is True, p
          assert p['authority_guards']['qps_repo_local_runner_gate'] \
              == 'WITHHELD_EXTERNAL', p
          assert p['authority_guards']['formal_engineering_credit_delta'] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qps-federated-native-lldb-receipt
          path: artifacts/qps_debug/qps_federated_lldb_receipt.json
          if-no-files-found: error

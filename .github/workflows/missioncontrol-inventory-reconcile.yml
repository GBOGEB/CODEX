name: MissionControl Inventory Reconcile

# After every push to main that can change the executable inventory, rerun the
# canonical regeneration (scripts/regen_missioncontrol_inventory.py). If a
# tracked receipt drifted (a PR added a test/workflow/script without refreshing
# the receipts, or two PRs raced), commit the refreshed receipts to main and
# re-dispatch MissionControl Mycelium CI on the new head.
#
# Loop analysis: the commit is pushed with GITHUB_TOKEN, and GitHub does not
# start push-triggered workflows for GITHUB_TOKEN pushes, so this workflow
# does not retrigger itself. Mycelium CI is started explicitly with
# `gh workflow run` (workflow_dispatch), which is not a trigger of this
# workflow either.

on:
  push:
    branches: [main]
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/data/missioncontrol_*.json'
      - 'MANIFEST/MYCELIUM_KPI_MANIFEST.yaml'
      - 'MIP/mip_lanes.json'
      - 'MIP/mip_surface.json'
      - 'MIP/RUNTIME_HEALTH_ROLLUP_1102.yaml'
      - 'docs/data/mycelium_kpi_measurement.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: missioncontrol-inventory-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema
      - name: Regenerate executable-value receipts
        id: regen
        run: |
          python scripts/regen_missioncontrol_inventory.py | tee /tmp/inventory_reconcile.json
          if git diff --quiet; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit refreshed receipts to main
        if: steps.regen.outputs.drift == 'true'
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Same list as TRACKED_OUTPUTS in scripts/regen_missioncontrol_inventory.py.
          outputs=(
            mission_control/mycelium/executable_value_report.json
            docs/data/missioncontrol_executable_value_report.json
            mission_control/mycelium/executable_value_control_observation.json
            mission_control/mycelium/metrics_snapshot.json
            docs/data/missioncontrol_metrics.json
            mission_control/mycelium/log_analysis.json
            docs/data/missioncontrol_log_analysis.json
            docs/data/mycelium_kpi_measurement.json
            mission_control/mycelium/recursive_control_projection.json
            docs/data/missioncontrol_recursive_control_projection.json
          )
          git add -- "${outputs[@]}"
          if git diff --cached --quiet; then
            echo "Only untracked byproducts changed; nothing to commit."
            exit 0
          fi
          git commit -m "missioncontrol: reconcile executable-value receipts after ${TRIGGER_SHA}" \
                     -m "$(cat /tmp/inventory_reconcile.json)"
          # main may move (e.g. the metrics bot): reset to the new main, regenerate
          # again and retry, so the pushed receipts always match the pushed head.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/regen_missioncontrol_inventory.py >/tmp/inventory_reconcile.json
            git add -- "${outputs[@]}"
            if git diff --cached --quiet; then echo "Already reconciled on main."; exit 0; fi
            git commit -m "missioncontrol: reconcile executable-value receipts after ${TRIGGER_SHA}" \
                       -m "$(cat /tmp/inventory_reconcile.json)"
          done
          echo "::error::could not push reconciled receipts after 3 attempts"
          exit 1
      - name: Re-run MissionControl Mycelium CI on the reconciled head
        if: steps.regen.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run missioncontrol-mycelium.yml --ref main

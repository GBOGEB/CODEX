name: MissionControl Inventory Reconcile

# After every push to main that can change the executable inventory, rerun the
# canonical regeneration (scripts/regen_missioncontrol_inventory.py). If a
# tracked receipt drifted (a PR added a test/workflow/script without refreshing
# the receipts, or two PRs raced), publish the refreshed receipts as a PR from
# the rolling branch automation/missioncontrol-reconcile (main requires pull
# requests under ruleset Codex_main_protect) and dispatch MissionControl
# Mycelium CI on that branch so the PR head carries a Mycelium result.
#
# Loop analysis: the bot branch is pushed with GITHUB_TOKEN, and GitHub does
# not start push- or pull_request-triggered workflows for GITHUB_TOKEN pushes,
# so this workflow (push to main only) does not retrigger itself. Mycelium CI
# is started explicitly with `gh workflow run` (workflow_dispatch), which is
# not a trigger of this workflow either.

on:
  push:
    branches: [main]
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/data/missioncontrol_*.json'
      - 'MANIFEST/MYCELIUM_KPI_MANIFEST.yaml'
      - 'MIP/mip_lanes.json'
      - 'MIP/mip_surface.json'
      - 'MIP/RUNTIME_HEALTH_ROLLUP_1102.yaml'
      - 'docs/data/mycelium_kpi_measurement.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: missioncontrol-inventory-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema
      - name: Regenerate executable-value receipts
        id: regen
        run: |
          python scripts/regen_missioncontrol_inventory.py | tee /tmp/inventory_reconcile.json
          if git diff --quiet; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish refreshed receipts as a bot PR
        if: steps.regen.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          { echo "missioncontrol: reconcile executable-value receipts after ${TRIGGER_SHA}"; echo;
            echo "Regenerated by MissionControl Inventory Reconcile on main ${TRIGGER_SHA}.";
            echo "Rebuilt on top of the latest main on every drift; merge the latest one."; echo;
            echo '```json'; cat /tmp/inventory_reconcile.json; echo '```'; } > "$RUNNER_TEMP/reconcile_pr.md"
          # Same list as TRACKED_OUTPUTS in scripts/regen_missioncontrol_inventory.py.
          scripts/ci/open_bot_pr.sh automation/missioncontrol-reconcile \
            "missioncontrol: reconcile executable-value receipts" "$RUNNER_TEMP/reconcile_pr.md" \
            mission_control/mycelium/executable_value_report.json \
            docs/data/missioncontrol_executable_value_report.json \
            mission_control/mycelium/executable_value_control_observation.json \
            mission_control/mycelium/metrics_snapshot.json \
            docs/data/missioncontrol_metrics.json \
            mission_control/mycelium/log_analysis.json \
            docs/data/missioncontrol_log_analysis.json \
            docs/data/mycelium_kpi_measurement.json \
            mission_control/mycelium/recursive_control_projection.json \
            docs/data/missioncontrol_recursive_control_projection.json
      - name: Run MissionControl Mycelium CI on the bot branch
        if: steps.regen.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run missioncontrol-mycelium.yml --ref automation/missioncontrol-reconcile

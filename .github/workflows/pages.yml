name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Runtime Release Gate"]
    types:
      - completed
    branches:
      - main
  # Daily and manual rebuilds re-deploy the last release-gated main commit so
  # the live federation source projection refreshes between qualifying pushes.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.pick.outputs.source_sha }}
    steps:
      - name: Resolve the release-gated main commit to publish
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$GATED_SHA"
          else
            # Same gate as the workflow_run trigger: the newest main push that
            # passed Runtime Release Gate. Main commits past it are not published.
            sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/runtime_release_gate.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')"
          fi
          if [ -z "$sha" ]; then
            echo "::error::No release-gated main commit to publish"
            exit 1
          fi
          echo "Publishing release-gated main commit $sha ($EVENT_NAME)"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install "matplotlib>=3.8"

      - name: Generate runtime evidence for hosted portal
        run: |
          python scripts/bridge_rtm_ingress.py --json-out reports/rtm_summary.json
          python docs/wave_packages/runtime/federation_bridge_cli.py --stop-on-failure
          python docs/wave_packages/runtime/reality_tracker.py
          python scripts/emit_runtime_status.py --out reports/runtime_status.json

      - name: Build verified Pages output
        run: |
          if [ -f tools/losses/src/build_all.py ]; then
            python tools/losses/src/build_all.py
          fi
          python orchestrate_g3.py
          python scripts/check_manifest.py
          python scripts/check_globs.py
          python scripts/check_stale.py
          python scripts/build_missioncontrol_graph_publication.py
          python scripts/render_missioncontrol_graph_matplotlib.py
          python scripts/check_links.py
          pytest -q

      - name: Refresh MissionControl federation source projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ingest_missioncontrol_sources.py
          test -f docs/data/missioncontrol_source_status.json
          test -f docs/data/missioncontrol_control_events.json
          test -f docs/data/missioncontrol_graph_analysis.json
          test -f docs/missioncontrol_graph_explorer.html
          test -s docs/assets/missioncontrol/missioncontrol_degree_distribution.png
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("docs/data/missioncontrol_source_status.json").read_text(encoding="utf-8")
          )
          assert status.get("authority_transfer") is False
          assert status.get("engineering_state_promoted") is False
          sources = status.get("sources", [])
          assert sources, "MissionControl source projection is empty"
          assert all(item.get("status") in {"FRESH", "STALE_CACHE"} for item in sources)
          PY

      - name: Materialize historical REX plus current ABACUS read-only observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_EXACT_SOURCE: ${{ needs.resolve.outputs.source_sha }}
        run: |
          python -m pip install "PyYAML>=6,<7"
          python -m unittest discover -s tests -p test_code_purple_current_observation.py -v
          python scripts/code_purple_rex_rollup.py
          python scripts/code_purple_current_observation.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          names = ["code_purple_rex_rollup.json", "code_purple_current_observation.json"]
          manifest = {"schema": "code-purple.pages-byte-identity/1.0",
                      "codex_source_sha": os.environ["CODEX_EXACT_SOURCE"],
                      "state": "STAGED_UNVERIFIED", "files": []}
          live = json.loads(Path("docs/data/code_purple_current_observation.json").read_text())
          manifest["abacus_observed_main_sha"] = live["source"]["main_sha"]
          for name in names:
              payload = (Path("docs/data") / name).read_bytes()
              manifest["files"].append({
                  "name": name, "sha256": hashlib.sha256(payload).hexdigest(),
                  "bytes": len(payload)})
          Path("reports/code_purple_expected_pages_bytes.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload build-side independent byte receipt
        uses: actions/upload-artifact@v4
        with:
          name: code-purple-pages-identity-${{ needs.resolve.outputs.source_sha }}
          path: reports/code_purple_expected_pages_bytes.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind optional current-main diagnostic receipt from existing Actions producer
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          # The checked-in JSON is an explicit UNKNOWN sentinel, never live evidence.
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CODEX_SOURCE_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Quality burndown and UBI 9 testflight" and .event == "push" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful exact-main quality producer; retain UNKNOWN receipt"
          else
            mkdir -p /tmp/codex-diagnostic-join
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                 --name codex-joined-diagnostic-coverage --dir /tmp/codex-diagnostic-join; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = os.environ["CODEX_SOURCE_SHA"]
          src = Path("/tmp/codex-diagnostic-join/receipt.json")
          doc = Path("docs/data/diagnostic_coverage_receipt.json")
          payload = json.loads(src.read_text(encoding="utf-8"))
          assert payload["schema"] == "codex-diagnostic-coverage-rollup/v1"
          assert payload["source_sha"] == source
          assert payload["authority_transfer"] is False
          assert payload["formal_credit_delta"] == 0
          assert payload["engineering_credit_delta"] == 0
          assert payload["coverage"]["quality"]["status"] == "MEASURED"
          assert payload["coverage"]["runtime"]["status"] == "MEASURED"
          assert payload["coverage"]["ldab"]["status"] == "UNKNOWN"
          assert payload["coverage"]["crew"]["status"] == "UNKNOWN"
          doc.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
          print("Bound current-main diagnostic receipt:", source)
          PY
            else
              echo "Exact-main joined artifact missing; retain UNKNOWN receipt"
            fi
          fi

      - name: Verify release artifacts prior to staging
        run: |
          test -f reports/runtime_status.json
          test -f reports/rtm_summary.json
          test -f docs/wave_packages/runtime/out/federation_bridge_build_report.json
          test -f docs/wave_packages/runtime/pages/index.html
          test -f docs/data/missioncontrol_source_status.json
          test -f docs/data/missioncontrol_control_events.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("docs/wave_packages/runtime/out/federation_bridge_build_report.json").read_text(encoding="utf-8")
          )
          render_step = next(
              (step for step in report.get("steps", []) if step.get("script") == "render_html_runtime.py"),
              None,
          )
          assert render_step and render_step.get("status") == "passed", (
              "render_html_runtime.py was missing from the federation bridge build report "
              "or did not complete successfully"
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a docs/. _site/
          if [ -d outputs ]; then
            mkdir -p _site/outputs
            cp -a outputs/. _site/outputs/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [resolve, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Download independent Pages build receipt
        uses: actions/download-artifact@v8
        with:
          name: code-purple-pages-identity-${{ needs.resolve.outputs.source_sha }}
          path: reports

      - name: Verify public CODE PURPLE Pages byte identity
        env:
          CODE_PURPLE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = json.loads(Path("reports/code_purple_expected_pages_bytes.json").read_text())
          base = os.environ["CODE_PURPLE_PAGES_URL"].rstrip("/")
          parsed = urllib.parse.urlparse(base)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("Pages URL must be HTTPS")
          receipts = []
          for item in expected["files"]:
              name = item["name"]
              if name not in ("code_purple_rex_rollup.json", "code_purple_current_observation.json"):
                  raise SystemExit("unexpected readback file")
              url = base + "/data/" + name
              matched = False
              for i in range(10):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          if response.geturl() != url:
                              raise ValueError("unexpected Pages redirect")
                          data = response.read()
                      matched = (len(data) == item["bytes"] and
                                 hashlib.sha256(data).hexdigest() == item["sha256"])
                  except (OSError, ValueError):
                      matched = False
                  if matched:
                      break
                  if i < 9:
                      time.sleep(6)
              if not matched:
                  raise SystemExit("PAGES PUBLIC BYTE IDENTITY HOLD: " + name)
              receipts.append({"public_url": url, "sha256": item["sha256"],
                               "bytes": item["bytes"], "result": "MATCH"})
          result = dict(expected)
          result["state"] = "PUBLISHED_PUBLIC_BYTES_MATCH"
          result["public_readback"] = receipts
          Path("reports/code_purple_pages_verified.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              for receipt in receipts:
                  summary.write("- Verified " + receipt["public_url"] +
                                " sha256:" + receipt["sha256"] + "\n")
          PY

      - name: Publish immutable Pages readback receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-purple-pages-verified-${{ needs.resolve.outputs.source_sha }}
          path: reports/code_purple_pages_verified.json
          if-no-files-found: error
          retention-days: 30

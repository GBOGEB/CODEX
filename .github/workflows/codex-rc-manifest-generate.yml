name: CODEX RC Manifest Generate

on:
  workflow_dispatch: {}
  pull_request: {}

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/release/codex_rc_manifest_generate.py
      - name: Validate manifest source SHA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('release/CODEX_2_0_RC_MANIFEST.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert m['source_commit_sha']==head
          assert m['target_version']=='2.0.0'
          assert m['promotion_allowed'] is False
          print('RC manifest candidate: PASS')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-rc-manifest-candidate
          path: release/CODEX_2_0_RC_MANIFEST.json
          if-no-files-found: error

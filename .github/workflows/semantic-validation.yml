name: semantic-validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'semantic_substrate/**'
      - '.github/workflows/semantic-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'semantic_substrate/**'
      - '.github/workflows/semantic-validation.yml'
  workflow_dispatch:

concurrency:
  group: semantic-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-semantic-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run semantic validator
        run: |
          python semantic_substrate/validators/validate_semantic_substrate.py

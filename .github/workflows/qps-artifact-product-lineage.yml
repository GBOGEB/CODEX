name: QPS Artifact Product Lineage

on:
  pull_request:
    paths:
      - federation/qps/QPS_ARTIFACT_PRODUCT_LINEAGE_CONTRACT_v0.1.yaml
      - schemas/qps_artifact_product_lineage.schema.json
      - scripts/validate_qps_artifact_product_lineage.py
      - tests/test_validate_qps_artifact_product_lineage.py
      - .github/workflows/qps-artifact-product-lineage.yml
  push:
    branches: [main]
    paths:
      - federation/qps/QPS_ARTIFACT_PRODUCT_LINEAGE_CONTRACT_v0.1.yaml
      - schemas/qps_artifact_product_lineage.schema.json
      - scripts/validate_qps_artifact_product_lineage.py
      - tests/test_validate_qps_artifact_product_lineage.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: python scripts/validate_qps_artifact_product_lineage.py federation/qps/QPS_ARTIFACT_PRODUCT_LINEAGE_CONTRACT_v0.1.yaml
      - run: python -m unittest tests.test_validate_qps_artifact_product_lineage


name: GM-I-A CoolProp FAST-HEAVY KEB Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'triage/GM_I_A_COOLPROP_FAST_HEAVY_KEB_BRIDGE.yaml'
      - 'scripts/validate_gm_i_a_coolprop_fast_heavy_keb.py'
      - '.github/workflows/gm-i-a-coolprop-fast-heavy-keb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume-provider-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVIDER_COMMIT: a71924147117c02ccc70c9b6436d89623897606c
      PROVIDER_PATH: qps/recon/federation/GM_I_A_FAST_HEAVY_FEDERATION_ATTESTATION_v1.json
      EXPECTED_SHA256: 132ff84a3502f5ce39d4698fa772e98f7e8fba8e52587e698e8ea419197e1398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'ruamel.yaml>=0.18,<0.19'
      - name: Fetch immutable CoolProp provider attestation
        run: |
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/GBOGEB/CoolProp/${PROVIDER_COMMIT}/${PROVIDER_PATH}"             --output /tmp/gm_i_a_provider.json
          echo "${EXPECTED_SHA256}  /tmp/gm_i_a_provider.json" | sha256sum -c -
      - name: Consume provider and emit KEB receipt
        run: |
          python scripts/validate_gm_i_a_coolprop_fast_heavy_keb.py             --provider /tmp/gm_i_a_provider.json             --receipt /tmp/gm_i_a_keb_receipt.json
          python -m json.tool /tmp/gm_i_a_keb_receipt.json > /dev/null
          sha256sum /tmp/gm_i_a_keb_receipt.json | tee /tmp/GM_I_A_KEB_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gm-i-a-coolprop-keb-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/gm_i_a_keb_receipt.json
            /tmp/GM_I_A_KEB_SHA256SUMS
          if-no-files-found: error

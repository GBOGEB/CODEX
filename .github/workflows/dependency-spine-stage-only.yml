name: CODEX MYCELIUM Dependency SPINE Stage
on:
  pull_request:
    paths:
      - 'mission_control/mycelium/dependency_spine/stage_consumer.py'
      - 'tests/test_dependency_spine_stage_consumer.py'
      - '.github/workflows/dependency-spine-stage-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-only:
    name: Exact-head contract, no-input DEFER
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove negative stage-only controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m unittest discover -s tests -p 'test_dependency_spine_stage_consumer.py' -v
      - name: Produce explicit no-input DEFER receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python mission_control/mycelium/dependency_spine/stage_consumer.py --root . --consumer-sha "$EXPECTED_HEAD" --out "$RUNNER_TEMP/dep-stage"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codex-mycelium-dep-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dep-stage/
          if-no-files-found: warn
          retention-days: 30

name: G5 Unified Lifecycle Execution Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g5-build-candidate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Architecture
      uses: actions/checkout@v4

    - name: Initialize G5 Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute G5 Master Orchestrator and Bake Artifacts
      run: python orchestrate_g5.py

    - name: Stage non-authoritative publication candidate
      run: |
        rm -rf _site
        mkdir -p _site
        cp -a docs/. _site/
        if [ -d outputs ]; then
          mkdir -p _site/outputs
          cp -a outputs/. _site/outputs/
        fi

    - name: Upload candidate artifact without Pages deployment authority
      uses: actions/upload-artifact@v4
      with:
        name: g5-publication-candidate-${{ github.sha }}
        path: _site

# Legacy Jekyll candidate builder. QPS v6 Pages deployment authority lives only in pages.yml.
name: Build Jekyll Pages candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload candidate artifact without Pages deployment authority
        uses: actions/upload-artifact@v4
        with:
          name: legacy-jekyll-candidate-${{ github.sha }}
          path: _site

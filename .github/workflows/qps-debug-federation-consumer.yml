name: QPS Debug Federation Consumer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [qps-debug-envelope]

permissions:
  contents: read

jobs:
  consume-qps-debug-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QPS_DEBUG_ENVELOPE_JSON: ${{ toJson(github.event.client_payload.envelope) }}
    steps:
      - uses: actions/checkout@v4
      - name: Consume QPS envelope fail-closed
        run: python3 runtime/debug/qps_debug_federation_consumer.py
      - name: Assert absent/non-ACCEPT input never becomes KEB ACCEPT
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: grep -q '"status": "DEFER"' runtime/debug/generated/qps_debug_keb_binding.json
      - uses: actions/upload-artifact@v4
        with:
          name: qps-debug-keb-binding
          path: runtime/debug/generated/qps_debug_keb_binding.json
          if-no-files-found: error

name: MissionControl Owner Comment Transport

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: missioncontrol-owner-comment-stage-only-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authenticated-owner-comment:
    if: >
      github.event.issue.number == 879 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/missioncontrol stage refresh-federation-heads ')
    name: authenticated-owner-comment-stage-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema

      - name: Materialize exact-head owner request
        env:
          OWNER_COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          python scripts/missioncontrol_owner_comment_request.py             --comment "$OWNER_COMMENT"             --observed-head "$observed_head"             --run-id "$GITHUB_RUN_ID"             --actor "$GITHUB_ACTOR"             --out missioncontrol-execution-request.json

      - name: Validate authenticated transport request
        id: gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/missioncontrol_authenticated_transport.py             --request missioncontrol-execution-request.json             --actor "$GITHUB_ACTOR"             --actor-id "$GITHUB_ACTOR_ID"             --run-id "$GITHUB_RUN_ID"             --run-attempt "$GITHUB_RUN_ATTEMPT"             --job-name "authenticated-owner-comment-stage-only"

      - name: Validate gateway and MissionControl
        run: |
          python scripts/validate_missioncontrol_execution_gateway.py
          python scripts/validate_missioncontrol_mycelium.py
          pytest -q             tests/test_missioncontrol_execution_gateway.py             tests/test_missioncontrol_authenticated_transport.py             tests/test_missioncontrol_owner_comment_transport.py
          git diff --check

      - name: Upload authenticated owner-comment receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gateway.outputs.artifact_name }}
          path: ${{ steps.gateway.outputs.receipt_path }}
          if-no-files-found: error

      - name: Publish authenticated receipt pointer
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'MISSIONCONTROL_RUNTIME_RECEIPT',
              'status=EXECUTED',
              'transport=OWNER_COMMENT_STAGE_ONLY',
              'run_id=${{ github.run_id }}',
              'run_attempt=${{ github.run_attempt }}',
              'job_name=authenticated-owner-comment-stage-only',
              'observed_head_sha=${{ steps.gateway.outputs.observed_head_sha }}',
              'artifact_name=${{ steps.gateway.outputs.artifact_name }}',
              'receipt_path=${{ steps.gateway.outputs.receipt_path }}',
              'mutation_enabled=false',
              'authority_transfer=false',
              'formal_credit_delta=0',
              'engineering_credit_delta=0'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 879,
              body
            });

      - name: Publish rejected/failed attempt pointer
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'MISSIONCONTROL_RUNTIME_RECEIPT',
              'status=REJECTED_OR_FAILED',
              'transport=OWNER_COMMENT_STAGE_ONLY',
              'run_id=${{ github.run_id }}',
              'run_attempt=${{ github.run_attempt }}',
              'source_comment_id=${{ github.event.comment.id }}',
              'mutation_enabled=false'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 879,
              body
            });

name: QPS W111 Power Utility KEB

on:
  pull_request:
    paths:
      - 'triage/W111_QPS_POWER_UTILITY_KEB_BRIDGE.yaml'
      - 'triage/payloads/QPS_W111_POWER_UTILITY_SANITIZED_v1.json'
      - 'scripts/validate_qps_w111_power_utility_bridge.py'
      - 'triage/PIPELINE_REGISTRY.yaml'
      - '.github/workflows/qps-w111-power-utility-keb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-provenance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Validate exact W111 payload and emit KEB receipt
        run: >-
          python scripts/validate_qps_w111_power_utility_bridge.py
          --receipt /tmp/keb_w111_power_utility_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: keb-w111-power-utility-${{ github.sha }}
          path: /tmp/keb_w111_power_utility_receipt.json

name: Mycelium MIP Operational DAG W1
on:
  pull_request:
    paths:
      - 'mission_control/mycelium/live_ops/**'
      - 'tests/test_live_ops_dag.py'
      - 'tests/test_live_ops_events.py'
      - '.github/workflows/mycelium-live-ops-w1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2022, python: '3.11'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: MIP negative and reverse task-state qualification
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m unittest discover -s tests -p test_live_ops_dag.py -v
          python -m unittest discover -s tests -p test_live_ops_events.py -v
          python mission_control/mycelium/live_ops/dag_observer.py --input mission_control/mycelium/live_ops/W1_FIXTURE.json --output live_ops/W1_METRICS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ops-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live_ops/W1_METRICS.json
          if-no-files-found: error

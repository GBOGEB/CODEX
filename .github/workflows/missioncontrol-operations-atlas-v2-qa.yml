name: MissionControl Operations Atlas V2 QA
on:
  pull_request:
    paths:
      - 'docs/data/missioncontrol_operations_atlas_v2.json'
      - 'docs/missioncontrol_operations_atlas_v2.mmd'
      - 'docs/missioncontrol_operations_atlas.html'
      - 'docs/missioncontrol_federated_launchpad.html'
      - 'docs/index.html'
      - 'tests/test_missioncontrol_operations_atlas_v2.py'
      - 'scripts/qa_missioncontrol_operations_atlas_v2.py'
      - 'scripts/rebuild_missioncontrol_operations_atlas_v2.py'
      - '.github/workflows/missioncontrol-operations-atlas-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-native-qa:
    name: Atlas V2 source-contract and responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact current source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse a stale checkout
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install test runner and browser
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Prove the generated HTML, Mermaid and source JSON are synchronized
        run: python scripts/rebuild_missioncontrol_operations_atlas_v2.py --check
      - name: Qualify typed graph and no-remote-mutation contracts
        run: python -m pytest -q tests/test_missioncontrol_operations_atlas_v2.py
      - name: Run responsive and interaction QA
        run: python scripts/qa_missioncontrol_operations_atlas_v2.py --docs-dir docs --output-dir artifacts/missioncontrol-operations-atlas-v2
      - name: Preserve source identity and visual receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missioncontrol-operations-atlas-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/missioncontrol-operations-atlas-v2/
          if-no-files-found: warn
          retention-days: 14

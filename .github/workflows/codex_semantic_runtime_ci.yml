name: CODEX Semantic Runtime CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Run semantic validator
        run: |
          python semantic_substrate/validators/validate_semantic_substrate.py

      - name: Run orchestration loop
        run: |
          python semantic_substrate/runtime/orchestration_loop.py

      - name: Run delta extractor
        run: |
          python semantic_substrate/engines/delta_extractor.py

      - name: Run tuple registry engine
        run: |
          python semantic_substrate/engines/tuple_registry_engine.py

      - name: Run telemetry dashboard
        run: |
          if [ -f semantic_substrate/telemetry/semantic_telemetry_dashboard.py ]; then
            python semantic_substrate/telemetry/semantic_telemetry_dashboard.py
          else
            viewer_entrypoint="$(find semantic_substrate/viewers -maxdepth 1 -type f -name '*.py' | sort | head -n 1)"
            if [ -n "$viewer_entrypoint" ]; then
              python "$viewer_entrypoint"
            else
              echo "No telemetry dashboard or viewer entrypoint found." >&2
              exit 1
            fi
          fi

      - name: Run tests
        run: |
          pytest -q --ignore=tests/test_master_input_validator.py --ignore=tests/test_ssot_validator.py

      - name: Build QPS W08 KEB runtime return
        run: |
          mkdir -p qps_w08_keb_return
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("qps_w08_keb_return/runtime_receipt.json")
          receipt = {
              "schema_version": "0.1",
              "document_id": "QPS_W08_KEB_RUNTIME_RETURN",
              "status": "CANDIDATE_ONLY",
              "authority": "CODEX_parent_semantic_runtime",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "ref": os.environ["GITHUB_REF"],
              "semantic_runtime_checks_passed": True,
              "child_disposition": "UNSET",
              "parent_credit_promotion_allowed": False,
              "missing_hash_inference_allowed": False,
          }
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cp PIPELINE/GLOSSARY.yaml qps_w08_keb_return/GLOSSARY.yaml
          cp MANIFEST.json qps_w08_keb_return/MANIFEST.json
          if [ -f feedback/qps_w08_keb_candidate_return_receipt.yaml ]; then
            cp feedback/qps_w08_keb_candidate_return_receipt.yaml qps_w08_keb_return/
          fi
          (
            cd qps_w08_keb_return
            sha256sum runtime_receipt.json GLOSSARY.yaml MANIFEST.json \
              > SHA256SUMS
            if [ -f qps_w08_keb_candidate_return_receipt.yaml ]; then
              sha256sum qps_w08_keb_candidate_return_receipt.yaml >> SHA256SUMS
            fi
          )
          cat qps_w08_keb_return/SHA256SUMS

      - name: Upload QPS W08 KEB runtime return
        uses: actions/upload-artifact@v4
        with:
          name: qps-w08-keb-runtime-return-${{ github.run_id }}
          path: qps_w08_keb_return/
          if-no-files-found: error
          retention-days: 30

  renderer-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest structure
        run: |
          test -f MANIFEST.json

      - name: Validate dark mode governance references
        run: |
          grep "#FFE9A3" MANIFEST.json || exit 1
          grep "semantic colors must transform by theme" MANIFEST.json || exit 1

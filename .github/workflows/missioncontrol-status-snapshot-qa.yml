name: MissionControl Status Snapshot Browser QA

on:
  pull_request:
    paths:
      - 'docs/missioncontrol_status_snapshot.html'
      - 'docs/assets/missioncontrol/status-snapshot.js'
      - 'docs/data/missioncontrol_status_snapshot_v01.json'
      - 'scripts/qa_missioncontrol_status_snapshot.py'
      - '.github/workflows/missioncontrol-status-snapshot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run responsive browser QA
        run: |
          python scripts/qa_missioncontrol_status_snapshot.py \
            --docs-dir docs \
            --output-dir artifacts/missioncontrol-status-snapshot-qa
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missioncontrol-status-snapshot-browser-qa
          path: artifacts/missioncontrol-status-snapshot-qa
          if-no-files-found: error

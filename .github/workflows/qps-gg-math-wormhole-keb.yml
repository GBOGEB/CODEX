name: QPS gg_MATH Wormhole KEB Semantic Challenge
on:
  pull_request:
    paths:
      - 'scripts/qps_math_wormhole_keb.py'
      - 'tests/test_qps_math_wormhole_keb.py'
      - 'docs/ci/QPS_GG_MATH_WORMHOLE_KEB_V1.md'
      - '.github/workflows/qps-gg-math-wormhole-keb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keb-semantic-candidate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independent semantic and identity regressions
        run: python -m unittest discover -s tests -p test_qps_math_wormhole_keb.py -v

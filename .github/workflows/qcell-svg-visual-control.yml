name: QCELL SVG Visual Control

on:
  pull_request:
    paths:
      - 'qcell_svg_model/**'
      - '.github/workflows/qcell-svg-visual-control.yml'
  push:
    branches: [main]
    paths:
      - 'qcell_svg_model/**'
      - '.github/workflows/qcell-svg-visual-control.yml'

permissions:
  contents: read

jobs:
  visual-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Record exact subject SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual-control dependency
        run: python -m pip install --disable-pip-version-check defusedxml==0.7.1
      - name: Run fail-closed QCELL visual-control checks
        run: python qcell_svg_model/v0_7_7/scripts/check_qcell_visual_control.py

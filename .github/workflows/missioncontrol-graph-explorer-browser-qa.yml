name: MissionControl Graph Explorer Browser QA

on:
  pull_request:
    paths:
      - 'docs/missioncontrol_graph_explorer.html'
      - 'docs/missioncontrol_mycelium.html'
      - 'docs/assets/missioncontrol/**'
      - 'docs/data/missioncontrol_interaction_graph.json'
      - 'docs/data/missioncontrol_graph_analysis.json'
      - 'scripts/qa_missioncontrol_graph_explorer.py'
      - 'scripts/render_missioncontrol_graph_matplotlib.py'
      - '.github/workflows/missioncontrol-graph-explorer-browser-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/missioncontrol_graph_explorer.html'
      - 'docs/missioncontrol_mycelium.html'
      - 'docs/assets/missioncontrol/**'
      - 'docs/data/missioncontrol_interaction_graph.json'
      - 'docs/data/missioncontrol_graph_analysis.json'
      - 'scripts/qa_missioncontrol_graph_explorer.py'
      - 'scripts/render_missioncontrol_graph_matplotlib.py'
      - '.github/workflows/missioncontrol-graph-explorer-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and static renderer
        run: |
          python -m pip install --upgrade pip playwright "matplotlib>=3.8"
          python -m playwright install --with-deps chromium
      - name: Materialize Matplotlib evidence
        run: python scripts/render_missioncontrol_graph_matplotlib.py
      - name: Run graph explorer interaction QA
        run: |
          python scripts/qa_missioncontrol_graph_explorer.py \
            --docs-dir docs \
            --output-dir artifacts/missioncontrol-graph-explorer-qa
      - name: Upload screenshots and interaction receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missioncontrol-graph-explorer-browser-qa
          path: artifacts/missioncontrol-graph-explorer-qa/
          if-no-files-found: error
          retention-days: 14

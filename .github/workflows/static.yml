# Non-authoritative static candidate builder.
name: Build static content candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package static candidate without Pages deployment authority
        uses: actions/upload-artifact@v4
        with:
          name: legacy-static-candidate-${{ github.sha }}
          path: |
            .
            !.git
            !.git/**
          include-hidden-files: true

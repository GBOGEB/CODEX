name: ABACUS Multi-Format Publication

on:
  pull_request:
    paths:
      - 'abacus_render_pipeline/A7_executable_semantic_runtime/**'
      - 'abacus_render_pipeline/A9_multiformat_publication/**'
      - 'codex/contract_governance/**'
      - 'contract_governance/**'
      - 'PIPELINE/GLOSSARY_EXTENSIONS.yaml'
      - 'requirements/contract-governance.txt'
      - 'scripts/check_pages_deploy_concurrency.py'
      - 'scripts/check_pages_source_mode.py'
      - 'tests/test_pages_deploy_concurrency.py'
      - 'tests/test_pages_source_mode.py'
      - '.github/workflows/pages_deploy_runtime.yml'
      - '.github/workflows/deploy_pipeline.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/abacus-multiformat-publication.yml'
  push:
    branches:
      - main
    paths:
      - 'abacus_render_pipeline/A7_executable_semantic_runtime/**'
      - 'abacus_render_pipeline/A9_multiformat_publication/**'
      - 'codex/contract_governance/**'
      - 'contract_governance/**'
      - 'PIPELINE/GLOSSARY_EXTENSIONS.yaml'
      - 'requirements/contract-governance.txt'
      - 'scripts/check_pages_deploy_concurrency.py'
      - 'scripts/check_pages_source_mode.py'
      - 'tests/test_pages_deploy_concurrency.py'
      - 'tests/test_pages_source_mode.py'
      - '.github/workflows/pages_deploy_runtime.yml'
      - '.github/workflows/deploy_pipeline.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/abacus-multiformat-publication.yml'

jobs:
  multiformat-publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      ABACUS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned production renderer dependencies
        run: |
          python -m pip install -r requirements/contract-governance.txt
          python -m pip install jsonschema
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Validate semantic vocabulary before rendering
        run: python semantic_substrate/validators/validate_semantic_substrate.py

      - name: Validate repository-wide Pages deployment ownership
        run: |
          python scripts/check_pages_deploy_concurrency.py
          pytest -q tests/test_pages_deploy_concurrency.py
          pytest -q tests/test_pages_source_mode.py

      - name: Validate GitHub Pages source mode before exact-main rendering
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_pages_source_mode.py

      - name: Prove production PPTX and PDF builder regressions
        run: |
          pytest tests/contract_governance/test_pptx_builder.py tests/contract_governance/test_pdf_builder.py -q

      - name: Execute production multi-format publication candidates
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        run: python multiformat_execution.py

      - name: Independently validate all candidate artifact hashes and parity
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        run: python receipt_validation.py

      - name: Prove atomic promotion is withheld before hosted Pages evidence
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        run: python publication_promotion.py --allow-withhold

      - name: Run A9.3 tamper parity hosted-Pages and promotion tests
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        run: python test_multiformat_execution.py

      - name: Re-prove semantic closed loop at TUP-0012 stability gate
        working-directory: abacus_render_pipeline/A7_executable_semantic_runtime
        run: |
          python test_closed_loop.py
          python semantic_delta_replay.py

      - name: Upload multi-format candidates and pre-deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abacus-multiformat-publication-${{ env.ABACUS_SOURCE_SHA }}
          if-no-files-found: warn
          path: |
            abacus_render_pipeline/A9_multiformat_publication/outputs/**
            abacus_render_pipeline/A9_multiformat_publication/receipts/multiformat_execution_receipt.json
            abacus_render_pipeline/A9_multiformat_publication/receipts/publication_promotion_receipt.json
            abacus_render_pipeline/A9_multiformat_publication/receipts/pages_source_mode_receipt.json

      - name: Package governed Pages candidate for real deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: abacus_render_pipeline/A9_multiformat_publication/outputs/github_pages

  deploy-and-prove-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: multiformat-publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy governed artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install independent receipt validation dependencies
        run: |
          python -m pip install -r requirements/contract-governance.txt
          python -m pip install jsonschema
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Recover exact candidate artifacts and execution receipt
        uses: actions/download-artifact@v4
        with:
          name: abacus-multiformat-publication-${{ github.sha }}
          path: abacus_render_pipeline/A9_multiformat_publication

      - name: Wait for hosted Pages to converge and create execution receipt
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        env:
          ABACUS_SOURCE_SHA: ${{ github.sha }}
          ABACUS_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python hosted_pages_receipt.py

      - name: Independently reconverge hosted Pages and issue one atomic promotion receipt
        working-directory: abacus_render_pipeline/A9_multiformat_publication
        env:
          ABACUS_SOURCE_SHA: ${{ github.sha }}
          ABACUS_VERIFY_HOSTED_PAGES: '1'
        run: python publication_promotion.py

      - name: Upload hosted publication proof and final promotion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abacus-pages-proof-${{ github.sha }}
          if-no-files-found: warn
          path: |
            abacus_render_pipeline/A9_multiformat_publication/receipts/github_pages_hosted_receipt.json
            abacus_render_pipeline/A9_multiformat_publication/receipts/publication_promotion_receipt.json

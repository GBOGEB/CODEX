name: W105 QPS B1-B2 MIP Probe
on:
  pull_request:
    paths:
      - '.github/workflows/w105-qps-b1b2-mip-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QPS_SHA: 7145bf462af40028000e676c98a8d060210872cc
    steps:
      - name: Checkout exact QPS child SHA
        uses: actions/checkout@v4
        with:
          repository: GBOGEB/cryoplant-project
          ref: ${{ env.QPS_SHA }}
          path: qps
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl PyYAML
      - name: Validate child MIP contract
        run: python qps/scripts/validate_mip_3p3.py
      - name: Materialize pass 1
        run: python qps/scripts/qps_w85_materialize_alat_surfaces.py --out-dir out/pass1 --expected-head "$QPS_SHA"
      - name: Materialize pass 2
        run: python qps/scripts/qps_w85_materialize_alat_surfaces.py --out-dir out/pass2 --expected-head "$QPS_SHA"
      - name: Enforce zero delta
        run: |
          cmp out/pass1/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.xlsx out/pass2/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.xlsx
          cmp out/pass1/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.html out/pass2/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.html
      - name: Emit diagnostic receipt
        run: |
          mkdir -p receipt
          printf 'repository=GBOGEB/CODEX\nqps_sha=%s\nexecution=PASS_DIAGNOSTIC_ONLY\nauthority=NONE\nrelease_credit=0\n' "$QPS_SHA" > receipt/W105_QPS_B1B2_MIP_PROBE.txt
          cat out/pass1/SHA256SUMS >> receipt/W105_QPS_B1B2_MIP_PROBE.txt
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: w105-qps-b1b2-mip-probe-${{ env.QPS_SHA }}
          path: |
            receipt/
            out/pass1/

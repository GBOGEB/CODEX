name: render-regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  render-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
          pip install -e .

      - name: Validate regression scaffolds
        run: |
          test -f renderers/regression/html_baseline_compare.py
          test -f renderers/regression/screenshot_compare.py

      - name: Execute runtime theme tests
        run: |
          pytest tests/test_theme_runtime.py

      - name: Emit render QA receipts
        run: |
          python scripts/emit_render_qa_receipts.py --output reports/render_qa_receipts.json

      - name: Execute render QA receipt tests
        run: |
          pytest tests/test_render_qa_receipts.py

      - name: Upload render QA receipts
        uses: actions/upload-artifact@v4
        with:
          name: render-qa-receipts
          path: reports/render_qa_receipts.json

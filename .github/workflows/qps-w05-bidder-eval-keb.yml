name: QPS W05 bidder evaluation KEB receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_KEB_REQUEST.yaml'
      - 'federation/qps/snapshots/QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml'
      - 'PIPELINE/GLOSSARY.yaml'
      - 'tools/run_qps_w05_bidder_eval_keb.py'
      - 'tools/validate_qps_w05_bidder_eval_keb.py'
      - '.github/workflows/qps-w05-bidder-eval-keb.yml'
  push:
    branches: [main]
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_KEB_REQUEST.yaml'
      - 'federation/qps/snapshots/QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml'
      - 'PIPELINE/GLOSSARY.yaml'
      - 'tools/run_qps_w05_bidder_eval_keb.py'
      - 'tools/validate_qps_w05_bidder_eval_keb.py'
      - '.github/workflows/qps-w05-bidder-eval-keb.yml'

permissions:
  contents: read

jobs:
  execute-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Produce W05 KEB receipt
        run: python tools/run_qps_w05_bidder_eval_keb.py
      - name: Validate W05 KEB receipt
        run: >-
          python tools/validate_qps_w05_bidder_eval_keb.py
          federation/qps/runtime/QPS_FED_W05_BIDDER_EVAL_KEB_RECEIPT.yaml
      - name: Upload validated W05 KEB receipt
        uses: actions/upload-artifact@v4
        with:
          name: qps-w05-bidder-eval-keb-${{ github.run_id }}
          path: federation/qps/runtime/QPS_FED_W05_BIDDER_EVAL_KEB_RECEIPT.yaml
          if-no-files-found: error
      - name: Validate repository semantic substrate
        run: python semantic_substrate/validators/validate_semantic_substrate.py

name: QCELL SVG Deterministic Render

on:
  pull_request:
    paths:
      - 'qcell_svg_model/**'
      - '.github/workflows/qcell-svg-determinism.yml'
  push:
    branches: [main]
    paths:
      - 'qcell_svg_model/**'
      - '.github/workflows/qcell-svg-determinism.yml'

permissions:
  contents: read

jobs:
  deterministic-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Render A from SSOT
        run: |
          mkdir -p "$RUNNER_TEMP/qsvg-a"
          python qcell_svg_model/v0_7_7/scripts/generate_qcell_main.py \
            --out-dir "$RUNNER_TEMP/qsvg-a" --verify-tracked \
            | tee "$RUNNER_TEMP/qsvg-a/receipt.json"
      - name: Render B from SSOT
        run: |
          mkdir -p "$RUNNER_TEMP/qsvg-b"
          python qcell_svg_model/v0_7_7/scripts/generate_qcell_main.py \
            --out-dir "$RUNNER_TEMP/qsvg-b" --verify-tracked \
            | tee "$RUNNER_TEMP/qsvg-b/receipt.json"
      - name: Require normalized equality
        run: |
          cmp "$RUNNER_TEMP/qsvg-a/qcell_main_v0_7_7.svg" "$RUNNER_TEMP/qsvg-b/qcell_main_v0_7_7.svg"
          cmp "$RUNNER_TEMP/qsvg-a/index.html" "$RUNNER_TEMP/qsvg-b/index.html"
          cmp "$RUNNER_TEMP/qsvg-a/receipt.json" "$RUNNER_TEMP/qsvg-b/receipt.json"
          sha256sum "$RUNNER_TEMP/qsvg-a/qcell_main_v0_7_7.svg" "$RUNNER_TEMP/qsvg-a/index.html"
      - name: Require clean repository
        run: test -z "$(git status --porcelain)"
      - name: Retain deterministic render evidence
        uses: actions/upload-artifact@v4
        with:
          name: qcell-svg-determinism-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qsvg-a/qcell_main_v0_7_7.svg
            ${{ runner.temp }}/qsvg-a/index.html
            ${{ runner.temp }}/qsvg-a/receipt.json
          if-no-files-found: error

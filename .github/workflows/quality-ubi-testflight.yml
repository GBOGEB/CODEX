name: Quality burndown and UBI 9 testflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'scripts/check_authority_integrity.py'
      - 'scripts/check_release_identity.py'
      - '.github/workflows/quality-ubi-testflight.yml'
      - 'pyproject.toml'
      - 'tests/test_quality_burndown.py'
      - 'tests/test_ubi_runtime_receipt.py'
      - 'tests/test_quality_ubi_join_contract.py'
  push:
    branches: [main, repair/20261013-postmerge-ruff-i001]
    paths:
      - 'scripts/**'
      - 'scripts/check_authority_integrity.py'
      - 'scripts/check_release_identity.py'
      - '.github/workflows/quality-ubi-testflight.yml'
      - 'pyproject.toml'
      - 'tests/test_quality_ubi_join_contract.py'

permissions:
  contents: read

jobs:
  quality-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Classify actual checkout SHA
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evaluated_sha="$(git rev-parse HEAD)"
          if [[ "$evaluated_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout mismatch with evaluated GitHub SHA" >&2
            exit 1
          fi
          if [[ "$evaluated_sha" == "$REQUESTED_HEAD_SHA" ]]; then
            checkout_identity=EXACT_HEAD
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_identity=PR_MERGE_TEST
          else
            echo "::error::Unexpected checkout outside PR merge test" >&2
            exit 1
          fi
          echo "EVALUATED_SHA=$evaluated_sha" >> "$GITHUB_ENV"
          echo "REQUESTED_HEAD_SHA=$REQUESTED_HEAD_SHA" >> "$GITHUB_ENV"
          echo "CHECKOUT_IDENTITY=$checkout_identity" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned scanners
        run: |
          python -m pip install 'pytest>=7.0' ruff==0.16.6 pyright==1.1.407 'pytest-cov>=6,<9'
          python -m pip install -e .
      - name: Measure Ruff and Pyright independently
        shell: bash
        run: |
          mkdir -p outputs/quality
          set +e
          ruff check scripts --show-files > outputs/quality/ruff-scanned-files.txt
          ruff check scripts --output-format json > outputs/quality/ruff.json
          ruff_rc=$?
          pyright scripts/quality_burndown.py scripts/check_bridge_alignment.py scripts/check_svg_links.py --outputjson > outputs/quality/pyright.json
          pyright_rc=$?
          # Expanded T2 census is advisory and NOT comparable with the frozen single-file Pyright B1.
          pyright scripts --outputjson > outputs/quality/pyright-expanded.json
          pyright_expanded_rc=$?
          set -e
          python -m pytest -q tests/test_quality_burndown.py tests/test_ubi_runtime_receipt.py tests/test_quality_ubi_join_contract.py --junitxml=outputs/quality/pytest-quality.xml --cov=scripts.quality_burndown --cov=scripts.diagnostic_coverage_rollup --cov-report=xml:outputs/quality/coverage.xml --cov-report=term-missing
          git fetch --no-tags --depth=100 origin main
          base_sha="$(git merge-base HEAD origin/main)"
          python scripts/measure_changed_line_coverage.py outputs/quality/coverage.xml "$base_sha" outputs/quality/diff-coverage.json
          python scripts/quality_burndown.py --ruff outputs/quality/ruff.json --pyright outputs/quality/pyright.json --source-sha "$EVALUATED_SHA" --requested-head-sha "$REQUESTED_HEAD_SHA" --ruff-scanned-files outputs/quality/ruff-scanned-files.txt --out outputs/quality/burndown.json
          echo "Ruff exit: $ruff_rc; baseline Pyright exit: $pyright_rc; expanded Pyright exit: $pyright_expanded_rc"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codex-quality-census
          path: .
          if-no-files-found: error

  ubi9-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Classify actual checkout SHA
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evaluated_sha="$(git rev-parse HEAD)"
          if [[ "$evaluated_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout mismatch with evaluated GitHub SHA" >&2
            exit 1
          fi
          if [[ "$evaluated_sha" == "$REQUESTED_HEAD_SHA" ]]; then
            checkout_identity=EXACT_HEAD
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_identity=PR_MERGE_TEST
          else
            echo "::error::Unexpected checkout outside PR merge test" >&2
            exit 1
          fi
          echo "EVALUATED_SHA=$evaluated_sha" >> "$GITHUB_ENV"
          echo "REQUESTED_HEAD_SHA=$REQUESTED_HEAD_SHA" >> "$GITHUB_ENV"
          echo "CHECKOUT_IDENTITY=$checkout_identity" >> "$GITHUB_ENV"
      - name: Resolve and pin UBI image digest for this run
        shell: bash
        run: |
          set -euo pipefail
          docker pull registry.access.redhat.com/ubi9/python-312:latest
          image_ref="$(docker image inspect registry.access.redhat.com/ubi9/python-312:latest --format '{{index .RepoDigests 0}}')"
          case "$image_ref" in *@sha256:*) ;; *) echo "No digest" >&2; exit 1;; esac
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "$image_ref" > image-ref.txt
      - name: Execute real Python entrypoints inside UBI 9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ubi9
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GITHUB_SHA="$GITHUB_SHA" -e IMAGE_REF="$IMAGE_REF" \
            -e EVALUATED_SHA="$EVALUATED_SHA" -e REQUESTED_HEAD_SHA="$REQUESTED_HEAD_SHA" \
            -e CHECKOUT_IDENTITY="$CHECKOUT_IDENTITY" \
            -v "$PWD:/workspace" -w /workspace "$IMAGE_REF" /bin/bash -c '
              set -euo pipefail
              python --version > outputs/ubi9/python-version.txt 2>&1
              python -m venv /tmp/codex-testflight-venv
              /tmp/codex-testflight-venv/bin/python -m pip install --disable-pip-version-check -e . > outputs/ubi9/install.log 2>&1
              /tmp/codex-testflight-venv/bin/python -m pip freeze > outputs/ubi9/dependencies.txt
              /tmp/codex-testflight-venv/bin/python scripts/check_authority_integrity.py > outputs/ubi9/authority.log 2>&1
              /tmp/codex-testflight-venv/bin/python scripts/check_release_identity.py > outputs/ubi9/release_identity.log 2>&1
              # An actual output-producing advisory pipeline; output stays in the testflight artifact.
              start_ns="$(date +%s%N)"
              set +e
              /tmp/codex-testflight-venv/bin/python scripts/code_purple_rex_rollup.py --out outputs/ubi9/rex-rollup.json > outputs/ubi9/rex-rollup.log 2>&1
              pipeline_rc=$?
              set -e
              end_ns="$(date +%s%N)"
              printf "%s\n" "$pipeline_rc" > outputs/ubi9/rex-rollup.exitcode
              printf "%s\n" "$(( (end_ns - start_ns) / 1000000 ))" > outputs/ubi9/rex-rollup.duration_ms
              test "$pipeline_rc" -eq 0
              test -s outputs/ubi9/rex-rollup.json
              /tmp/codex-testflight-venv/bin/python scripts/ubi_runtime_receipt.py
            '
      - name: Publish runtime receipts and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-ubi9-runtime
          path: |
            outputs/ubi9/
            image-ref.txt
          if-no-files-found: warn

  evidence-join:
    needs: [quality-census, ubi9-runtime]
    if: always() && needs.quality-census.result == 'success' && needs.ubi9-runtime.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7.0.0
        with:
          name: codex-quality-census
          # The producer archive preserves outputs/quality/ within its root.
          path: .
      - uses: actions/download-artifact@v7.0.0
        with:
          name: codex-ubi9-runtime
          path: .
      - name: Validate input source binding and join receipts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          sha = os.environ["GITHUB_SHA"]
          quality = json.loads(Path("outputs/quality/burndown.json").read_text())
          runtime = json.loads(Path("outputs/ubi9/receipt.json").read_text())
          if quality.get("source_sha") != sha or runtime.get("source_sha") != sha:
              raise SystemExit("Refusing mismatched exact-head evidence")
          if not quality.get("input_sha256") or not runtime.get("sha256"):
              raise SystemExit("Refusing unbound quality or runtime evidence")
          PY
          python scripts/diagnostic_coverage_rollup.py \
            --source-sha "$GITHUB_SHA" \
            --quality outputs/quality/burndown.json \
            --runtime outputs/ubi9/receipt.json \
            --out outputs/diagnostic_coverage/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("outputs/diagnostic_coverage/receipt.json").read_text())
          assert d["coverage"]["quality"]["status"] == "MEASURED"
          assert d["coverage"]["runtime"]["status"] == "MEASURED"
          assert d["coverage"]["ldab"]["status"] == "UNKNOWN"
          assert d["coverage"]["crew"]["status"] == "UNKNOWN"
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-joined-diagnostic-coverage
          path: outputs/diagnostic_coverage/receipt.json
          if-no-files-found: error

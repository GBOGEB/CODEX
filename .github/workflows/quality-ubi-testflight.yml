name: Quality burndown and UBI 9 testflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/quality_burndown.py'
      - 'scripts/check_authority_integrity.py'
      - 'scripts/check_release_identity.py'
      - '.github/workflows/quality-ubi-testflight.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'scripts/quality_burndown.py'
      - 'scripts/check_authority_integrity.py'
      - 'scripts/check_release_identity.py'
      - '.github/workflows/quality-ubi-testflight.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  quality-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned scanners
        run: python -m pip install ruff==0.16.6 pyright==1.1.407
      - name: Measure Ruff and Pyright independently
        shell: bash
        run: |
          mkdir -p outputs/quality
          set +e
          ruff check scripts --output-format json > outputs/quality/ruff.json
          ruff_rc=$?
          pyright scripts/quality_burndown.py --outputjson > outputs/quality/pyright.json
          pyright_rc=$?
          set -e
          python scripts/quality_burndown.py --ruff outputs/quality/ruff.json --pyright outputs/quality/pyright.json --source-sha "$GITHUB_SHA" --out outputs/quality/burndown.json
          echo "Ruff exit: $ruff_rc; Pyright exit: $pyright_rc"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codex-quality-census
          path: outputs/quality/
          if-no-files-found: error

  ubi9-runtime:
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/python-312:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Real CODEX runtime testflight and receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ubi9
          python --version | tee outputs/ubi9/python-version.txt
          python -m pip install --disable-pip-version-check -e .
          python -m pip freeze > outputs/ubi9/dependencies.txt
          python scripts/check_authority_integrity.py > outputs/ubi9/authority.log 2>&1
          python scripts/check_release_identity.py > outputs/ubi9/release_identity.log 2>&1
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path("outputs/ubi9")
          image = os.environ.get("UBI_IMAGE_DIGEST", "UNVERIFIED_DIGEST")
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.iterdir()) if p.is_file()}
          receipt = {"schema": "codex-ubi-testflight/v1",
                     "source_sha": os.environ.get("GITHUB_SHA"),
                     "container_image": "registry.access.redhat.com/ubi9/python-312:latest",
                     "image_digest": image,
                     "python": platform.python_version(),
                     "system": platform.platform(),
                     "executed_entrypoints": [
                       "scripts/check_authority_integrity.py",
                       "scripts/check_release_identity.py"],
                     "outcomes": {"authority_integrity": "PASS", "release_identity": "PASS"},
                     "sha256": hashes}
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codex-ubi9-runtime
          path: outputs/ubi9/
          if-no-files-found: warn

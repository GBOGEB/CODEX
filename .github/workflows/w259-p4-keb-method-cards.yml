name: W259 P4 KEB Method Cards

on:
  pull_request:
    paths:
      - 'ssot/bridge_rows/gg_math_method_cards_w259_p4_source_receipt.json'
      - 'scripts/validate_w259_p4_method_cards_source_receipt.py'
      - '.github/workflows/w259-p4-keb-method-cards.yml'
  push:
    branches: [main]
    paths:
      - 'ssot/bridge_rows/gg_math_method_cards_w259_p4_source_receipt.json'
      - 'scripts/validate_w259_p4_method_cards_source_receipt.py'
      - '.github/workflows/w259-p4-keb-method-cards.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-source-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact checkout head
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Validate W259 P4 KEB source receipt
        run: |
          python scripts/validate_w259_p4_method_cards_source_receipt.py --out artifacts/w259-p4-keb-source-validation.json
      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: w259-p4-keb-source-validation
          path: artifacts/w259-p4-keb-source-validation.json
          if-no-files-found: error

name: CReq Federation CI
on:
  pull_request:
    paths:
      - 'triage/requirements/**'
      - 'src/**'
      - 'codex/**'
      - '.github/workflows/creq-federation-ci.yml'
  workflow_dispatch:
jobs:
  resolve-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve and enforce CODEX CReq
        run: |
          python triage/requirements/creq_ci_gate.py \
            --registry triage/requirements/GLOBAL_CREQ_REGISTRY.json \
            --overlay triage/requirements/CODEX_CREQ_OVERLAY.json \
            --resolver triage/requirements/creq_resolver.py \
            --out triage/requirements/receipts/CODEX_CREQ_CI_RESOLUTION.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: creq-codex-receipt
          path: triage/requirements/receipts/CODEX_CREQ_CI_*.json

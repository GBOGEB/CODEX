name: MissionControl Federated Launchpad Browser QA
on:
  pull_request:
    paths:
      - 'docs/missioncontrol_federated_launchpad.html'
      - 'docs/data/missioncontrol_federated_dag_v1.json'
      - 'scripts/qa_missioncontrol_federated_launchpad.py'
      - 'tests/test_missioncontrol_federated_launchpad.py'
      - '.github/workflows/missioncontrol-federated-launchpad-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
      - name: Run source-contract tests
        run: python -m pytest tests/test_missioncontrol_federated_launchpad.py -q
      - name: Run responsive browser QA
        run: python scripts/qa_missioncontrol_federated_launchpad.py --docs-dir docs --output-dir artifacts/mc-federated-qa
      - name: Upload screenshots and source digests
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: missioncontrol-federated-launchpad-browser-qa
          path: artifacts/mc-federated-qa/
          if-no-files-found: error
          retention-days: 14

name: QPS W04 KEB receipt contract
on:
  workflow_dispatch:
    inputs:
      priority_runner:
        description: 'Use dedicated CODEX W04 self-hosted runner lane'
        required: false
        default: false
        type: boolean
  pull_request:
    paths: ['tests/fixtures/qps_w04_keb_receipt_fixture.yaml','tools/validate_qps_w04_keb_receipt.py','tools/run_qps_w04_keb_return.py','federation/qps/QPS_FED_W04_KEB_REQUEST.yaml','federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml','PIPELINE/qps_w04_keb_qa_actions.yaml','PIPELINE/GLOSSARY.yaml','.github/workflows/qps-w04-keb-receipt.yml']
  push:
    branches: [main]
    paths: ['tests/fixtures/qps_w04_keb_receipt_fixture.yaml','tools/validate_qps_w04_keb_receipt.py','tools/run_qps_w04_keb_return.py','federation/qps/QPS_FED_W04_KEB_REQUEST.yaml','federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml','PIPELINE/qps_w04_keb_qa_actions.yaml','PIPELINE/GLOSSARY.yaml','.github/workflows/qps-w04-keb-receipt.yml']
permissions:
  contents: read
env:
  QPS_W04_CHILD_SHA: ec12b09873a8e0668176d8212f8d09ecdbe18bad
jobs:
  validate-w04-keb-receipt:
    if: github.event_name != 'workflow_dispatch' || inputs.priority_runner != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python tools/validate_qps_w04_keb_receipt.py tests/fixtures/qps_w04_keb_receipt_fixture.yaml
  execute-w04-keb-runtime:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.priority_runner != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CODEX parent
        uses: actions/checkout@v4
        with: {path: parent}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Produce governed W04 KEB runtime receipt
        working-directory: parent
        run: python tools/run_qps_w04_keb_return.py --child-sha "$QPS_W04_CHILD_SHA"
      - name: Validate produced W04 KEB runtime receipt
        working-directory: parent
        run: python tools/validate_qps_w04_keb_receipt.py federation/qps/runtime/QPS_FED_W04_KEB_RUNTIME_RECEIPT.yaml
      - name: Upload W04 KEB runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: qps-w04-keb-runtime-receipt-${{ github.run_id }}
          path: parent/federation/qps/runtime/QPS_FED_W04_KEB_RUNTIME_RECEIPT.yaml
          if-no-files-found: error

  execute-w04-keb-runtime-priority:
    if: github.event_name == 'workflow_dispatch' && inputs.priority_runner == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, codex-w04]
    timeout-minutes: 15
    steps:
      - name: Checkout CODEX parent
        uses: actions/checkout@v4
        with: {path: parent}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate fixture contract before runtime
        working-directory: parent
        run: python tools/validate_qps_w04_keb_receipt.py tests/fixtures/qps_w04_keb_receipt_fixture.yaml
      - name: Produce governed W04 KEB runtime receipt
        working-directory: parent
        run: python tools/run_qps_w04_keb_return.py --child-sha "$QPS_W04_CHILD_SHA"
      - name: Validate produced W04 KEB runtime receipt
        working-directory: parent
        run: python tools/validate_qps_w04_keb_receipt.py federation/qps/runtime/QPS_FED_W04_KEB_RUNTIME_RECEIPT.yaml
      - name: Upload W04 KEB runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: qps-w04-keb-runtime-receipt-${{ github.run_id }}
          path: parent/federation/qps/runtime/QPS_FED_W04_KEB_RUNTIME_RECEIPT.yaml
          if-no-files-found: error

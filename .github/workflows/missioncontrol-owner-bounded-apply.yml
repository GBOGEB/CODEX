name: MissionControl Owner Bounded Apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: missioncontrol-owner-bounded-apply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bounded-apply:
    if: >
      github.event.issue.number == 879 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/missioncontrol apply refresh-federation-heads ')
    name: authenticated-owner-bounded-apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema

      - name: Materialize exact-head bounded-apply request
        env:
          OWNER_COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          python scripts/missioncontrol_owner_bounded_apply_request.py \
            --comment "$OWNER_COMMENT" \
            --observed-head "$observed_head" \
            --run-id "$GITHUB_RUN_ID" \
            --actor "$GITHUB_ACTOR" \
            --out missioncontrol-bounded-apply-request.json

      - name: Execute allow-listed bounded mutation in workspace
        id: apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/missioncontrol_bounded_apply.py apply \
            --request missioncontrol-bounded-apply-request.json \
            --actor "$GITHUB_ACTOR" \
            --run-id "$GITHUB_RUN_ID"

      - name: Validate bounded mutation and MissionControl
        run: |
          set -euo pipefail
          python scripts/validate_missioncontrol_execution_gateway.py
          python scripts/validate_missioncontrol_mycelium.py
          pytest -q \
            tests/test_missioncontrol_execution_gateway.py \
            tests/test_missioncontrol_authenticated_transport.py \
            tests/test_missioncontrol_owner_bounded_apply.py \
            tests/test_missioncontrol_source_ingestion.py \
            tests/test_missioncontrol_metrics.py
          python scripts/build_missioncontrol_metrics.py
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(Path("missioncontrol-bounded-apply-request.json").read_text())
          allowed = set(request["changed_paths"])
          changed = set(
              subprocess.run(
                  ["git", "diff", "--name-only"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
          )
          if not changed:
              raise SystemExit("bounded apply produced no reviewable mutation")
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"bounded apply escaped changed-path allow-list: {unexpected}")
          PY

      - name: Commit bounded mutation to automation branch
        id: mutation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="automation/missioncontrol-bounded-apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git add \
            mission_control/mycelium/source_status.json \
            docs/data/missioncontrol_source_status.json \
            mission_control/mycelium/control_events.json \
            docs/data/missioncontrol_control_events.json \
            mission_control/mycelium/metrics_snapshot.json \
            docs/data/missioncontrol_metrics.json
          git diff --cached --quiet && { echo "::error::No bounded mutation to commit"; exit 1; }
          git commit -m "MissionControl bounded apply: refresh federation heads"
          mutation_sha="$(git rev-parse HEAD)"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "mutation_sha=$mutation_sha" >> "$GITHUB_OUTPUT"

      - name: Create required review PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mutation.outputs.branch }}
          MUTATION_SHA: ${{ steps.mutation.outputs.mutation_sha }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## PR CLASSIFICATION
          - PR-ID: PR-000
          - WAVE: W003
          - SPRINT: S1-P1
          - DOMAIN: EXECUTION_GOVERNANCE_INFRASTRUCTURE
          - TYPE: GOVERNANCE
          - CRITICALITY: HIGH
          - TOPOLOGY IMPACT: NO
          - SCHEMA MUTATION: CONTROLLED
          ---

          Authenticated owner-approved MissionControl bounded apply.

          - action: REFRESH_FEDERATION_HEADS
          - source main: ${{ steps.apply.outputs.observed_head_sha }}
          - mutation commit: $MUTATION_SHA
          - run: ${GITHUB_RUN_ID}
          - direct main write: false
          - remote authority mutation: false
          - authority_transfer: false
          - formal_credit_delta: 0
          - engineering_credit_delta: 0
          EOF
          set +e
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "MissionControl bounded apply: refresh federation heads" \
            --body-file "$body_file" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Required review PR creation failed; automation branch retained but apply is not promoted."
            echo "$pr_url"
            exit "$rc"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Bounded apply PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize mutation receipt
        id: receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/missioncontrol_bounded_apply.py receipt \
            --request missioncontrol-bounded-apply-request.json \
            --actor "$GITHUB_ACTOR" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-name "authenticated-owner-bounded-apply" \
            --after-sha "${{ steps.mutation.outputs.mutation_sha }}" \
            --pr-url "${{ steps.pr.outputs.pr_url }}"

      - name: Commit receipt to automation PR
        env:
          RECEIPT_PATH: ${{ steps.receipt.outputs.receipt_path }}
        run: |
          set -euo pipefail
          git add "$RECEIPT_PATH"
          git commit -m "MissionControl bounded apply: bind execution receipt"
          git push

      - name: Upload bounded-apply receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apply.outputs.artifact_name }}
          path: ${{ steps.receipt.outputs.receipt_path }}
          if-no-files-found: error

      - name: Publish bounded-apply receipt pointer
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'MISSIONCONTROL_BOUNDED_APPLY_RECEIPT',
              'status=EXECUTED_TO_REVIEW_PR',
              'run_id=${{ github.run_id }}',
              'run_attempt=${{ github.run_attempt }}',
              'job_name=authenticated-owner-bounded-apply',
              'observed_head_sha=${{ steps.apply.outputs.observed_head_sha }}',
              'mutation_sha=${{ steps.mutation.outputs.mutation_sha }}',
              'review_pr=${{ steps.pr.outputs.pr_url }}',
              'receipt_path=${{ steps.receipt.outputs.receipt_path }}',
              'direct_main_write=false',
              'remote_authority_mutation=false',
              'authority_transfer=false',
              'formal_credit_delta=0',
              'engineering_credit_delta=0'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 879,
              body
            });

      - name: Publish rejected/failed bounded-apply pointer
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'MISSIONCONTROL_BOUNDED_APPLY_RECEIPT',
              'status=REJECTED_OR_FAILED',
              'run_id=${{ github.run_id }}',
              'run_attempt=${{ github.run_attempt }}',
              'source_comment_id=${{ github.event.comment.id }}',
              'direct_main_write=false'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 879,
              body
            });

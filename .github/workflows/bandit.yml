# Bandit scan with repository-owned SARIF conversion.
# Scan health is independent from Security-tab publication health.

name: Bandit

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch: {}

jobs:
  bandit:
    permissions:
      contents: read
      security-events: write
      actions: read

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install 'bandit==1.9.4'

      - name: Run Bandit scan as JSON
        run: bandit -r . -f json -o bandit-results.json --exit-zero

      - name: Convert Bandit JSON to SARIF
        id: sarif
        continue-on-error: true
        run: python tools/security/bandit_json_to_sarif.py bandit-results.json results.sarif

      - name: Validate Bandit JSON and optional SARIF
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          with open("bandit-results.json", encoding="utf-8") as handle:
              json.load(handle)
          print("PASS bandit-results.json")

          sarif = Path("results.sarif")
          if sarif.exists():
              with sarif.open(encoding="utf-8") as handle:
                  json.load(handle)
              print("PASS results.sarif")
          else:
              print("SARIF unavailable; raw Bandit JSON remains authoritative.")
          PY

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-results.json
            results.sarif
          if-no-files-found: error

      - name: Publish SARIF to Security tab
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

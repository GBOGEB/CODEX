name: Runtime Pages Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-pages-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute federation bridge
        run: |
          python docs/wave_packages/runtime/federation_bridge_cli.py

      - name: Persist runtime history
        run: |
          python docs/wave_packages/runtime/runtime_history_engine.py

      - name: Generate runtime diff dashboard
        run: |
          python docs/wave_packages/runtime/runtime_diff_engine.py

      - name: Prepare non-authoritative candidate
        run: |
          mkdir -p _site/pages _site/out
          cp -r docs/wave_packages/runtime/pages/* _site/pages/
          cp -r docs/wave_packages/runtime/out/* _site/out/

      - name: Upload candidate artifact without Pages deployment authority
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pages-candidate-${{ github.sha }}
          path: _site

name: CODE PURPLE Branch Protection MIP V2
on:
  pull_request:
    paths:
      - 'scripts/code_purple_ruleset_evidence_v2.py'
      - 'tests/test_code_purple_ruleset_evidence_v2.py'
      - '.github/workflows/code-purple-branch-protection-mip-v2.yml'
      - 'docs/ci/CODE_PURPLE_BRANCH_PROTECTION_MIP_V2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruleset-evidence-v2:
    name: Exact-head mandatory check contract and negative testflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'coverage==7.10.7' 'ruff==0.16.6'
      - run: ruff check scripts/code_purple_ruleset_evidence_v2.py tests/test_code_purple_ruleset_evidence_v2.py --select E4,E7,E9,F
      - name: Run adversarial evidence tests
        run: |
          mkdir -p outputs/protection-mip-v2
          coverage run --branch -m unittest discover -s tests -p test_code_purple_ruleset_evidence_v2.py -v
          coverage json -o outputs/protection-mip-v2/coverage.json
          coverage report --include='scripts/code_purple_ruleset_evidence_v2.py' --fail-under=80
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-purple-ruleset-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: outputs/protection-mip-v2/
          if-no-files-found: warn

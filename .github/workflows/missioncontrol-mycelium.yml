name: MissionControl Mycelium CI

on:
  push:
    branches: [main]
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/data/missioncontrol_*.json'
      - 'MANIFEST/MYCELIUM_KPI_MANIFEST.yaml'
      - 'MIP/mip_lanes.json'
      - 'MIP/mip_surface.json'
      - 'MIP/RUNTIME_HEALTH_ROLLUP_1102.yaml'
      - 'docs/data/mycelium_kpi_measurement.json'
  pull_request:
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/missioncontrol_mycelium.html'
      - 'docs/missioncontrol_status_snapshot.html'
      - 'docs/missioncontrol_recursive_control.html'
      - 'docs/assets/missioncontrol/**'
      - 'docs/data/missioncontrol_*.json'
      - 'MANIFEST/MYCELIUM_KPI_MANIFEST.yaml'
      - 'MIP/mip_lanes.json'
      - 'MIP/mip_surface.json'
      - 'MIP/RUNTIME_HEALTH_ROLLUP_1102.yaml'
      - 'docs/data/mycelium_kpi_measurement.json'
      - 'scripts/*missioncontrol*'
      - 'tests/test_missioncontrol_*'
      - '.github/workflows/missioncontrol-mycelium.yml'
      - '.github/workflows/missioncontrol-authenticated-transport.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema
      - name: "Mycelium N7: standalone continuity testflight"
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install --disable-pip-version-check coverage==7.13.3
          export PYTHONPATH=mission_control/mycelium/continuity
          # N7 scopes the portable continuity modules only. native_bridge.py (N8),
          # admission_timeline.py (N9) and terminal_reconciliation.py (N10) are exercised
          # by their own suites below, with their own stricter coverage gates, and are
          # never imported by test_portable.py.
          python -m coverage run --branch --source=mycelium_continuity \
            --omit='*/mycelium_continuity/native_bridge.py,*/mycelium_continuity/admission_timeline.py,*/mycelium_continuity/terminal_reconciliation.py' \
            -m unittest discover \
            -s mission_control/mycelium/continuity/tests -p "test_portable.py" -v
          python -m coverage json -q -o /tmp/mycelium-n7-coverage.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          c=json.loads(Path('/tmp/mycelium-n7-coverage.json').read_text())['totals']
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if sha != os.environ['EXPECTED_SHA'] or len(sha) != 40:
              raise SystemExit('MYCELIUM_N7_FIRST_RED: exact checkout SHA mismatch')
          statements,branches=int(c['num_statements']),int(c['num_branches'])
          covered_statements,covered_branches=int(c['covered_lines']),int(c['covered_branches'])
          if statements <= 0 or branches <= 0:
              raise SystemExit('MYCELIUM_N7_FIRST_RED: missing statement/branch denominator')
          first_red=[]
          if 100*covered_statements < 90*statements:
              first_red.append('STATEMENTS_BELOW_90_PERCENT')
          if 100*covered_branches < 80*branches:
              first_red.append('BRANCHES_BELOW_80_PERCENT')
          # Compute from counts to avoid rounding a just-below-threshold score green.
          coverage_detail={'statements':[covered_statements,statements],
                           'branches':[covered_branches,branches],
                           'statement_floor_percent':90,
                           'branch_floor_percent':80,
                           'statement_percent':round(100*covered_statements/statements,4),
                           'branch_percent':round(100*covered_branches/branches,4)}
          receipt={'schema':'code-purple.mycelium.native-coverage-receipt.v2',
                   'checkout_sha':sha,'event_sha':os.environ.get('GITHUB_SHA'),
                   'run_id':os.environ.get('GITHUB_RUN_ID'),
                   'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
                   'scope':'MYCELIUM_CONTINUITY_MODULE_ONLY',
                   'statements':c['num_statements'],'covered_statements':c['covered_lines'],
                   'branches':c['num_branches'],'covered_branches':c['covered_branches'],
                   'root_closures':None,'dispatch_authorized':False,
                   'admission':'HOLD','authority_transfer':False}
          receipt['coverage_check']=coverage_detail
          receipt['coverage_gate']='FAIL' if first_red else 'PASS'
          receipt['first_red_class']=first_red
          Path('/tmp/mycelium-n7-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('MYCELIUM_N7_COVERAGE_RECEIPT='+json.dumps(receipt,sort_keys=True),flush=True)
          if first_red:
              print('::error title=MYCELIUM N7 coverage::'+','.join(first_red),flush=True)
              raise SystemExit('MYCELIUM_N7_FIRST_RED: '+','.join(first_red))
          PY
      - name: "MYCELIUM N8: typed native debugger bridge negative-test gate"
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          export PYTHONPATH=mission_control/mycelium/continuity
          python -m coverage run --branch --source=mycelium_continuity.native_bridge \
            -m unittest discover -s mission_control/mycelium/continuity/tests \
            -p "test_native_bridge_public.py" -v
          python -m coverage json -q -o /tmp/mycelium-n8-coverage.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('/tmp/mycelium-n8-coverage.json').read_text())['totals']
          assert c['num_statements']>0 and c['num_branches']>0
          assert c['percent_statements_covered']>=95
          assert c['percent_branches_covered']>=90
          v=json.loads(Path('mission_control/mycelium/continuity/N8_NATIVE_OBSERVATIONS_20261017.json').read_text())
          assert len(v['artifacts'])==2 and v['root_closures'] is None
          assert v['authority_transfer'] is False and v['admission']=='HOLD'
          assert v['code_pr']['native_outcome_at_readback']=='QUEUED'
          o={'schema':'code-purple.mycelium.n8-local-contract-ci.v1',
             'checkout_sha':os.environ['EXPECTED_SHA'],'source_scope':'native_bridge.py',
             'synthetic_test_evidence_only':True,'native_zip_bytes_in_repository':False,
             'statements':c['covered_lines'],'eligible_statements':c['num_statements'],
             'branches':c['covered_branches'],'eligible_branches':c['num_branches'],
             'joined_root_acceptance':None,'admission':'HOLD'}
          Path('/tmp/mycelium-n8-contract-receipt.json').write_text(json.dumps(o,indent=2)+'\n')
          PY
      - name: "MYCELIUM N9: admission chronology and branch-depth proof"
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          export PYTHONPATH=mission_control/mycelium/continuity
          python -m coverage run --branch --source=mycelium_continuity.admission_timeline \
            -m unittest discover -s mission_control/mycelium/continuity/tests \
            -p "test_admission_timeline_public.py" -v
          python -m coverage json -q -o /tmp/mycelium-n9-coverage.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from mycelium_continuity.admission_timeline import project
          root=Path('mission_control/mycelium/continuity')
          source=json.loads((root/'N9_ADMISSION_READBACK_20261017.json').read_text())
          result=project(source)
          cov=json.loads(Path('/tmp/mycelium-n9-coverage.json').read_text())['totals']
          assert result['metrics']['merges_sampled']==4
          assert result['metrics']['nonterminal_at_readback']==2
          assert result['metrics']['observed_failed']==1
          assert result['admission']=='HOLD' and result['metrics']['accepted_root_closures'] is None
          assert cov['num_statements']>0 and cov['num_branches']>0
          assert cov['percent_statements_covered']>=95
          assert cov['percent_branches_covered']>=90
          out={'schema':'code-purple.mycelium.n9-ci-receipt.v1',
               'checkout_sha':os.environ['EXPECTED_SHA'],
               'run_id':os.environ.get('GITHUB_RUN_ID'),
               'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
               'scope':'admission_timeline.py synthetic-contract tests',
               'source_snapshot_sha256':result['source']['snapshot_sha256'],
               'tests_expected':29,'native_artifact_bytes_in_repo':False,
               'admission':'HOLD','effective_required_status':None,'accepted_roots':None}
          Path('/tmp/mycelium-n9-receipt.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: "MYCELIUM N10: terminal reconciliation of the N9 chronology"
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          export PYTHONPATH=mission_control/mycelium/continuity
          python -m coverage run --branch --source=mycelium_continuity.terminal_reconciliation \
            -m unittest discover -s mission_control/mycelium/continuity/tests \
            -p "test_terminal_reconciliation_public.py" -v 2>&1 | tee /tmp/mycelium-n10-unittest.log
          python -m coverage json -q -o /tmp/mycelium-n10-coverage.json
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from mycelium_continuity.graph import sha256
          from mycelium_continuity.terminal_reconciliation import project
          root=Path('mission_control/mycelium/continuity')
          parent=json.loads((root/'N9_ADMISSION_READBACK_20261017.json').read_text())
          source=json.loads((root/'N10_TERMINAL_RECONCILIATION_20261021.json').read_text())
          result=project(source,parent)
          log=Path('/tmp/mycelium-n10-unittest.log').read_text()
          ran=re.search(r'^Ran (\d+) tests? in ',log,re.M)
          # Zero or fewer tests than the contract is a failure, never a pass.
          if not ran or int(ran.group(1))<35 or not re.search(r'^OK$',log,re.M):
              raise SystemExit('MYCELIUM_N10_FIRST_RED: test count or OK status missing')
          cov=json.loads(Path('/tmp/mycelium-n10-coverage.json').read_text())['totals']
          m=result['metrics']
          assert result['source']['parent_snapshot_sha256']==sha256(parent)
          assert m['cases']==4 and m['resolved_since_parent']==2 and m['still_nonterminal']==0
          assert m['red_terminal_resolved_after_merge']==2 and m['terminal_rerun_changed']==0
          assert result['admission']=='HOLD' and m['accepted_root_closures'] is None
          assert cov['num_statements']>0 and cov['num_branches']>0
          # Compare counts, not rounded percentages, so a near-miss cannot round green.
          assert 100*cov['covered_lines']>=95*cov['num_statements']
          assert 100*cov['covered_branches']>=90*cov['num_branches']
          out={'schema':'code-purple.mycelium.n10-ci-receipt.v1',
               'checkout_sha':os.environ['EXPECTED_SHA'],
               'run_id':os.environ.get('GITHUB_RUN_ID'),
               'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
               'scope':'terminal_reconciliation.py synthetic-contract tests',
               'tests_ran':int(ran.group(1)),
               'source_snapshot_sha256':result['source']['snapshot_sha256'],
               'parent_snapshot_sha256':result['source']['parent_snapshot_sha256'],
               'transitions':result['transitions'],
               'statements':[cov['covered_lines'],cov['num_statements']],
               'branches':[cov['covered_branches'],cov['num_branches']],
               'native_artifact_bytes_in_repo':False,
               'admission':'HOLD','effective_required_status':None,'accepted_roots':None}
          Path('/tmp/mycelium-n10-receipt.json').write_text(json.dumps(out,indent=2)+'\n')
          print('MYCELIUM_N10_RECEIPT='+json.dumps(out,sort_keys=True),flush=True)
          PY
      - name: "MYCELIUM N10: upload terminal reconciliation proof"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mycelium-n10-reconciliation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/mycelium-n10-coverage.json
            /tmp/mycelium-n10-receipt.json
          if-no-files-found: warn
      - name: "MYCELIUM N9: upload read-only admission proof"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mycelium-n9-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/mycelium-n9-coverage.json
            /tmp/mycelium-n9-receipt.json
          if-no-files-found: warn
      - name: "MYCELIUM N8: publish source-bound contract evidence"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mycelium-n8-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/mycelium-n8-coverage.json
            /tmp/mycelium-n8-contract-receipt.json
          if-no-files-found: warn
      - name: "Mycelium N7: upload source-bound scoped coverage"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mycelium-continuity-n7-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/mycelium-n7-coverage.json
            /tmp/mycelium-n7-receipt.json
          if-no-files-found: warn
      - name: Analyze governed logs
        run: python scripts/analyze_missioncontrol_logs.py
      - name: Build metrics materialization
        run: python scripts/build_missioncontrol_metrics.py
      - name: Build REX badge projection
        run: |
          python scripts/build_missioncontrol_rex_badges.py
          git diff --exit-code -- mission_control/mycelium/rex_badges.json docs/data/missioncontrol_rex_badges.json || {
            echo "::error::REX badge projection drift. Run \`python scripts/build_missioncontrol_rex_badges.py\` and commit both JSON files."
            exit 1
          }
      - name: Validate Mycelium contract
        run: python scripts/validate_missioncontrol_mycelium.py
      - name: Validate executable integration and value
        run: python scripts/validate_executable_integration_value.py
      - name: Consume executable integration value report
        run: python scripts/consume_executable_value_report.py
      - name: Classify executable registration debt
        run: python scripts/classify_executable_registration_debt.py
      - name: Measure Mycelium/MIP KPIs
        run: python scripts/measure_mycelium_kpis.py
      - name: Project recursive control horizons (RCH-04, read-only)
        run: python scripts/project_recursive_control.py
      - name: Validate authenticated execution gateway design
        run: python scripts/validate_missioncontrol_execution_gateway.py
      - name: Validate GMI-DOCENG hosted materialization
        run: |
          python scripts/gmi_doceng_bridge_guard.py             evidence/gmi_doceng_001/GMI-DOCENG-001             --receipt /tmp/gmi_doceng_bridge_guard_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/gmi_doceng_bridge_guard_receipt.json").read_text())
          assert receipt["disposition"] == "ACCEPT_DOCUMENT_CORE_PROVIDER_PROOF_BOUND"
          assert receipt["cli_hash_match"] is True
          assert receipt["source_binding_valid"] is True
          assert receipt["document_core_receipt_valid"] is True
          PY
      - name: Upload generated executable-value receipts for exact-head reconciliation
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: missioncontrol-generated-value-receipts
          path: |
            mission_control/mycelium/executable_value_report.json
            docs/data/missioncontrol_executable_value_report.json
            mission_control/mycelium/executable_value_control_observation.json
          if-no-files-found: error
      - name: Preflight generated-value parity before expensive tests
        run: |
          git diff --exit-code -- \
            mission_control/mycelium/executable_value_report.json \
            docs/data/missioncontrol_executable_value_report.json \
            mission_control/mycelium/executable_value_control_observation.json || {
              echo "::error::First red: generated executable inventory drift. Run \`python scripts/regen_missioncontrol_inventory.py\` and commit the refreshed receipts (same-repo PR branches are refreshed automatically by missioncontrol-inventory-autoregen.yml, main after merge by missioncontrol-inventory-reconcile.yml)."
              exit 1
            }
      - name: Run MissionControl tests
        run: pytest -q tests/test_missioncontrol_mycelium.py tests/test_missioncontrol_metrics.py tests/test_missioncontrol_logs.py tests/test_missioncontrol_source_ingestion.py tests/test_missioncontrol_execution_gateway.py tests/test_missioncontrol_authenticated_transport.py tests/test_missioncontrol_status_snapshot.py tests/test_executable_integration_value.py tests/test_missioncontrol_value_rex_contract.py tests/test_missioncontrol_rex_badges.py tests/test_classify_executable_registration_debt.py tests/test_mycelium_kpi_manifest.py tests/test_regen_missioncontrol_inventory.py tests/test_project_recursive_control.py tests/test_missioncontrol_recursive_control_page.py
      - name: Verify deterministic materializations
        run: |
          git ls-files --error-unmatch mission_control/mycelium/executable_value_report.json
          git ls-files --error-unmatch docs/data/missioncontrol_executable_value_report.json
          git ls-files --error-unmatch mission_control/mycelium/executable_value_control_observation.json
          cp mission_control/mycelium/registration_debt_classification.json /tmp/registration_debt_classification.first.json
          python scripts/classify_executable_registration_debt.py
          cmp /tmp/registration_debt_classification.first.json mission_control/mycelium/registration_debt_classification.json
          python scripts/measure_mycelium_kpis.py --check
          python scripts/project_recursive_control.py --check
          git diff --exit-code -- mission_control/mycelium/metrics_snapshot.json docs/data/missioncontrol_metrics.json mission_control/mycelium/log_analysis.json docs/data/missioncontrol_log_analysis.json mission_control/mycelium/executable_value_report.json docs/data/missioncontrol_executable_value_report.json mission_control/mycelium/executable_value_control_observation.json docs/data/mycelium_kpi_measurement.json mission_control/mycelium/recursive_control_projection.json docs/data/missioncontrol_recursive_control_projection.json
      - name: Upload registration debt classification
        uses: actions/upload-artifact@v7
        with:
          name: missioncontrol-registration-debt-classification
          path: mission_control/mycelium/registration_debt_classification.json

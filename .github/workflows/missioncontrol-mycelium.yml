name: MissionControl Mycelium CI

on:
  push:
    branches: [main]
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/data/missioncontrol_*.json'
  pull_request:
    paths:
      - 'mission_control/mycelium/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docs/missioncontrol_mycelium.html'
      - 'docs/missioncontrol_status_snapshot.html'
      - 'docs/assets/missioncontrol/**'
      - 'docs/data/missioncontrol_*.json'
      - 'scripts/*missioncontrol*'
      - 'tests/test_missioncontrol_*'
      - '.github/workflows/missioncontrol-mycelium.yml'
      - '.github/workflows/missioncontrol-authenticated-transport.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyyaml numpy jsonschema
      - name: Analyze governed logs
        run: python scripts/analyze_missioncontrol_logs.py
      - name: Build metrics materialization
        run: python scripts/build_missioncontrol_metrics.py
      - name: Validate Mycelium contract
        run: python scripts/validate_missioncontrol_mycelium.py
      - name: Validate executable integration and value
        run: python scripts/validate_executable_integration_value.py
      - name: Consume executable integration value report
        run: python scripts/consume_executable_value_report.py
      - name: Classify executable registration debt
        run: python scripts/classify_executable_registration_debt.py
      - name: Validate authenticated execution gateway design
        run: python scripts/validate_missioncontrol_execution_gateway.py
      - name: Validate GMI-DOCENG hosted materialization
        run: |
          python scripts/gmi_doceng_bridge_guard.py             evidence/gmi_doceng_001/GMI-DOCENG-001             --receipt /tmp/gmi_doceng_bridge_guard_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/gmi_doceng_bridge_guard_receipt.json").read_text())
          assert receipt["disposition"] == "ACCEPT_DOCUMENT_CORE_PROVIDER_PROOF_BOUND"
          assert receipt["cli_hash_match"] is True
          assert receipt["source_binding_valid"] is True
          assert receipt["document_core_receipt_valid"] is True
          PY
      - name: Run MissionControl tests
        run: pytest -q tests/test_missioncontrol_mycelium.py tests/test_missioncontrol_metrics.py tests/test_missioncontrol_logs.py tests/test_missioncontrol_source_ingestion.py tests/test_missioncontrol_execution_gateway.py tests/test_missioncontrol_authenticated_transport.py tests/test_missioncontrol_status_snapshot.py tests/test_executable_integration_value.py tests/test_missioncontrol_value_rex_contract.py tests/test_classify_executable_registration_debt.py
      - name: Verify deterministic materializations
        run: |
          git ls-files --error-unmatch mission_control/mycelium/executable_value_report.json
          git ls-files --error-unmatch docs/data/missioncontrol_executable_value_report.json
          git ls-files --error-unmatch mission_control/mycelium/executable_value_control_observation.json
          cp mission_control/mycelium/registration_debt_classification.json /tmp/registration_debt_classification.first.json
          python scripts/classify_executable_registration_debt.py
          cmp /tmp/registration_debt_classification.first.json mission_control/mycelium/registration_debt_classification.json
          git diff --exit-code -- mission_control/mycelium/metrics_snapshot.json docs/data/missioncontrol_metrics.json mission_control/mycelium/log_analysis.json docs/data/missioncontrol_log_analysis.json mission_control/mycelium/executable_value_report.json docs/data/missioncontrol_executable_value_report.json mission_control/mycelium/executable_value_control_observation.json
      - name: Upload registration debt classification
        uses: actions/upload-artifact@v4
        with:
          name: missioncontrol-registration-debt-classification
          path: mission_control/mycelium/registration_debt_classification.json

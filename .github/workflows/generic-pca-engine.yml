name: Generic PCA Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'pca_engine/**'
      - 'AGENTS.md'
      - 'CODEX_PR_PCA_ENGINE.md'
      - '.github/workflows/generic-pca-engine.yml'
  push:
    branches:
      - feature/generic-pca-nlpca-engine
    paths:
      - 'pca_engine/**'
      - 'AGENTS.md'
      - 'CODEX_PR_PCA_ENGINE.md'
      - '.github/workflows/generic-pca-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pca_engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest
      - name: Generic CSV CLI smoke
        shell: bash
        run: |
          cat > /tmp/pca_generic.csv <<'CSV'
          a,b,c
          1,2,1.1
          2,4,2.2
          3,6,2.9
          4,8,4.1
          5,10,5.2
          CSV
          pca-engine run /tmp/pca_generic.csv --target-dir /tmp/pca-out --n-components 2
          test -f /tmp/pca-out/summary.json
          test -f /tmp/pca-out/report.md

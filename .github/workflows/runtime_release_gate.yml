name: Runtime Release Gate

on:
  push:
    branches: [main]
    paths: &runtime_paths
      - 'federation_runtime/**'
      - 'docs/wave_packages/runtime/**'
      - 'docs/rtm/**'
      - 'governance/**'
      - 'scripts/bridge_rtm_ingress.py'
      - 'scripts/emit_runtime_status.py'
      - 'scripts/check_manifest.py'
      - 'scripts/check_globs.py'
      - 'scripts/check_stale.py'
      - 'scripts/check_links.py'
      - 'scripts/validate_dmaic_phase_map.py'
      - 'scripts/emit_governance_snapshot.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/runtime_release_gate.yml'
  pull_request:
    paths: *runtime_paths
  workflow_dispatch:

concurrency:
  group: runtime-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  rtm-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
      - run: python scripts/bridge_rtm_ingress.py --json-out reports/rtm_summary.json
      - run: test -f reports/rtm_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: rtm-artifacts
          path: |
            docs/rtm/incubator_rtm_bridge.md
            reports/rtm_summary.json

  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rtm-generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: rtm-artifacts}
      - run: python docs/wave_packages/runtime/federation_bridge_cli.py --stop-on-failure
      - run: python docs/wave_packages/runtime/reality_tracker.py
      - run: python scripts/emit_runtime_status.py --out reports/runtime_status.json
      - run: |
          test -f docs/wave_packages/runtime/out/deployment_readiness.json
          test -f docs/wave_packages/runtime/out/reality_tracker.json
          test -f reports/runtime_status.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-artifacts
          path: |
            reports/rtm_summary.json
            reports/runtime_status.json
            docs/wave_packages/runtime/out/deployment_readiness.json
            docs/wave_packages/runtime/out/reality_tracker.json
            docs/wave_packages/runtime/out/federation_bridge_build_report.json
            docs/wave_packages/runtime/pages/plotly_runtime_dashboard.html

  governance-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: runtime-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: runtime-evidence-artifacts}
      - id: manifest
        run: python scripts/check_manifest.py
      - id: globs
        run: python scripts/check_globs.py
      - id: stale
        run: python scripts/check_stale.py
      - id: links
        run: python scripts/check_links.py
      - id: render_linter
        run: python governance/RENDER_LINTER.py
      - id: dmaic_phase_map
        run: python scripts/validate_dmaic_phase_map.py --report-json reports/dmaic_phase_report.json
      - if: always()
        run: |
          python scripts/emit_governance_snapshot.py \
            --check manifest=${{ steps.manifest.outcome }} \
            --check globs=${{ steps.globs.outcome }} \
            --check stale=${{ steps.stale.outcome }} \
            --check links=${{ steps.links.outcome }} \
            --check render_linter=${{ steps.render_linter.outcome }} \
            --check dmaic_phase_map=${{ steps.dmaic_phase_map.outcome }} \
            --out reports/governance_snapshot.json
      - run: |
          test -f reports/governance_snapshot.json
          test -f reports/dmaic_phase_report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-artifacts
          path: |
            reports/governance_snapshot.json
            reports/dmaic_phase_report.json

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: governance-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-evidence-artifacts
          path: .release/runtime
      - uses: actions/download-artifact@v4
        with:
          name: governance-artifacts
          path: .release/governance
      - name: Verify downloaded release evidence
        run: |
          test -f .release/runtime/reports/runtime_status.json
          test -f .release/runtime/reports/rtm_summary.json
          test -f .release/runtime/docs/wave_packages/runtime/out/deployment_readiness.json
          test -f .release/runtime/docs/wave_packages/runtime/out/reality_tracker.json
          test -f .release/governance/reports/governance_snapshot.json
          test -f .release/governance/reports/dmaic_phase_report.json
      - name: Enforce deployment threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          deploy=json.loads(Path('.release/runtime/docs/wave_packages/runtime/out/deployment_readiness.json').read_text())
          reality=json.loads(Path('.release/runtime/docs/wave_packages/runtime/out/reality_tracker.json').read_text())
          if deploy['completion_percent'] < 90: raise SystemExit('Deployment readiness below release threshold')
          if reality['average_actual'] < 50: raise SystemExit('Reality alignment below release threshold')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: .release/

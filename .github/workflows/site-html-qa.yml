name: Site HTML QA

# Loads every published page (MANIFEST.json published_pages) in Chromium at
# desktop and phone width over a local HTTP server and fails only on ERROR
# findings that are not in reports/html_qa/baseline.json (no new debt).

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'MANIFEST.json'
      - 'tools/qa/**'
      - 'reports/html_qa/**'
      - '.github/workflows/site-html-qa.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'MANIFEST.json'
      - 'tools/qa/**'
      - 'reports/html_qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned browser runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser QA of all published pages
        run: python tools/qa/html_qa.py --check --report reports/html_qa/latest.json
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("reports/html_qa/latest.json")
          if not p.exists():
              print("## Site HTML QA\n\nNo report produced.")
              raise SystemExit
          r = json.loads(p.read_text())
          s = r["summary"]
          print(f"## Site HTML QA\n\n{s['pages']} pages, {s['pages_without_errors']} without ERROR findings.\n")
          print("| Finding | Count |\n|---|---|")
          for k, v in s["finding_counts"].items():
              print(f"| {k} | {v} |")
          if r["new_errors"]:
              print("\n### New errors (not in baseline)\n")
              for page, keys in r["new_errors"].items():
                  for k in keys:
                      print(f"- `docs/{page}`: {k}")
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-html-qa-report
          path: reports/html_qa/latest.json
          if-no-files-found: warn

name: CODE PURPLE REX Control
on:
  pull_request:
    branches: [main]
    paths:
      - federation/rex/returns/ABACUS_CODE_PURPLE_20261012_REX_RETURN.yaml
      - scripts/code_purple_rex_rollup.py
      - tests/test_code_purple_rex_rollup.py
      - docs/code_purple_rex_control.html
      - mission_control/mycelium/rex_observability_contract.yaml
      - .github/workflows/code-purple-rex-control.yml
  push:
    branches: [main]
    paths:
      - federation/rex/returns/ABACUS_CODE_PURPLE_20261012_REX_RETURN.yaml
      - scripts/code_purple_rex_rollup.py
      - tests/test_code_purple_rex_rollup.py
      - .github/workflows/code-purple-rex-control.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-purple-rex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rex-proof:
    name: Validate candidate return and KPI projection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact observed source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source SHA is current
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install "PyYAML>=6,<7"

      - name: Test candidate admission guards and metric semantics
        run: python -m unittest discover -s tests -p test_code_purple_rex_rollup.py -v

      - name: Generate and verify deterministic TOP7/14/21 evidence
        run: |
          python scripts/code_purple_rex_rollup.py
          python scripts/code_purple_rex_rollup.py --check

      - name: Publish read-only proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-purple-rex-candidate-${{ github.sha }}
          path: docs/data/code_purple_rex_rollup.json
          if-no-files-found: error
          retention-days: 30

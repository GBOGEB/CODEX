name: CODE PURPLE REX Control
on:
  pull_request:
    branches: [main]
    paths:
      - federation/rex/returns/ABACUS_CODE_PURPLE_20261012_REX_RETURN.yaml
      - scripts/code_purple_rex_rollup.py
      - scripts/code_purple_current_observation.py
      - tests/test_code_purple_current_observation.py
      - .github/workflows/pages.yml
      - tests/test_code_purple_rex_rollup.py
      - docs/code_purple_rex_control.html
      - docs/code_purple_convergence.html
      - docs/diagrams/code_purple_convergence.mmd
      - tests/test_code_purple_convergence_accessibility.py
      - mission_control/mycelium/rex_observability_contract.yaml
      - .github/workflows/code-purple-rex-control.yml
  push:
    branches: [main]
    paths:
      - federation/rex/returns/ABACUS_CODE_PURPLE_20261012_REX_RETURN.yaml
      - scripts/code_purple_rex_rollup.py
      - scripts/code_purple_current_observation.py
      - tests/test_code_purple_current_observation.py
      - .github/workflows/pages.yml
      - tests/test_code_purple_rex_rollup.py
      - docs/code_purple_rex_control.html
      - docs/code_purple_convergence.html
      - docs/diagrams/code_purple_convergence.mmd
      - tests/test_code_purple_convergence_accessibility.py
      - .github/workflows/code-purple-rex-control.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-purple-rex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rex-proof:
    name: Validate candidate return and KPI projection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact observed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source SHA is current
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install "PyYAML>=6,<7" "ruff==0.16.6"

      - name: Check changed Python without suppressing new Ruff debt
        run: ruff check scripts/code_purple_rex_rollup.py tests/test_code_purple_rex_rollup.py scripts/code_purple_current_observation.py tests/test_code_purple_current_observation.py tests/test_code_purple_convergence_accessibility.py

      - name: Test candidate admission guards and metric semantics
        run: |
          python -m unittest discover -s tests -p test_code_purple_rex_rollup.py -v
          python -m unittest discover -s tests -p test_code_purple_current_observation.py -v

      - name: Verify convergence map AA contrast, sticky navigation and source linkage
        run: python -m unittest discover -s tests -p test_code_purple_convergence_accessibility.py -v

      - name: Generate and verify deterministic TOP7/14/21 evidence
        run: |
          python scripts/code_purple_rex_rollup.py
          python scripts/code_purple_rex_rollup.py --check

      - name: Execute live ABACUS read-only source census
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/code_purple_current_observation.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/data/code_purple_current_observation.json")
          snapshot = json.loads(path.read_text(encoding="utf-8"))
          assert snapshot["schema"] == "code-purple.current-observation/1.0"
          assert snapshot["source"]["main_sha"]
          assert snapshot["historical_cohort_current_disposition"]["denominator"] == 20
          assert snapshot["admission"]["authority_transfer"] is False
          assert snapshot["unmeasured"]["bd_queue_open"] is None
          print("ABACUS live read-only snapshot:", snapshot["source"]["main_sha"])
          PY

      - name: Publish read-only proof artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-purple-rex-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/data/code_purple_rex_rollup.json
            docs/data/code_purple_current_observation.json
          if-no-files-found: error
          retention-days: 30

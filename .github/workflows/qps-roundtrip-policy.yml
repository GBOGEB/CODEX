name: QPS roundtrip policy

on:
  pull_request:
    paths:
      - '07_ops/qps_roundtrip/**'
      - '.github/workflows/qps-roundtrip-policy.yml'
  push:
    branches:
      - main
    paths:
      - '07_ops/qps_roundtrip/**'
      - '.github/workflows/qps-roundtrip-policy.yml'

permissions:
  contents: read

jobs:
  policy-and-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate controlled-path binary policy
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch origin '${{ github.base_ref }}' --depth=1
            $files = @(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          } else {
            $files = @(git show --pretty='' --name-only HEAD)
          }
          & ./07_ops/qps_roundtrip/Test-QpsTextOnlyPolicy.ps1 -RepositoryPath . -FileList $files

      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ./07_ops/qps_roundtrip -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Install semantic extractor dependency
        shell: pwsh
        run: python -m pip install defusedxml

      - name: Compile Python roundtrip tools
        shell: pwsh
        run: |
          python -m py_compile ./07_ops/qps_roundtrip/Get-QpsSemanticManifest.py
          python -m py_compile ./07_ops/qps_roundtrip/Compare-QpsSemanticManifests.py

      - name: Validate BUILD_META template JSON
        shell: pwsh
        run: |
          Get-Content ./07_ops/qps_roundtrip/BUILD_META.template.json -Raw | ConvertFrom-Json | Out-Null

      - name: Synthetic semantic manifest smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qps-semantic-smoke'
          New-Item -ItemType Directory -Force $root | Out-Null
          $html = Join-Path $root 'index.html'
          Set-Content -LiteralPath $html -Encoding utf8 -Value '<!doctype html><html><body><section id="summary"><h1>QPS Summary</h1><a href="local.css">style</a><script type="application/json">{"value":1}</script></section></body></html>'
          $left = Join-Path $root 'semantic-left.json'
          $right = Join-Path $root 'semantic-right.json'
          python ./07_ops/qps_roundtrip/Get-QpsSemanticManifest.py $html -o $left
          Copy-Item -LiteralPath $left -Destination $right
          $manifest = Get-Content $left -Raw | ConvertFrom-Json
          if ($manifest.kind -ne 'html') { throw 'Unexpected semantic kind.' }
          if ($manifest.heading_sequence[0] -ne 'QPS Summary') { throw 'Heading extraction failed.' }
          if (-not $manifest.semantic_sha256) { throw 'Semantic SHA-256 missing.' }

          $comparison = Join-Path $root 'semantic-comparison.json'
          python ./07_ops/qps_roundtrip/Compare-QpsSemanticManifests.py $left $right --output $comparison
          $receipt = Get-Content $comparison -Raw | ConvertFrom-Json
          if (-not $receipt.semantic_match) { throw 'Identical semantic manifests did not compare equal.' }

      - name: Synthetic evidence-registry verification smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qps-evidence-smoke'
          $vault = Join-Path $root 'vault'
          New-Item -ItemType Directory -Force (Join-Path $vault 'Offers') | Out-Null
          $evidenceFile = Join-Path $vault 'Offers/example.txt'
          Set-Content -LiteralPath $evidenceFile -Value 'verified-evidence' -NoNewline
          $hash = (Get-FileHash -LiteralPath $evidenceFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $registry = Join-Path $root 'evidence_registry.yaml'
          @"
          schema_version: 1
          control_id: GOV-001
          registry_status: PARTIAL_VERIFIED
          build_blocking: true
          evidence:
            - id: TEST_EVIDENCE
              required: true
              expected_filename: example.txt
              relative_path: Offers/example.txt
              sha256: $hash
              size_bytes: null
              verification_status: HASH_VERIFIED_SIZE_PENDING
          "@ | Set-Content -LiteralPath $registry -Encoding utf8
          $receiptPath = Join-Path $root 'EVIDENCE_VERIFICATION_RECEIPT.json'
          $verifiedRegistry = Join-Path $root 'evidence_registry.verified.yaml'
          $result = & ./07_ops/qps_roundtrip/Test-QpsEvidenceRegistry.ps1 `
            -RegistryPath $registry `
            -EvidenceRoot $vault `
            -ReceiptPath $receiptPath `
            -VerifiedRegistryOutput $verifiedRegistry | ConvertFrom-Json
          if ($result.result -ne 'PASS') { throw 'Synthetic evidence verification did not pass.' }
          if (-not (Select-String -LiteralPath $verifiedRegistry -Pattern '^registry_status: VERIFIED$' -Quiet)) { throw 'Verified registry was not promoted.' }
          if (-not (Select-String -LiteralPath $verifiedRegistry -Pattern '^\s+verification_status: VERIFIED$' -Quiet)) { throw 'Evidence record was not promoted.' }

      - name: Tracked binary inventory smoke test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'qps-binary-inventory.json'
          $result = & ./07_ops/qps_roundtrip/Get-QpsLegacyBinaryInventory.ps1 -RepositoryPath . -OutputPath $out | ConvertFrom-Json
          if (-not (Test-Path $out)) { throw 'Binary inventory was not created.' }
          if ($result.policy_violations -ne 0) { throw 'Controlled QPS path contains tracked binaries.' }
          Write-Host "Tracked legacy binaries: $($result.tracked_binary_count)"
          Write-Host "Regenerate/migrate candidates: $($result.regenerate_or_migrate)"

      - name: Synthetic manifest smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qps-manifest-smoke'
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Content -Path (Join-Path $root 'a.txt') -Value 'alpha' -NoNewline
          New-Item -ItemType Directory -Force (Join-Path $root 'nested') | Out-Null
          Set-Content -Path (Join-Path $root 'nested/b.txt') -Value 'beta' -NoNewline
          & ./07_ops/qps_roundtrip/Get-QpsRecursiveManifest.ps1 -Root $root | Write-Host
          if (-not (Test-Path (Join-Path $root 'MANIFEST.sha256'))) { throw 'Manifest was not created.' }
          $lines = @(Get-Content (Join-Path $root 'MANIFEST.sha256') | Where-Object { $_ -notmatch '^#' -and $_.Trim() })
          if ($lines.Count -ne 2) { throw "Expected 2 manifest records, got $($lines.Count)." }

      - name: Synthetic immutable publication and receipt smoke test
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'qps-dist-smoke'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'qps-release-root'
          New-Item -ItemType Directory -Force $dist | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $dist 'nested') | Out-Null
          Set-Content -Path (Join-Path $dist 'BUILD_META.json') -Value '{"qa":{"status":"PASS"}}' -NoNewline
          Set-Content -Path (Join-Path $dist 'RELEASE_NOTES.md') -Value '# synthetic release' -NoNewline
          Set-Content -Path (Join-Path $dist 'QA_REPORT.md') -Value '# PASS' -NoNewline
          Set-Content -Path (Join-Path $dist 'nested/model.txt') -Value 'semantic-model' -NoNewline
          New-Item -ItemType Directory -Force $releaseRoot | Out-Null

          $result = & ./07_ops/qps_roundtrip/Publish-QpsRelease.ps1 `
            -SourceDist $dist `
            -ReleaseId 'synthetic-v1' `
            -ReleaseRoot $releaseRoot `
            -CreateOfficeReviewCopy | ConvertFrom-Json

          if ($result.result -ne 'PASS') { throw 'Synthetic publication did not return PASS.' }
          $published = Join-Path $releaseRoot 'synthetic-v1'
          if (-not (Test-Path (Join-Path $published 'nested/model.txt'))) { throw 'Nested release content was not copied.' }
          if (-not (Test-Path (Join-Path $published 'MANIFEST.sha256'))) { throw 'Published manifest is missing.' }

          $releaseReceiptPath = Join-Path $env:RUNNER_TEMP 'RELEASE_RECEIPT.json'
          $releaseReceipt = & ./07_ops/qps_roundtrip/New-QpsReleaseReceipt.ps1 `
            -ReleaseDirectory $published `
            -ReleaseId 'synthetic-v1' `
            -SourceCommit '${{ github.sha }}' `
            -ReceiptPath $releaseReceiptPath | ConvertFrom-Json
          if ($releaseReceipt.result -ne 'PASS') { throw 'Synthetic release receipt did not pass.' }
          if (-not $releaseReceipt.manifest_sha256) { throw 'Release receipt manifest hash is missing.' }

          $costRoot = Split-Path -Parent $releaseRoot
          $review = Join-Path (Join-Path $costRoot '20_WORKING_REVIEW') 'synthetic-v1'
          if (-not (Test-Path (Join-Path $review 'nested/model.txt'))) { throw 'Office review copy was not created.' }

          $duplicateFailed = $false
          try {
            & ./07_ops/qps_roundtrip/Publish-QpsRelease.ps1 -SourceDist $dist -ReleaseId 'synthetic-v1' -ReleaseRoot $releaseRoot | Out-Null
          } catch {
            $duplicateFailed = $true
          }
          if (-not $duplicateFailed) { throw 'Publisher did not protect the immutable release ID.' }

      - name: Synthetic full controlled roundtrip smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qps-full-roundtrip'
          $vault = Join-Path $root 'vault'
          $workspace = Join-Path $root 'workspace'
          $releaseRoot = Join-Path $root 'releases'
          $repoRoot = Join-Path $root 'repos'
          New-Item -ItemType Directory -Force (Join-Path $vault 'Offers') | Out-Null
          New-Item -ItemType Directory -Force $releaseRoot, $repoRoot | Out-Null

          $repoSpecs = @(
            @{ Name = 'ABACUS'; Url = 'https://github.com/GBOGEB/ABACUS.git' },
            @{ Name = 'CODEX'; Url = 'https://github.com/GBOGEB/CODEX.git' },
            @{ Name = 'cryoplant-project'; Url = 'https://github.com/GBOGEB/cryoplant-project.git' },
            @{ Name = 'DOCX_RTM_Automation'; Url = 'https://github.com/GBOGEB/DOCX_RTM_Automation.git' }
          )
          foreach ($spec in $repoSpecs) {
            $repoPath = Join-Path $repoRoot $spec.Name
            New-Item -ItemType Directory -Force $repoPath | Out-Null
            git -C $repoPath init -b main
            git -C $repoPath config user.email 'qps-ci@example.invalid'
            git -C $repoPath config user.name 'QPS Synthetic CI'
            Set-Content -LiteralPath (Join-Path $repoPath '.qps-synthetic') -Value $spec.Name -NoNewline
            if ($spec.Name -eq 'CODEX') {
              $toolDir = Join-Path $repoPath '07_ops/qps_roundtrip'
              New-Item -ItemType Directory -Force $toolDir | Out-Null
              Copy-Item `
                -LiteralPath './07_ops/qps_roundtrip/Initialize-QpsWorkspace.ps1' `
                -Destination (Join-Path $toolDir 'Initialize-QpsWorkspace.ps1')
            }
            git -C $repoPath add .
            git -C $repoPath commit -m 'synthetic baseline'
            git -C $repoPath remote add origin $spec.Url
            $head = (git -C $repoPath rev-parse HEAD).Trim()
            git -C $repoPath update-ref refs/remotes/origin/main $head
            git -C $repoPath branch --set-upstream-to=origin/main main
          }

          $evidenceFile = Join-Path $vault 'Offers/example.txt'
          Set-Content -LiteralPath $evidenceFile -Value 'verified-evidence' -NoNewline
          $hash = (Get-FileHash -LiteralPath $evidenceFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $registry = Join-Path $root 'evidence_registry.yaml'
          @"
          schema_version: 1
          control_id: GOV-001
          registry_status: PARTIAL_VERIFIED
          build_blocking: true
          evidence:
            - id: TEST_EVIDENCE
              required: true
              expected_filename: example.txt
              relative_path: Offers/example.txt
              sha256: $hash
              size_bytes: null
              verification_status: HASH_VERIFIED_SIZE_PENDING
          "@ | Set-Content -LiteralPath $registry -Encoding utf8

          $builder = Join-Path $env:GITHUB_WORKSPACE '07_ops/qps_roundtrip/tests/Synthetic-QpsBuilder.ps1'
          $result = & ./07_ops/qps_roundtrip/Invoke-QpsControlledRoundtrip.ps1 `
            -RepoRoot $repoRoot `
            -WorkspaceRoot $workspace `
            -EvidenceRoot $vault `
            -ReleaseRoot $releaseRoot `
            -ReleaseId 'synthetic-roundtrip-v1' `
            -BuilderScript $builder `
            -RegistryPath $registry `
            -SkipRepositoryUpdate | ConvertFrom-Json

          if ($result.result -ne 'PASS') { throw 'Full controlled roundtrip did not return PASS.' }
          if (-not $result.all_semantic_comparisons_pass) { throw 'Build A/B semantic comparison did not pass.' }
          if ($result.semantic_comparison_count -ne 4) { throw "Expected four semantic comparisons, got $($result.semantic_comparison_count)." }

challenge_contract:
  - id: KEB-QT-001
    name: method_semantic_reuse
    expected: >-
      Candidate method descriptions must be compatible with existing controller
      semantics and must not redefine 3PR, MIP, 3PC or 3P3 into new authorities.
  - id: KEB-QT-002
    name: state_class_separation
    expected: >-
      QPS child engineering, tooling triage, reliability model and mission
      execution are separately typed. Shared human words such as ACCEPT or
      ACTIVE do not imply cross-class promotion.
  - id: KEB-QT-003
    name: exact_source_lineage
    expected: >-
      SOURCE_BOUND reliability atoms preserve an exact child source locator and
      identity through the analytical consumer. Scenario and user override
      inputs remain visibly distinct.
  - id: KEB-QT-004
    name: component_system_anti_overclaim
    expected: >-
      Component MTBF or lambda cannot become system-event MTBF, Table-10 rate,
      N+1 proof or accepted consequence without child architecture, recovery,
      common-cause and consequence re-entry.
  - id: KEB-QT-005
    name: mission_control_non_authority
    expected: >-
      Mission Control may plan, route, measure, compare and recommend with
      authority_transfer=false; it cannot mutate child engineering disposition.
  - id: KEB-QT-006
    name: pca_bt_non_authority
    expected: >-
      PCA, BT, reverse pressure and PB remain diagnostics or scheduler signals
      and cannot create engineering, compliance, negotiation, acceptance or
      release credit.
  - id: KEB-QT-007
    name: first_blocker_recursion
    expected: >-
      3PR refreshes state, MIP runs only for an observed gap, 3PC is bounded and
      transactional, and 3P3 runs once only when local DoV is satisfied but
      reusable propagation proof remains missing.


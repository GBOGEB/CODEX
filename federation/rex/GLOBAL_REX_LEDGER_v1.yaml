      impacted_repo_count: 1
      impacted_workflow_count: 1
      measurement_window: W112
    recurrence: UNIQUE
    symptom: semantic runtime rejected undocumented token semantic_readiness
    root_cause: new governed semantic token introduced outside the declared glossary surface
    action_moniker: SEM
    repair_method: >-
      Register semantic_readiness in a controlled glossary extension and teach
      the semantic validator to consume controlled extensions without weakening
      the no-new-debt gate.
    verification:
      repo: GBOGEB/CODEX
      head_sha: 537cd69aebbd9b75a39266723ad6c0fcfd1ba74e
      semantic_runtime_run_id: 34577942657
      result: PASS
    control_guard:

  - rex_id: REX-W112-001
    signature: NAMESPACE.ACTION_STATUS.COLLISION
    issue_kind: DEFECT
    family: NAMESPACE
    repo:
      primary: GBOGEB/CODEX
      impacted:
        - GBOGEB/CODEX
        - GBOGEB/ABACUS
        - GBOGEB/cryoplant-project
    first_seen: W112_3PC
    last_seen: W112_ACTIVE_DOCK_SWEEP
    severity_stars: 5
    frequency:
      observed_count: 13
      unit: colliding_short_tokens
      impacted_repo_count: 3
      impacted_workflow_count: 0
      measurement_window: W112
    recurrence: SYSTEMIC
    symptom: >-
      W111 task/action aliases reused all thirteen W108 scheduler status keys
      with unrelated meanings, making routing ambiguous.
    root_cause: namespace reuse without role/lifecycle/consumer 3PC challenge
    action_moniker: SEM
    repair_method: >-
      Reserve W108 two-letter keys for status and replace actions with verb
      monikers CLOSE/RED/RUNTIME/SEM/SSOT/RECEIPT/ENABLE/HARDEN/CLEAN/MAINT/READ/EXP/WATCH.
    verification:
      repo: GBOGEB/CODEX
      head_sha: 537cd69aebbd9b75a39266723ad6c0fcfd1ba74e
      ci_run_id: 34577942623
      result: PASS
    control_guard:
      - tests/test_glob_lookup.py namespace-disjointness assertion
      - GLOB.yaml separate status_namespace and action_namespace
      - active mesh-dock migration in all three core repos
    control_status: CONTROLLED
    lesson: >-
      Shared short identifiers must be globally role-classified before they are
      reused as task verbs, states or authority signals.
    lookup_tags: [namespace, status, action, moniker, 3pc, glob, systemic]


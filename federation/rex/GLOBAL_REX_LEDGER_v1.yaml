        - GBOGEB/cryoplant-project
    first_seen: ABACUS_PR_1119_REVIEW
    last_seen: CRYOPLANT_PR_886_ACTIVE_DOCK_SWEEP
    severity_stars: 4
    frequency:
      observed_count: 2
      unit: affected_active_docks
      impacted_repo_count: 2
      impacted_workflow_count: 0
      measurement_window: W112
    recurrence: CROSS_REPO_RECURRING
    symptom: >-
      New receiver records used W112 monikers while active .mesh/MESH_DOCK.yaml
      files still advertised legacy W111 action_classes.
    root_cause: receiver-only migration did not initially include active discovery consumers
    action_moniker: SEM
    repair_method: migrate active docks and explicitly expose action_monikers plus reserved_status_keys
    verification:
      abacus_head_sha: 7d57f91964e22f3e0fff3f9d62dfc04a522dc942
      abacus_docs_validation_run_id: 34578423700
      cryoplant_head_sha: ab01af58dd5b99ef5a1b0a8a72fb686193a018db
      result: ABACUS_PASS_CHILD_RUNTIME_NOT_STARTED
    control_guard:
      - mesh dock protocol 1.1 requires separate namespaces
      - CODEX GLOB tests assert its active dock migration
    control_status: CONTROLLED
    lesson: migration is incomplete until active discovery/dispatch consumers change, not only new receipts
    lookup_tags: [mesh-dock, federation, consumer, stale, cross-repo]

  - rex_id: REX-W112-005
    signature: AUTHORITY.PROOF_GATE.UNBOUND_PROMOTION
    issue_kind: REVIEW_FINDING
    family: AUTHORITY
    repo:
      primary: GBOGEB/cryoplant-project
      impacted: [GBOGEB/cryoplant-project]
    first_seen: CRYOPLANT_PR_886_REVIEW
    last_seen: CRYOPLANT_PR_886_REVIEW
    severity_stars: 4
    frequency:
      observed_count: 2
      unit: review_findings
      impacted_repo_count: 1
      impacted_workflow_count: 0
      measurement_window: W112
    recurrence: CLUSTERED_LOCAL
    symptom: >-
      Child routing could have enabled moniker use before producer CI proof, and
      a superseding producer could have been accepted without rebinding the
      exact consumer chain.
    root_cause: proof-gate permission and exact-head lineage were initially expressed too loosely
    action_moniker: RECEIPT
    repair_method: >-
      Gate child moniker selection on bound proof and freeze exact CODEX and
      ABACUS heads plus matching run/job evidence into child re-entry.
    verification:
      child_head_sha: ab01af58dd5b99ef5a1b0a8a72fb686193a018db
      code_review_findings_addressed: 2
      result: STATIC_CONTRACT_REPAIRED
    control_guard:
      - exact_head_sha required at both upstream planes
      - child permission says may_select_action_moniker_after_bound_proof
    control_status: CONTROLLED
    lesson: a later green producer is not proof unless every consuming receipt is rebound to it
    lookup_tags: [authority, exact-sha, proof-gate, promotion, child]

  - rex_id: REX-W112-006
    signature: RUNTIME.GITHUB_ACTIONS.ZERO_STEP_PREEXECUTION
    issue_kind: BLOCKER
    family: RUNTIME
    repo:
      primary: GBOGEB/cryoplant-project
      impacted: [GBOGEB/cryoplant-project]
    first_seen: 34578622119
    last_seen: 34578800214
    severity_stars: 5
    frequency:
      observed_count: 8
      unit: proven_zero_step_failed_jobs
      impacted_repo_count: 1
      impacted_workflow_count: 4
      measurement_window: W112 final child proof window
      evidence_minimum: true
    recurrence: CROSS_WORKFLOW_RECURRING
    symptom: >-
      Multiple child GitHub Actions jobs failed before recording any execution
      steps; a bounded Federation Smoke rerun reproduced the same zero-step state.
    root_cause: UNKNOWN_PREEXECUTION_RUNNER_OR_ALLOCATION_LAYER
    action_moniker: RUNTIME
    repair_method: >-
      Do not patch application/contract code without an observed failing step;
      repair runner/allocation until any relevant job executes >0 steps, then
      recurse on the first actual red.
    verification:
      federation_smoke_first_run_id: 34578622119
      federation_smoke_first_job_id: 103196779014
      federation_smoke_rerun_job_id: 103197105873
      final_head_federation_run_id: 34578800214
      final_head_federation_job_id: 103197333388
      verify_ssot_run_id: 34578622175
      runner_sentinel_run_id: 34578622100
      runner_family_run_id: 34578622097
      result: REPRODUCED_ZERO_STEP
    control_guard:
      - distinguish EX=ZERO_STEPS from executed test failure
      - child receipt explicitly withholds global runtime DoV
      - RUNTIME precedes RED until execution actually starts
    control_status: DEFERRED
    lesson: zero-step failures are infrastructure evidence, not evidence that repo code failed its tests
    lookup_tags: [runner, github-actions, zero-step, preexecution, runtime, blocker]


    symptom: actions/* referenced by mutable major tags in newly added workflows
    root_cause: new workflows copied tag refs while main already carried SHA pins
    action_moniker: HARDEN
    repair_method: >-
      Pinned to SHAs verified by git ls-remote against the upstream tags and
      reused main's canonical pins (checkout v7.0.1, setup-python v7.1.0,
      upload-artifact v7.0.2, download-artifact v8.0.2, cache v6.1.0).
    verification:
      exact_head_sha: bf0d825 / 7aaf5f6
      result: PASS
      evidence: all 16 code-scanning threads closed on re-analysis of the new heads
    control_guard:
      - reuse one verified pin map; never hand-type a SHA
      - MAROON lane <repo>:review-provenance-pin
    control_status: VERIFIED
    lesson: copy pins from main, not tags from examples; verify each SHA against its tag before use
    lookup_tags: [semgrep, provenance-pin, github-actions, sha-pin]


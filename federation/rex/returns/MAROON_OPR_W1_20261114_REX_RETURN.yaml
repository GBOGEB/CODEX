    symptom: a sed-style rewrite of `uses:` lines silently deleted following blank lines
    root_cause: \s*$ under re.MULTILINE matches newlines
    action_moniker: HARDEN
    repair_method: "[ \\t]*$ instead of \\s*$; caught by an asymmetric diffstat before commit"
    verification:

# Wave namespace SSOT (hand-maintained). The generated WAVE_REGISTER.yaml is
# derived from this file plus a path scan of the federation repos.
#
# Why: the letter "W" carries at least six unrelated meanings across the
# federation. A bare "W3" or "W007" is ambiguous; a canonical key is not.
# Canonical key form: <NAMESPACE>:<local id>, e.g. QPS:W113, HYG:W3, CP:W1.C1.I3.S1
#
# Rules are tried top to bottom; the first match wins. Unmatched numeric W ids
# fall through to QPS with confidence "inferred".
schema: codex.wave_namespaces/0.1
authority: index_only   # GLOBAL_INDEX_NE_GLOBAL_AUTHORITY (GLOB.yaml); owners keep wave status
namespaces:
  - key: CP
    name: CODE PURPLE iteration coordinate
    form: W<wave>.C<cycle>.I<iteration>.S<sub>
    id_regex: '(?<![A-Za-z0-9])W(\d+)\.C(\d+)\.I(\d+)(?:\.S(\d+))?'
    home: GBOGEB/pipeline-automation-hub
    source: mission-control/federation-atlas/CODE_PURPLE_ITERATION_SERIES_v1.json
  - key: HYG
    name: Branch/PR hygiene governance waves (Program W010 lineage)
    form: W<n>, n in 1..10
    path_context: governance/branch_hygiene/
    home: all members
  - key: ULTRA
    name: QPS-TRIAGE-ULTRA waves
    form: W<n>, n in 0..2
    path_context: mission-control/qps-triage-ultra/
    home: GBOGEB/pipeline-automation-hub
  - key: BOOT
    name: Repository bootstrap waves (Wave-0, W001..W007, PR-001 scaffold)
    form: Wave-0 | W00<n>
    id_regex: '(?<![A-Za-z0-9])(?:[Ww]ave-0|W00[0-9])(?![0-9])'
    home: GBOGEB/CODEX handover/CURRENT.json, ABACUS wave/W001-* branches
  - key: JADE
    name: JADE point-release readiness pulses (N+k) and rolling5 pulses (P000n)
    form: N+<k> | P<nnnn>
    id_regex: '(?<![A-Za-z0-9])(?:N\+(\d+)|n(\d+)_|P(\d{4}))(?![0-9])'
    path_context: mission-control/jade_temple/
    home: GBOGEB/pipeline-automation-hub
  - key: QPS
    name: Federation QPS / mesh wave sequence (W10..W999)
    form: W<nnn>
    id_regex: '(?<![A-Za-z0-9])[Ww](?:ave[-_]?)?(\d{2,3})(?![0-9A-Za-z])'
    note: >-
      Default namespace for numeric waves. PR governance headers (WAVE ^W[0-9]{3}$)
      refer to this sequence. Ids below W10 found outside a namespace context are
      reported as QPS with confidence "inferred" so collisions stay visible.
status_enum:
  # Status is set by the owning repo, never inferred by the generator.
  - OBSERVED      # path evidence only (generator default)
  - ACTIVE
  - CLOSED
  - SUPERSEDED
  - HOLD

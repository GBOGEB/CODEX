# Federation-owned (elevated) waves. Rules: WAVE_NAMING_RULES.yaml#elevation.
#
# A wave id that the wider federation recognises is not awarded to one member
# repo. It is owned by the FEDERATION; CODEX keeps this file as steward (index
# keeper, no authority transfer). Each member repo declares its role in its
# own .waves/WAVE_CLAIMS.yaml; `origin` (first commit) declares `producer`.
#
#   CONVERGED   the repos already carry one name for the id
#   DEVELOPING  the id is federation-wide, the repos name it differently; the
#               name below is a working title the participants develop
#
# All entries start at status HOLD: a name may still be renamed once before an
# owner sets ACTIVE (or CLOSED). CODEX is public, so names and aliases are
# built only from evidence in public repos.
#
# Validate: python scripts/wave_claims.py validate-global

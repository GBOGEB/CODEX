  - {id: edge.vault_to_keb, from: repo.private_docs, to: repo.codex, type: METADATA_HASH_PROVENANCE_ONLY, authority_transfer: false}
  - {id: edge.vault_to_child, from: repo.private_docs, to: repo.cryoplant, type: PRIVATE_SOURCE_IDENTITY_CONFIRMATION, authority_transfer: false}

promotion_policy:
  register_local_ssot_when:
    - locator exists on declared default branch or immutable commit
    - role and authority boundary are explicit
  mark_consumer_resolvable_when:
    - inputs and outputs are explicit
    - at least one inbound or outbound graph edge is declared
    - global glossary domains are assigned
  mark_receipt_bound_when:
    - exact source/head SHA is present
    - immutable output/receipt digest is present
    - execution contains greater_than_0 observed steps when executable
  never_promote_from:
    - repository name alone
    - README claim alone
    - copied glossary text without authority pointer
    - reference or reading repository content alone
    - runtime success alone

measured_census:
  detailed_nodes: 11
  core_nodes: 3
  active_worker_or_hub_nodes: 8
  detailed_nodes_with_local_level1_ssot: 7
  active_node_without_level1_ssot: GBOGEB/codespaces-jupyter
  support_validation_catalog_nodes: 18
  reference_knowledge_catalog_nodes: 10
  experiment_sandbox_catalog_nodes: 8
  known_correction_to_W110: >-
    W110 treated five active satellites as if local SSOT pointers still needed to
    be created. W111 distinguishes pointer existence from global registration
    and receipt binding; four of those five already expose level1/ssot.json.

next_gate:
  - add a level1/ssot.json or explicit equivalent pointer to GBOGEB/codespaces-jupyter
  - bind this global registry into ABACUS DOW consumption
  - bind this global registry into cryoplant child consideration without authority transfer
  - progressively promote support/reference nodes only when a concrete edge and first use case are observed

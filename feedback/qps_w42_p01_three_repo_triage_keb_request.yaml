purpose: >-
  Validate the semantic and governance boundaries for the W42/P01 three-repository triage.
  The KEB plane must prevent silent promotion between review evidence, bidder evidence, exact source
  attribution, RTM mapping, compliance, price and graph multiplier state.
public_parent_boundary:
  forbidden_content:
    - raw_MSG_or_email_body
    - tender_PDF_content
    - confidential_commercial_text
    - bidder_private_document_extracts
  allowed_content:
    - hashes
    - counts
    - sanitized_identifiers
    - schemas
    - semantic_rules
    - derived_metrics
semantic_contract:
  evidence_layers:
    - PAGE_BOUND_REVIEW_EVIDENCE
    - BIDDER_PAGE_CANDIDATE_MAPPING
    - ORIGINAL_MSG_EXACT_ATTRIBUTION
    - EXACT_PROMOTED_MSG_BIDDER_RTM_BINDING
    - CANONICAL_REQUIREMENT_ACCEPTANCE
  mandatory_distinctions:
    - page_bound_review_NE_original_MSG_exact_attribution
    - candidate_mapping_NE_exact_binding
    - reviewed_NE_compliant
    - deviation_NE_NOK
    - clarification_NE_rejection
    - parent_derived_NE_child_authority
    - postulated_cost_NE_evaluated_price_delta
    - graph_adjacency_NE_exact_multiplier_edge
  source_promotion_rule: >-
    Exact MSG attribution requires exact filename, SHA256, sender, date/time, subject and paragraph locator,
    followed by substantive match. Exact bidder evidence requires document identity plus page/section locator.
    Exact RTM promotion requires predicate-level substantive alignment; keyword proximity is insufficient.
  coverage_rule: >-
    The Buildings & Utilities denominator remains frozen at 53. Report page-bound review, bidder-page
    candidate mapping, original-MSG exact attribution and exact promoted union as independent surfaces.
  multiplier_rule: >-
    The fixed W40 3D cohort remains unchanged until new direct source-bound model-object -> building/utility/interface
    edges are admitted. Do not increase M from downstream review density alone.
  pca_rule: NO_REFRESH_IN_W42_P01

- title: Who governs helium-4 physics
  section: AUTHORITY
  governance:
  - gate: 0 < T <= 4.5 K
    rule: HEPAK governs, including He-II below the lambda point
  - gate: T > 4.5 K
    rule: CoolProp (Ortiz-Vega EOS) governs, including supercritical
  - gate: T < 2.1768 K
    rule: CoolProp out of range in any role (COOLPROP_OUT_OF_RANGE)
  - gate: NIST
    rule: validation reference only, never governing
  body:
  - 'CODEX and pinned ABACUS routing: PARITY at every probe (1.8, 1.99, 2, 2.1768, 3, 4.5, 4.6, 300 K).'

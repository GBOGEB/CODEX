schema: gbogeb-mesh-dock/1.1
repo: GBOGEB/CODEX
node_id: repo.codex
ring: R0_CORE_AUTHORITY
role: KEB_SEMANTIC_PROVENANCE_RUNTIME
local_ssot:
  manifest: ssot/manifest.yaml
  glossary: PIPELINE/GLOSSARY.yaml
  global_census: federation/mesh/GLOBAL_HIVE_CENSUS_v1.yaml
  action_taxonomy: federation/mesh/GLOBAL_ACTION_TAXONOMY_v1.yaml
  glob: GLOB.yaml
global_directory:
  repo: GBOGEB/CODEX
  glob: GLOB.yaml
  census: federation/mesh/GLOBAL_HIVE_CENSUS_v1.yaml
  glossary: federation/mesh/GLOBAL_GLOSSARY_v1.yaml
  action_monikers: federation/mesh/GLOBAL_GLOSSARY_ACTION_CODES_v1.yaml
  where_used: federation/mesh/GLOBAL_WHERE_USED_v1.yaml
  dock_protocol: federation/mesh/GLOBAL_MESH_DOCK_PROTOCOL_v1.yaml
  status_contract: governance/mesh/MESH_STATUS_CONTRACT_v1.yaml
authority:
  may: [semantic_normalization, provenance_validation, exact_SHA_receipts, mesh_routing_vocabulary]
  must_not: [promote_QPS_engineering_truth, redefine_child_domain_terms]
inputs: [child_evidence_tuples, worker_receipts, glossary_extensions, runtime_results]
outputs: [KEB_receipts, semantic_findings, global_mesh_index, routing_contracts]
action_monikers: [CLOSE, RED, RUNTIME, SEM, SSOT, RECEIPT, ENABLE, HARDEN, CLEAN, MAINT, READ, EXP, WATCH]
reserved_status_keys: [CG, WD, RR, DR, SR, HK, EX, FE, QH, KR, CR, PB, BG]
lookup_examples:
  - what can CODEX do?
  - show RED
  - what is blocking the current gate?
  - show inbound evidence
  - show outbound actions
first_use_case: validate and bind a child evidence/runtime tuple before DOW consumption

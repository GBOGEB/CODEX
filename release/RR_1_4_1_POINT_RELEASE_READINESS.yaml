blockers:
  - id: B1
    gate: K5
    finding: >-
      Deploy GitHub Pages fails at "Build verified Pages output" (pytest on Python 3.11):
      test_health_dimensions_on_synthetic_repo needs Python >= 3.12 SyntaxWarning semantics.
    repair: PR #1181 (merged 2026-10-25)
    remaining: >-
      Pages publishes only the newest main push that passed Runtime Release Gate; that gate
      runs on runtime paths only, so the fix deploys with the next merge touching those paths
      (federation_runtime/**, docs/wave_packages/runtime/**, docs/rtm/**, governance/**, ...).
  - id: B4
    gate: K5
    finding: >-
      Deploy GitHub Pages fails again on main e462125 (run 41172462223, 2026-10-31): job build,
      step "Build verified Pages output", exit code 2. Last success 61cfb48 (2026-10-27).
      Exit 2 from that step's final `pytest -q` usually means a collection error. Not reproduced
      locally: on Python 3.11 at e462125 the only collection errors are packages this probe
      sandbox lacks, and the three test files changed since 61cfb48 pass. Cause unconfirmed
      (job log not readable from the probe session).
    next: read the job log; reproduce with the Pages install set on Python 3.11; repair only that invariant
  - id: B2
    gate: K4
    finding: MissionControl Mycelium CI parity preflight red on main (receipt counts 528 vs list 530).
    repair: PR #1182 (merged 2026-10-25)
  - id: B3
    gate: K4/K5
    finding: >-
      Ruleset Codex_main_protect (enabled 2026-10-23 14:04Z) requires pull requests on main;
      bot pushes are refused: CODEX Metrics "Commit metrics artefacts" (run 40133986382),
      MissionControl Inventory Reconcile (run 40133966621). Update Documentation on Code
      Changes also fails ("Publish reusable docs update branch", run 40133927552); cause not
      confirmed (log not readable from the probe session).
    repair: >-
      Owner decision 2026-10-25: bots open PRs (no bypass). PR #1184; Actions must be allowed
      to create pull requests (Settings -> Actions -> General).


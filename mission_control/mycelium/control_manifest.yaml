schema_version: "0.5"
surface_id: MISSIONCONTROL_MYCELIUM
owner: CODEX_UI_GOVERNANCE
repository: GBOGEB/CODEX
authority_transfer: false
formal_credit_delta: 0
engineering_authority: false
purpose: >-
  User-facing control surface for federated execution, lineage, dependency,
  evidence, recovery, reverse-pressure backlog and outward artifact navigation.

source_authorities:
  codex:
    class: LOCAL_AUTHORITATIVE
    manifest: ssot/manifest.yaml
    runtime_registry: ssot/registry/runtime_registry.yaml
  abacus:
    class: REMOTE_AUTHORITATIVE
    role: EXECUTION_AND_DOW
    mutation_by_codex: false
  cryoplant_project:
    class: REMOTE_AUTHORITATIVE
    role: ENGINEERING_TRUTH
    mutation_by_codex: false

layout:
  canonical: "2x3"
  selectable_modes: ["2x3", "3x2", "golden_focus", "single_focus"]
  panel_aspect_ratio: "16/9"
  golden_focus_ratio: "1.618:1"
  whitespace_policy: "preserve function and ratio; unused area may remain light/dark space rather than distort content"
  panels:
    - id: COMMAND_INPUT_ROOT
      order: 1
      title: Command / Input Root
      inherits: [repository_topology_context]
      functions: [text_input, YAML_JSON_input, config_upload, dry_run_apply, manual_steering, source_authority_context]
    - id: EXECUTION_RECOVERY
      order: 2
      title: Execution / Recovery
      inherits: [execution_flow]
      functions: [active_lanes, current_atom, last_good_checkpoint, blocker, retry, resume, next_legal_transition]
    - id: MYCELIUM_GRAPH
      order: 3
      title: Mycelium Graph
      inherits: [interaction_graph]
      functions: [graph_navigation, authority_overlay, evidence_overlay, critical_path_overlay, BD_pressure_overlay, source_deeplinks]
    - id: OUTPUT_EVIDENCE
      order: 4
      title: Output / Evidence
      inherits: [evidence_lineage, outward_artifacts]
      functions: [artifacts, manifests, hashes, evidence, downloads, provenance]
    - id: ANALYTICS
      order: 5
      title: Analytics
      inherits: [DMAIC, KPI, PCA, BT, graph_density]
      rules:
        PCA: DIAGNOSTIC_ONLY_UNLESS_SEPARATELY_GOVERNED
        BT: OBSERVED_PAIRWISE_OUTCOMES_ONLY
        KPI: SOURCE_AND_POPULATION_REQUIRED
    - id: FEDERATION_CONTROL
      order: 6
      title: Federation Control
      inherits: [repository_topology]
      functions: [repo_heads, bridge_status, source_target_lineage, cherry_pick_state, merge_state, conflict_state, remote_authority_state]
  responsive:
    desktop: "2 columns x 3 rows"
    tablet: "2 columns x 3 rows"
    mobile: "1 column x 6 rows"
  focus_mode: true
  user_selectable_focus: true
  themes: [light, dark]

control_plane:
  version: "0.2.1"
  reentry_manifest: mission_control/mycelium/reentry_v0_2.yaml
  governed_projection: mission_control/mycelium/control_plane_projection.json
  pages_projection: docs/data/missioncontrol_control_plane.json
  predecessor_proof: mission_control/mycelium/receipts/MYCELIUM_V02_PR839_PROOF.json
  current_proof: mission_control/mycelium/receipts/LIVE_FEDERATION_PULSE_PR845_PROOF.json
  current_capability_status: LIVE_FEDERATION_PULSE_CONTROLLED_GREEN
  next_edge: AUTHENTICATED_EXECUTION_GATEWAY_V0_1_EXACT_HEAD_PROOF
  command_input:
    static_pages_mode: STAGE_OR_DRY_RUN_ONLY
    authenticated_apply_gateway_required: true
    false_mutation_claim_forbidden: true
    live_source_probe: https://api.github.com/repos/GBOGEB/CODEX/commits/main
    gateway_contract: mission_control/mycelium/gateway_contract.yaml
    gateway_workflow: .github/workflows/missioncontrol-command-gateway.yml
    gateway_surface: https://github.com/GBOGEB/CODEX/actions/workflows/missioncontrol-command-gateway.yml
    source_lock: EXACT_SHA
    mutation_mode: AUTOMATION_BRANCH_PR_ONLY
    direct_main_write: false
    allowed_actions: [REFRESH_FEDERATION_HEADS]
  execution_model:
    universal_graph_may_contain_cycles: true
    executable_projection_must_be_DAG: true
    first_red_scope: AFFECTED_LANE_ONLY
    independent_lanes_continue: true
  reverse_pressure_queues: [EXECUTION, BLOCKED, RETURN, REVIEW, PUBLICATION, OWNER_ACTION]
  rendering:
    data_contract: GOVERNED_JSON_PROJECTION
    fallback_renderer: HTML_SVG
    plotly_failure_blocks_core: false
    matplotlib_failure_blocks_core: false
    pages_failure_blocks_core: false
    browser_disconnect_blocks_core: false
  federation:
    strategy_order: [REFERENCE, BRIDGE, GENERATED_PROJECTION, ITEM_IMPORT, CHERRY_PICK, BOUNDED_MERGE, FULL_MERGE]
    required_provenance: [source_repo, source_ref, source_sha, target_repo, target_ref, target_sha, mechanism, authority_before, authority_after, proof]
  artifact_navigation:
    mode: GRAPH_DRIVEN
    provenance_edges_visible: true
    source_sha_visible: true
    proof_refs_visible: true
    renderer_independent: true

graph_contract:
  universal_graph_may_contain_cycles: true
  executable_projection_must_be_DAG: true
  node_types:
    - repo
    - branch
    - commit
    - issue
    - pull_request
    - workflow
    - test
    - requirement
    - decision
    - artifact
    - output
    - queue
    - atom
    - epic
    - domain
    - topic
    - analysis
    - property_source
    - metric
    - projection
    - log
    - port
    - dock
    - repository
    - job
    - config
    - interface
    - evidence
    - human_action
    - external_authority
  edge_types:
    - contains
    - depends_on
    - precedes
    - consumes
    - produces
    - proves
    - blocks
    - unblocks
    - federates
    - publishes
    - derives_from
    - supersedes
    - asks
    - requests_analysis
    - requires_property
    - uses_model
    - uses_property_source
    - calculates
    - validates
    - challenges
    - refutes
    - constrains
    - updates_triage
    - raises_priority
    - lowers_priority
    - observes
    - measures
    - projects_as
    - implements
    - references
    - requires_return_from
  rules:
    directed: true
    every_edge_has_source: true
    every_promoted_state_has_proof_edge: true
    remote_engineering_truth_cannot_be_promoted_by_codex: true
    orphan_authoritative_nodes_forbidden: true

execution_contract:
  uninterrupted_goal: true
  stream_disconnect_is_not_execution_failure: true
  resume_from_checkpoint_without_replay: true
  replay_completed_slice: false
  checkpoint_fields:
    - repo
    - branch
    - head_sha
    - current_step
    - completed_steps
    - active_blockers
    - evidence_refs
    - next_legal_transition
  auto_recovery:
    transient_stream_timeout:
      action: CONTINUE_FROM_LAST_DURABLE_CHECKPOINT
      stop_execution: false
    connector_timeout:
      action: RETRY_IDEMPOTENT_READ_OR_CONTINUE_INDEPENDENT_LANES
      max_retries: 2
      stop_other_lanes: false
    write_conflict:
      action: REFRESH_EXACT_PATH_AND_RECONCILE
      stop_conflicting_lane_only: true
    failed_test:
      action: CLASSIFY_FIRST_RED
      stop_affected_lane_only: true
    missing_external_authority:
      action: HOLD_NODE_AND_CONTINUE_UNBLOCKED_GRAPH
      stop_execution: false
    user_steer:
      action: REPRIORITIZE_ACTIVE_EDGE_WITHOUT_REPLAY
      preserve_completed_proof: true
      rebase_required: false
    upstream_main_advanced:
      action: COMPARE_TOUCHED_PATHS_THEN_REBASE_ONLY_IF_MATERIAL
      replay_completed_slice: false

control_loop:
  sequence:
    - REFRESH
    - PROBE
    - RANK
    - EXECUTE
    - PROVE
    - COMMIT
    - PUBLISH
    - OBSERVE
    - LEARN
    - RECURSE
  dmaic:
    define: problem_scope_and_authority
    measure: census_kpi_and_evidence
    analyze: dependency_pca_bt_and_root_cause
    improve: bounded_change
    control: exact_sha_proof_and_drift_watch
  reverse_pressure:
    enabled: true
    codex_queue_authority: controls/BD_QUEUE_CURRENT.md
    method: >-
      Blocked downstream nodes push urgency to their nearest unresolved
      predecessor; rank the BD queue by dependency fan-out, proof deficit,
      age, criticality and unblock value.
  ranking:
    pca: diagnostic_only_unless_governed_population_exists
    bradley_terry: outcome_based_only
    no_synthetic_scores: true

current_next_contract:
  required_ui_fields:
    - current_authority
    - current_node
    - exact_next_edge
    - active_blockers
    - admitted_parallel_edges
    - last_completed_proof
    - recovery_state
    - user_steering_events
  rule: >-
    The UI may refresh presentation state without replaying completed execution.
    A stream timeout alone never resets current_node or exact_next_edge.

temporal_lineage:
  enabled: true
  event_types:
    - AUTHORITY_FREEZE
    - USER_STEER
    - EXECUTION_START
    - PROOF_BOUND
    - OUTWARD_PROJECTION
    - EXTERNAL_RETURN
    - RECOVERY
  required_fields: [event_time, source_sha, parent_event, content_ref]

federation_router:
  default_preference: [bridge, cherry_pick, federation, pin, full_merge]
  full_merge_default: false
  record_fields: [source_repo, source_sha, target_repo, target_sha, mechanism, proof]
  mechanisms:
    bridge: preserve independent upstream authority and exchange typed artifacts or receipts
    cherry_pick: bounded compatible commit with exact provenance
    federation: independent repos share contract, lineage and freshness probes
    pin: external source remains upstream-owned at an exact revision
    full_merge: only when ownership and authority intentionally converge

definition_of_done:
  - graph_and_manifest_validate
  - all_active_nodes_have_owner_state_and_link
  - all_completed_nodes_have_proof
  - pages_surface_renders_without_external_js_dependency
  - responsive_layout_works_at_multi_size
  - outward_artifact_links_resolve_or_are_explicitly_withheld
  - checkpoint_can_restart_without_chat_history

definition_of_validation:
  global: WITHHELD_UNTIL_EXECUTED_PROOF
  levels:
    LOCAL_REPRODUCIBILITY: [structural_qa, visual_or_runtime_qa]
    EXACT_SHA_RECEIPT: [committed_sha, executed_proof, bound_receipt]
    EXTERNAL_RETURN: [typed_return, source_identity, acceptance_decision]
  no_credit_from_visualization_alone: true
  no_credit_from_analytics_alone: true

projection_invariant:
  id: THIS_IS_THE_WAY
  statement: "ENGINEERING VIEW and CONTROL VIEW are two projections of the same graph"
  one_graph_multiple_projections: true
  duplicate_domain_state_forbidden: true
  engineering_projection:
    purpose: physical_system_knowledge_interfaces_calculations_and_evidence
    canonical_example:
      - Cryoplant
      - 2_K_refrigeration
      - B_interface
      - pressure_drop
      - calculation
  control_projection:
    purpose: priority_urgency_blockers_returns_and_next_legal_transition
    canonical_example:
      - P0
      - CRYO_IF_B_unresolved
      - DOW_calculation_missing
      - blocks_ICD_freeze
      - blocks_offer_disposition
  rule: >-
    Projection filters may hide or emphasize nodes and edges, but may not copy,
    fork, silently reinterpret or promote the underlying engineering state.

observability_contract:
  common_node_identity_required: true
  status_classes: [MEASURED, DERIVED_FROM_MEASURED, WITHHELD]
  dimensions:
    maturity:
      intent: topic engineering maturity and closure
      inputs: [requirement_coverage, interface_closure, evidence_coverage, validation_coverage]
    qa:
      intent: governed QA gate health
      formula: passed_required_gates / executed_required_gates
    code_health:
      intent: executable/code control health
      inputs: [qa, hard_debt, test_health, lint_health]
    debug:
      intent: first-red and recurrence control
      inputs: [active_first_reds, recurrent_reds, mean_repair_iterations]
    docking:
      intent: federated repo/source attachment health
      formula: healthy_declared_docks / declared_docks
    ports:
      intent: interface/probe transport health
      formula: healthy_ports / declared_ports
    logs:
      intent: runtime and CI observability health
      formula: parsed_required_logs / expected_required_logs
    pressure:
      intent: reverse-pressure backlog loading
      inputs: [urgency, criticality, downstream_blocks, unblock_value, proof_deficit, age]
    dmaic:
      intent: main-topic lifecycle control
      phases: [DEFINE, MEASURE, ANALYZE, IMPROVE, CONTROL]
  analytics:
    pca:
      role: diagnostic_projection_only
      minimum_complete_observations: 3
      no_importance_claim_from_component_order: true
    bradley_terry:
      role: pairwise_outcome_ranking_only
      minimum_pairwise_outcomes: 1
      no_synthetic_pairwise_outcomes: true
  progress_tracking:
    append_only_history: mission_control/mycelium/progress_history.json
    metrics_snapshot: mission_control/mycelium/metrics_snapshot.json
    pages_metrics_view: docs/data/missioncontrol_metrics.json

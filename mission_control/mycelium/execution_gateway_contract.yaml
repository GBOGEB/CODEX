schema_version: "0.1"
gateway_id: MISSIONCONTROL_AUTHENTICATED_EXECUTION_GATEWAY
state: BOUNDED_APPLY_IMPLEMENTED_DISABLED_EXACT_HEAD_GREEN
owner: CODEX_EXECUTION_GOVERNANCE

authority:
  authority_transfer: false
  formal_credit_delta: 0
  engineering_credit_delta: 0
  codex_execution_orchestration_only: true
  remote_engineering_authority_mutation: false
  remote_execution_authority_mutation: false

client_boundary:
  static_pages_mode: STAGE_OR_DRY_RUN_ONLY
  secrets_in_browser_forbidden: true
  client_asserted_identity_is_trusted: false
  apply_without_gateway_forbidden: true

authentication:
  required: true
  principal_bound_server_side: true
  supported_future_transports:
    - AUTHENTICATED_CONNECTOR
    - GITHUB_APP_BACKEND
    - MANUALLY_APPROVED_ACTION
    - GITHUB_ACTIONS_WORKFLOW_DISPATCH
  selected_transport: GITHUB_ACTIONS_WORKFLOW_DISPATCH
  transport_state: AUTHENTICATED_STAGE_ONLY
  enabled_mutation_transports: []

authorization:
  default: DENY
  exact_target_repo_required: true
  exact_target_ref_required: true
  exact_head_sha_required: true
  allowlisted_action_required: true
  least_privilege_required: true
  remote_mutation_default: DENY
  action_classes:
    STAGE_ONLY:
      enabled: true
      mutates_repository: false
    APPLY_BOUNDED_CODEX:
      enabled: false
      mutates_repository: true
      allowed_repositories: [GBOGEB/CODEX]
    REQUEST_TYPED_REMOTE_RETURN:
      enabled: true
      mutates_repository: false
      targets: [GBOGEB/ABACUS, GBOGEB/cryoplant-project]

execution_guards:
  optimistic_concurrency: EXPECTED_HEAD_SHA_MUST_MATCH
  idempotency_key_required: true
  replay_of_completed_request_forbidden: true
  changed_path_allowlist_required_for_mutation: true
  dry_run_before_apply_required: true
  approval_before_mutation_required: true
  first_red_scope: AFFECTED_LANE_ONLY
  independent_lanes_continue: true

audit:
  append_only_receipt_required: true
  request_digest_required: true
  before_sha_required: true
  after_sha_required_if_mutated: true
  workflow_run_job_binding_required_if_action_runner_used: true
  evidence_refs_required: true
  receipt_schema: mission_control/mycelium/schemas/execution_receipt.schema.json

request_schema: mission_control/mycelium/schemas/execution_request.schema.json

bounded_apply_runtime:
  policy: mission_control/mycelium/bounded_apply_policy.yaml
  planner: scripts/missioncontrol_bounded_apply.py
  test: tests/test_missioncontrol_bounded_apply.py
  replay_ledger: mission_control/mycelium/gateway/bounded_apply_ledger.json
  target_repository: GBOGEB/CODEX
  target_ref: main
  action_class: APPLY_BOUNDED_CODEX
  implementation_state: IMPLEMENTED_DISABLED_EXACT_HEAD_GREEN
  mutation_enabled: false
  execute_permitted: false
  enabled_mutation_transports: []
  success_decision_while_disabled: WITHHELD_MUTATION_DISABLED
  exact_head_required: true
  changed_path_allowlist_required: true
  explicit_approval_ref_required: true
  exact_head_dry_run_receipt_required: true
  completed_replay_forbidden: true

transport_runtime:
  workflow: .github/workflows/missioncontrol-authenticated-transport.yml
  executor: scripts/missioncontrol_authenticated_transport.py
  target_repository: GBOGEB/CODEX
  target_ref: main
  enabled_action_class: STAGE_ONLY
  mutation_enabled: false
  receipt_storage: GITHUB_ACTION_ARTIFACT
  replay_guard: RECEIPT_ARTIFACT_IDEMPOTENCY_DIGEST
  concurrency: SERIAL_FAIL_CLOSED
  exact_head_refresh_before_authorize: true
  payload_digest_verified: true
  workflow_run_job_bound_in_receipt: true

promotion:
  design_completion_does_not_enable_apply: true
  authenticated_transport_proof_does_not_enable_apply: true
  apply_implementation_requires_separate_bounded_slice: true
  implementation_success_does_not_transfer_remote_authority: true
  bounded_apply_exact_head_proof_does_not_enable_mutation: true
  mutation_enablement_requires_separate_governance_promotion: true
  bounded_apply_proof_receipt: mission_control/mycelium/receipts/BOUNDED_APPLY_DISABLED_V01_PR894_PROOF.json
  mutation_promotion_state: WITHHELD_EXPLICIT_PROMOTION_REQUIRED
